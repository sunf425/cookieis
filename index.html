const focusEnd=el=>{if(!el)return;el.focus();let range=document.createRange(),selection=window.getSelection();range.selectNodeContents(el);range.collapse(false);selection.removeAllRanges();selection.addRange(range)};
window.addEventListener('keydown',e=>{let task=e.target.closest?.('.tasktext');if(task&&e.key==='Backspace'&&!task.textContent){e.preventDefault();e.stopImmediatePropagation();let card=task.closest('.card'),m=memos.find(x=>x.id===card.dataset.id),taskId=task.closest('.task').dataset.task,visible=tasks(m),position=visible.findIndex(x=>x.id===taskId),prior=visible[position-1],current=m.tasks.find(x=>x.id===taskId);current.deletedAt=now();current.updatedAt=now();m.updatedAt=now();save();setTimeout(()=>focusEnd(prior?document.querySelector(`[data-task="${prior.id}"] .tasktext`):document.querySelector(`[data-id="${m.id}"] .memo`)),0)}},true);

// 1. 좀비 부활을 막는 Tombstone(사망 선고) 삭제 로직으로 교체
window.addEventListener('click', e => {
    let button = e.target.closest?.('.delete');
    if (!button) return;
    
    // 기존의 오작동하는 이벤트 전파 완벽 차단
    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
    
    let card = button.closest('.card');
    let m = memos.find(x => x.id === card.dataset.id);
    if(!m) return;
    
    if (!confirm('이 항목을 영구 삭제하시겠습니까?')) return;
    
    // 데이터를 날리는 것이 아니라 삭제 마커로 덮어쓰고 최신 시간으로 갱신
    m.content = '[[TRASH_TOMBSTONE]]';
    m.status = 'archive'; // DB의 deleted_at을 활성화하기 위함
    m.updatedAt = now();
    
    save(); // 로컬 저장 및 서버로 Tombstone 전파
}, true);

// 2. 화면 렌더링을 가로채서 Tombstone 마커가 있는 메모는 강제 숨김 처리
const _baseRenderForTrash = render;
render = () => {
    _baseRenderForTrash(); // 원래 방식대로 일단 다 그림
    // 그려진 요소 중 무덤 마커를 가진 카드는 화면에서 완전히 제거
    document.querySelectorAll('.card').forEach(card => {
        let m = memos.find(x => x.id === card.dataset.id);
        if(m && m.content === '[[TRASH_TOMBSTONE]]') {
            card.style.display = 'none';
        }
    });
};
