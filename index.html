/* ---------- Final r21 render wrapper ---------- */
const r21RenderBase=render;
render=()=>{
  r21RenderBase();

  drawTagSidebarR21();

  document.querySelectorAll('#list .card').forEach(card=>{
    const m=memos.find(x=>x.id===card.dataset.id);if(!m)return;
    const projectNames=projectNamesInMemo(m);
    const marker=card.querySelector('.block-marker');

    if(!memoMatchesSelectedProjects(m)){
      card.classList.add('project-filter-hidden')
    }else{
      card.classList.remove('project-filter-hidden')
    }

    if(marker){
      marker.classList.add('project-marker-clickable');
      marker.title=projectNames.length
        ?`프로젝트: ${projectNames.map(x=>'@'+x).join(', ')} · 클릭하여 변경`
        :'프로젝트 지정';
      marker.dataset.projectMemo=m.id;
      marker.classList.toggle('has-project',projectNames.length>0);
      if(projectNames.length){
        marker.textContent='●'
      }else{
        marker.textContent=m.important?'🚩':'•'
      }
    }
  });

  /* 프로젝트 필터까지 적용한 후 날짜 헤더/빈 상태를 다시 정리 */
  const list=$('#list');
  if(list){
    const children=[...list.children];
    children.forEach((el,i)=>{
      if(!el.classList.contains('datehead'))return;
      let hasVisible=false;
      for(let j=i+1;j<children.length&&!children[j].classList.contains('datehead');j++){
        const c=children[j];
        if(c.classList.contains('card')&&!c.classList.contains('task-view-hidden')&&!c.classList.contains('project-filter-hidden')){
          hasVisible=true;break
        }
      }
      if(!hasVisible)el.classList.add('project-filter-hidden');
      else el.classList.remove('project-filter-hidden')
    });
    list.querySelector('.r21-project-empty')?.remove();
    const cards=[...list.querySelectorAll('.card')];
    if(cards.length&&!cards.some(c=>!c.classList.contains('task-view-hidden')&&!c.classList.contains('project-filter-hidden'))){
      list.insertAdjacentHTML('beforeend','<div class="empty r21-project-empty">현재 보기 조건에 맞는 기록이 없습니다.</div>')
    }
  }

  updateTaskViewButton()
};

/* =========================================================
   Rev. r30.4_260831
   - 프로젝트 관리창: 선택/필터링 전용
   - 닫기/바깥 클릭은 적용 취소, 전체 프로젝트 보기는 즉시 적용 후 닫기
   - #태그 / @프로젝트 본문 강조
   - 프로젝트 필터링 상태 배지
   - 빠르고 읽기 쉬운 커스텀 툴팁
   ========================================================= */

/* 관리창 닫기: 임시 선택은 버리고 현재 적용 상태 유지 */
const closeProjectManagerWithoutApply=()=>{
  projectManagerSelection=[...selectedProjects];
  $('#projectModal')?.classList.add('hidden')
};
$('#projectManagerClose')?.addEventListener('click',e=>{
  e.preventDefault();
  closeProjectManagerWithoutApply()
});
$('#projectModal')?.addEventListener('click',e=>{
  if(e.target===$('#projectModal'))closeProjectManagerWithoutApply()
});

/* #태그는 진한 녹색, @프로젝트는 진한 노랑~주황색으로 표시합니다. */
mark=s=>{
  let out='',last=0,text=String(s??'');
  /*
    fix14: 최종 mark()에서 URL / #태그 / @프로젝트를 한 번에 처리합니다.
    먼저 esc()한 뒤 replace하면 URL 안의 특수문자나 생성된 HTML이 다시 매칭될 수 있으므로
    원문을 토큰 단위로 순회하고 각 토큰만 안전하게 HTML로 변환합니다.
  */
  const tokenRe=/(https?:\/\/[^\s<]+|www\.[^\s<]+|(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}(?:\/[^\s<]*)?|#([가-힣ㄱ-ㅎㅏ-ㅣ\w-]+)|@([^\s@#<>&]+))/giu;
  text.replace(tokenRe,(match,_whole,tagName,projectName,offset)=>{
    out+=esc(text.slice(last,offset));

    if(match.startsWith('#')){
      const name=tagName||match.slice(1);
      out+=`<span class="hashtag" data-tag="${esc(name)}" contenteditable="false">#${esc(name)}</span>`
    }else if(match.startsWith('@')){
      const name=projectName||match.slice(1);
      out+=`<span class="project-inline" contenteditable="false">@${esc(name)}</span>`
    }else{
      const trimmed=trimUrlPunctuation(match);
      const url=trimmed.url;
      const href=/^https?:\/\//i.test(url)?url:'https://'+url;
      out+=`<a class="memo-link" href="${esc(href)}" target="_blank" rel="noopener noreferrer" contenteditable="false">${esc(url)}</a>${esc(trimmed.tail)}`
    }

    last=offset+match.length;
    return match
  });
  out+=esc(text.slice(last));
  return out
};

  clearTimeout(r22TooltipTimer);
  r22Tooltip.classList.remove('show');
  if(r22TooltipTarget?.dataset.r22Tooltip&&!r22TooltipTarget.hasAttribute('title')){

  r22Tooltip.style.left=x+'px';

};

/* =========================================================
   Rev. r30.4_260831 - 편집 중 동기화 안전장치
   - 5분 자동/Realtime/수동 동기화는 그대로 수행
   - 동기화가 render()를 호출해도 현재 입력 중이면 화면 DOM 교체를 보류
   - 메모/Todo/후기 편집 초안은 동기화 전후 모델에 보존
   - 편집이 끝난 뒤 보류된 render를 한 번만 반영
   ========================================================= */

const r301RenderBase=render;
const r301SyncBase=syncNow;

let r301SyncDepth=0;
let r301DeferredRender=false;
const r301EditBaseline=new WeakMap();

const r301InputValue=el=>{
  if(!el)return '';
  if(el.isContentEditable)return el.innerText;
  return typeof el.value==='string'?el.value:''
};

const r301IsTypingTarget=el=>{
  if(!el||el===document.body)return false;
  if(el.matches?.('.memo,.tasktext,.reviewtext,[data-routine-note],#newMemo,#search,#mobileSearchInput'))return true;
  if(el.isContentEditable)return true;
  return !!el.matches?.('textarea,input[type="text"],input[type="search"],input:not([type])')
};

const r301EditableKind=el=>{
  if(el?.classList?.contains('memo'))return 'memo';
  if(el?.classList?.contains('tasktext'))return 'task';
  if(el?.classList?.contains('reviewtext'))return 'review';
  return null
};

const r301DraftInfo=el=>{
  const kind=r301EditableKind(el);
  if(!kind)return null;

  const card=el.closest?.('.card');
  const memoId=card?.dataset.id;
  if(!memoId)return null;

  let taskId=null;
  if(kind==='task')taskId=el.closest?.('.task')?.dataset.task||null;

  return{
    el,
    kind,
    memoId,
    taskId,
    text:r301InputValue(el),
    baseline:r301EditBaseline.get(el)
  }
};

const r301WriteDraftToModel=(draft,stamp)=>{
  if(!draft)return false;

  const m=memos.find(x=>x.id===draft.memoId);
  if(!m)return false;

  if(draft.kind==='memo'){
    m.content=draft.text;
    if(stamp)m.updatedAt=stamp
  }else if(draft.kind==='task'){
    const t=(m.tasks||[]).find(x=>x.id===draft.taskId);
    if(!t)return false;
    t.text=draft.text;
    if(stamp){
      t.updatedAt=stamp;
      m.updatedAt=stamp
    }
  }else if(draft.kind==='review'){
    m.review=draft.text;
    if(stamp)m.reviewUpdatedAt=stamp
  }else{
    return false
  }

  return true
};

const r301DraftWasEdited=draft=>
  !!draft&&draft.baseline!==undefined&&draft.text!==draft.baseline;

/* 사용자가 실제 편집을 시작한 시점의 원문을 기억합니다. */
document.addEventListener('focusin',e=>{
  const el=e.target;
  if(!r301EditableKind(el))return;
  if(!r301EditBaseline.has(el))r301EditBaseline.set(el,r301InputValue(el))
},true);

/* syncNow 내부 render만 막습니다. 일반적인 버튼/필터 render 동작은 그대로입니다. */
render=()=>{
  const active=document.activeElement;
  const syncRendering=r301SyncDepth>0||busy;

  if(syncRendering&&r301IsTypingTarget(active)){
    /*
      예전 코드가 직접 보관하고 있는 syncNow 참조(Realtime/온라인 복귀 등)로
      동기화가 들어와도 busy=true를 이용해 동일하게 보호합니다.
      이 시점의 editor 문자열도 다시 모델에 남겨 다음 동기화에서 손실되지 않게 합니다.
    */
    const draft=r301DraftInfo(active);
    if(r301DraftWasEdited(draft)){
      const stamp=now();
      if(r301WriteDraftToModel(draft,stamp)){
        localStorage.setItem(DATA,JSON.stringify(memos))
      }
    }

    r301DeferredRender=true;
    return
  }

  const result=r301RenderBase();
  r301DeferredRender=false;
  return result
};

/* 보류된 화면 반영은 사용자가 모든 입력 요소에서 빠져나온 뒤 한 번만 수행합니다. */
document.addEventListener('focusout',e=>{
  const el=e.target;
  if(r301EditableKind(el)){
    /* 실제 변경 여부 판정은 기존 focusout 저장 로직이 처리하도록 baseline만 정리합니다. */
    setTimeout(()=>r301EditBaseline.delete(el),0)
  }

  setTimeout(()=>{
    if(!r301DeferredRender)return;
    if(r301SyncDepth>0)return;
    if(r301IsTypingTarget(document.activeElement))return;
    render()
  },0)
},true);

/* 동기화 전 현재 초안을 pin하고, 동기화 도중 추가 입력된 내용도 종료 시 다시 보존합니다. */
syncNow=async force=>{
  const activeAtStart=document.activeElement;
  const protect=r301IsTypingTarget(activeAtStart);
  let startDraft=protect?r301DraftInfo(activeAtStart):null;

  if(protect)r301SyncDepth++;

  try{
    /* 편집한 초안만 최신 timestamp를 부여해 remote merge가 작성 중 내용을 덮지 못하게 합니다. */
    if(r301DraftWasEdited(startDraft)){
      const stamp=now();
      if(r301WriteDraftToModel(startDraft,stamp)){
        localStorage.setItem(DATA,JSON.stringify(memos))
      }
    }

    return await r301SyncBase(force)
  }finally{
    /*
      네트워크 요청 중에도 사용자는 계속 타이핑할 수 있습니다.
      같은 editor가 계속 활성 상태라면 '동기화 종료 시점'의 최신 문자열을 다시 모델에 보존합니다.
    */
    const activeNow=document.activeElement;
    if(protect&&activeNow===activeAtStart){
      const endDraft=r301DraftInfo(activeNow);
      if(r301DraftWasEdited(endDraft)){
        const stamp=now();
        if(r301WriteDraftToModel(endDraft,stamp)){
          localStorage.setItem(DATA,JSON.stringify(memos))
        }
      }
    }

    if(protect)r301SyncDepth=Math.max(0,r301SyncDepth-1)
  }
};



/* =========================================================
   Rev. r30.4_260831 - 빈 Todo Backspace 자연스러운 삭제/이동
   - 빈 Todo에서 Backspace: 현재 Todo 삭제
   - 이전 Todo가 있으면 이전 Todo 맨 끝으로 이동
   - 첫 Todo/유일한 Todo면 메모 본문 맨 끝으로 이동
   - contenteditable의 <br>, NBSP, zero-width 문자도 빈 Todo로 판단
   ========================================================= */

const r302EditorText=el=>
  (el?.innerText??el?.textContent??'')
    .replace(/\u00a0/g,' ')
    .replace(/[\u200b-\u200d\u2060\ufeff]/g,'')
    .replace(/\r?\n/g,'')
    .trim();

const r302IsEmptyTask=el=>r302EditorText(el)==='';

const r302FocusEnd=el=>{
  if(!el)return;
  el.focus({preventScroll:true});
  const range=document.createRange();
  range.selectNodeContents(el);
  range.collapse(false);
  const sel=window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range)
};

document.addEventListener('keydown',e=>{
  const taskEl=e.target?.closest?.('.tasktext');
  if(!taskEl||e.key!=='Backspace'||e.isComposing)return;
  if(!r302IsEmptyTask(taskEl))return;

  const taskRow=taskEl.closest('.task');
  const card=taskEl.closest('.card');
  const memoId=card?.dataset.id;
  const taskId=taskRow?.dataset.task;
  if(!memoId||!taskId)return;

  const m=memos.find(x=>x.id===memoId);
  if(!m)return;

  const tasks=m.tasks||[];
  const idx=tasks.findIndex(t=>t.id===taskId);
  if(idx<0)return;

  e.preventDefault();
  e.stopImmediatePropagation();

  const previousTaskId=idx>0?tasks[idx-1]?.id:null;
  const stamp=now();

  m.tasks=tasks.filter(t=>t.id!==taskId);
  m.updatedAt=stamp;

  localStorage.setItem(DATA,JSON.stringify(memos));

  /*
    기존 render/save 체인에 의존하지 않고 현재 Todo DOM만 제거합니다.
    그래서 삭제 순간 카드 전체가 재생성되지 않고 포커스가 안정적으로 이동합니다.
  */
  taskRow.remove();

  let destination=null;
  if(previousTaskId){
    const freshCard=document.querySelector(`.card[data-id="${CSS.escape(memoId)}"]`);
    destination=[...freshCard?.querySelectorAll('.task')||[]]
      .find(row=>row.dataset.task===previousTaskId)
      ?.querySelector('.tasktext')||null
  }

  if(!destination){
    const freshCard=document.querySelector(`.card[data-id="${CSS.escape(memoId)}"]`);
    destination=freshCard?.querySelector('.memo')||null
  }

  r302FocusEnd(destination);

  status('할 일 삭제됨 · 동기화 중…');
  setTimeout(()=>{
    Promise.resolve(syncNow(true)).catch(err=>{
      console.error(err);
      status('동기화 실패 · 로컬 보관 중')
    })
  },0)
},true);



/* =========================================================
   Rev. r30.4_260831 - 전역 우선순위 모드
   - 평상시 날짜 정렬은 기존 그대로
   - 우선순위 모드에서만 priorityOrder 순으로 표시
   - ▲/▼는 현재 보이는 바로 위/아래 메모와 전역 순위만 교환
   - 태그/프로젝트/회사/깃발/검색/마감 등 필터가 바뀌어도 같은 전역 순위 유지
   - 새 DB 컬럼 없이 blocks.sort_order의 기존 상태 비트와 함께 저장/동기화
   ========================================================= */

let r303PriorityMode=false;
const R303_PRIORITY_BASE=100000000;
const R303_PRIORITY_STEP=1000;

const r303PriorityNumber=m=>{
  const n=Number(m?.priorityOrder);
  return Number.isFinite(n)?n:Number.POSITIVE_INFINITY
};

const r303PriorityCompare=(a,b)=>{
  const pa=r303PriorityNumber(a),pb=r303PriorityNumber(b);
  if(pa!==pb)return pa-pb;
  const ca=Date.parse(a?.createdAt||0),cb=Date.parse(b?.createdAt||0);
  if(ca!==cb)return cb-ca;
  return String(a?.id||'').localeCompare(String(b?.id||''))
};

/*
  r30.2까지의 로컬 데이터에는 priorityOrder가 없습니다.
  첫 적용 시 현재 기본 목록 순서를 그대로 초기 우선순위로 삼습니다.
  이후 새 메모가 들어오면 기존 전역 관계를 건드리지 않고 맨 앞쪽의 새 값만 부여합니다.
*/
const r303EnsurePriorityValues=()=>{
  const roots=memos.filter(m=>m.status!=='deleted');
  const missing=roots.filter(m=>!Number.isFinite(Number(m.priorityOrder)));
  if(!missing.length)return false;

  const existing=roots.filter(m=>Number.isFinite(Number(m.priorityOrder)));

  if(!existing.length){
    roots.forEach((m,i)=>{m.priorityOrder=R303_PRIORITY_BASE+i*R303_PRIORITY_STEP});
    localStorage.setItem(DATA,JSON.stringify(memos));
    return true
  }

  let min=Math.min(...existing.map(m=>Number(m.priorityOrder)));

  /*
    기존 서버 sort_order가 0,1,2처럼 촘촘한 구버전 값일 수 있습니다.
    새 메모를 위에 넣을 공간만 확보하되 기존 상대 순서는 그대로 유지합니다.
  */
  if(min < R303_PRIORITY_STEP*(missing.length+2)){
    const shift=R303_PRIORITY_BASE;
    existing.forEach(m=>{m.priorityOrder=Number(m.priorityOrder)+shift});
    min+=shift
  }

  /* 오래 생성된 누락 메모부터 배치해야 최신 메모가 가장 작은 값(위쪽)을 받습니다. */
  missing
    .sort((a,b)=>Date.parse(a.createdAt||0)-Date.parse(b.createdAt||0))
    .forEach(m=>{
      min-=R303_PRIORITY_STEP;
      m.priorityOrder=min
    });

  localStorage.setItem(DATA,JSON.stringify(memos));
  return true
};

const r303NormalizePriorityOrder=()=>{
  const ordered=memos
    .filter(m=>m.status!=='deleted')
    .sort(r303PriorityCompare);

  const stamp=now();
  ordered.forEach((m,i)=>{
    m.priorityOrder=R303_PRIORITY_BASE+i*R303_PRIORITY_STEP;
    m.updatedAt=stamp;
    m.syncRevision=Math.max(1,Number(m.syncRevision)||1)+1
  });
  localStorage.setItem(DATA,JSON.stringify(memos))
};

const r303PriorityBetween=(before,after)=>{
  if(!before&&after)return Number(after.priorityOrder)-R303_PRIORITY_STEP;
  if(before&&!after)return Number(before.priorityOrder)+R303_PRIORITY_STEP;
  if(!before&&!after)return R303_PRIORITY_BASE;

  const a=Number(before.priorityOrder);
  const b=Number(after.priorityOrder);
  if(Number.isFinite(a)&&Number.isFinite(b)&&b-a>1){
    return Math.floor((a+b)/2)
  }
  return null
};

const r303MovePriority=(memoId,direction)=>{
  if(!r303PriorityMode)return;

  const visible=r303VisibleCards();
  const index=visible.findIndex(card=>card.dataset.id===memoId);
  if(index<0)return;

  const otherIndex=direction==='up'?index-1:index+1;
  if(otherIndex<0||otherIndex>=visible.length)return;

  const current=memos.find(m=>m.id===memoId);
  const other=memos.find(m=>m.id===visible[otherIndex].dataset.id);
  if(!current||!other)return;

  r303EnsurePriorityValues();

  /*
    r30.4 fix12:
    두 메모의 priorityOrder 값을 맞교환하지 않습니다.
    현재 메모를 전역 우선순위 목록에서 잠시 뺀 뒤,
    화면에서 비교한 상대 메모의 바로 앞/뒤 위치에 삽입합니다.

    따라서 상대 메모가 멀리 떨어져 있어도 상대 메모의 기존 위치를
    통째로 현재 메모의 옛 위치로 보내는 "점프"가 발생하지 않습니다.
  */
  const locateInsertion=()=>{
    const ordered=memos
      .filter(m=>m.status!=='deleted'&&m.id!==current.id)
      .sort(r303PriorityCompare);

    const targetIndex=ordered.findIndex(m=>m.id===other.id);
    if(targetIndex<0)return null;

    if(direction==='up'){
      return{
        before:targetIndex>0?ordered[targetIndex-1]:null,
        after:other
      }
    }

    return{
      before:other,
      after:targetIndex<ordered.length-1?ordered[targetIndex+1]:null
    }
  };

  let place=locateInsertion();
  if(!place)return;

  let nextPriority=r303PriorityBetween(place.before,place.after);

  /*
    중간 정수 공간이 다 소진된 매우 드문 경우에만
    현재 전역 순서를 유지한 채 간격을 다시 1000 단위로 넓힙니다.
  */
  if(nextPriority===null){
    r303NormalizePriorityOrder();
    place=locateInsertion();
    if(!place)return;
    nextPriority=r303PriorityBetween(place.before,place.after)
  }

  if(nextPriority===null)return;

  current.priorityOrder=nextPriority;

  const stamp=now();
  current.updatedAt=stamp;
  current.syncRevision=Math.max(1,Number(current.syncRevision)||1)+1;

  localStorage.setItem(DATA,JSON.stringify(memos));
  render();

  requestAnimationFrame(()=>{
    document.querySelector(`.card[data-id="${CSS.escape(memoId)}"]`)
      ?.scrollIntoView({block:'nearest'})
  });

  status('우선순위 변경 · 동기화 중…');
  setTimeout(()=>{
    Promise.resolve(syncNow(true)).catch(err=>{
      console.error(err);
      status('동기화 실패 · 로컬 보관 중')
    })
  },0)
};

/* =========================================================
   Rev. r30.4_260831 - Live / Archive 태그 목록 기준 통일
   - PC와 모바일 모두 현재 보고 있는 영역의 태그만 표시

   - 모드 전환 시 현재 영역에 없는 선택/제외 태그만 자동 해제
   ========================================================= */

const r304TagNamesForCurrentView=()=>{
  const source=memos.filter(m=>{
    if(m.status==='deleted')return false;
    return view==='archive'
      ?m.status==='archive'
      :m.status!=='archive'
  });

  const names=new Set(
    source.flatMap(m=>
      (String(m.content||'').match(/#([가-힣\w-]+)/g)||[])
        .map(tag=>tag.slice(1))
    )
  );

  if(source.some(r320MemoIsPlan))names.add(R320_VIRTUAL_PLAN_TAG);

  return [...names].sort((a,b)=>a.localeCompare(b,'ko'))
};

const r304PruneTagSelections=names=>{
  const allowed=new Set(names);
  selectedTags=selectedTags.filter(name=>allowed.has(name));
  if(typeof excludedTags!=='undefined'){
    excludedTags=excludedTags.filter(name=>allowed.has(name))
  }
};

const r304DrawDesktopTags=names=>{
  const root=$('#tags');
  if(!root)return;

  /*
    r30.4 fix:
    #tags 안에는 일반 태그뿐 아니라 PC용 @프로젝트 / ▲ 우선순위 버튼도 함께 있습니다.
    따라서 컨테이너 전체를 innerHTML로 교체하지 않고 data-tag 버튼만 갱신합니다.
  */
  root.querySelectorAll(':scope > .tag[data-tag]').forEach(el=>el.remove());

  const fragment=document.createDocumentFragment();

  const all=document.createElement('button');
  all.type='button';
  all.className=`tag ${selectedTags.length||((typeof excludedTags!=='undefined')&&excludedTags.length)?'':'active'}`;
  all.dataset.tag='';
  all.textContent='전체 보기';
  fragment.appendChild(all);

  names.forEach(name=>{
    const button=document.createElement('button');
    button.type='button';
    button.className='tag';
    if(selectedTags.includes(name))button.classList.add('active');
    if(typeof excludedTags!=='undefined'&&excludedTags.includes(name)){
      button.classList.add('tag-excluded')
    }
    button.dataset.tag=name;
    button.textContent='#'+name;
    fragment.appendChild(button)
  });

  root.appendChild(fragment);

  /* 프로젝트/우선순위는 태그와 독립된 UI이므로 항상 별도로 보장합니다. */

  refreshTagFilterAppearance()
};

    ?names.map(name=>{

/* =========================================================
   Rev. r33.0_261001_mobile_ui1 - Calendar / Completion metadata sync
   기존 Supabase blocks 스키마를 변경하지 않고 Item child comment에
   예약 prefix를 사용하여 Calendar 일정과 완료 회고를 동기화합니다.

const CAL_ENTRY_META_PREFIX='[[review-todo:calendar-entry:v1]]';
const COMPLETION_META_PREFIX='[[review-todo:completion:v1]]';

const isCalendarEntryMeta=v=>typeof v==='string'&&v.startsWith(CAL_ENTRY_META_PREFIX);
const isCompletionMeta=v=>typeof v==='string'&&v.startsWith(COMPLETION_META_PREFIX);

const encodeCalendarEntryMeta=e=>CAL_ENTRY_META_PREFIX+JSON.stringify({
  date:e.date||'',
  startMinute:e.startMinute==null?null:Number(e.startMinute),
  plannedDurationMinutes:Math.max(30,Number(e.plannedDurationMinutes)||30),
  isBig3:!!e.isBig3,
  entryType:e.entryType||'normal',
  routineId:e.routineId||null,
  status:e.status||'planned',
  obsoleteReason:e.obsoleteReason||null,
  createdAt:e.createdAt||null,
  updatedAt:e.updatedAt||null
});

const decodeCalendarEntryMeta=row=>{
  try{
    if(!isCalendarEntryMeta(row?.content_md))return null;
    const o=JSON.parse(row.content_md.slice(CAL_ENTRY_META_PREFIX.length)||'{}');
    if(!o.date)return null;
    return{
      id:row.id,
      itemId:row.parent_id,
      date:String(o.date),
      startMinute:o.startMinute==null?null:Number(o.startMinute),
      plannedDurationMinutes:Math.max(30,Number(o.plannedDurationMinutes)||30),
      isBig3:!!o.isBig3,
      entryType:o.entryType||'normal',
      routineId:o.routineId||null,
      status:o.status||'planned',
      obsoleteReason:o.obsoleteReason||null,
      createdAt:o.createdAt||row.created_at,
      updatedAt:o.updatedAt||row.updated_at
    }
  }catch(e){
    console.warn('calendar metadata decode failed',e);
    return null
  }
};

const encodeCompletionMeta=r=>COMPLETION_META_PREFIX+JSON.stringify({
  calendarEntryId:r.calendarEntryId||null,
  planResult:r.planResult||'',
  gapCause:r.gapCause||'',
  improvement:r.improvement||'',
  completedAt:r.completedAt||null,
  revokedAt:r.revokedAt||null,
  createdAt:r.createdAt||null,
  updatedAt:r.updatedAt||null
});

const decodeCompletionMeta=row=>{
  try{
    if(!isCompletionMeta(row?.content_md))return null;
    const o=JSON.parse(row.content_md.slice(COMPLETION_META_PREFIX.length)||'{}');
    if(!o.completedAt)return null;
    return{

      updatedAt:o.updatedAt||row.updated_at
    }
  }catch(e){
    console.warn('completion metadata decode failed',e);
    return null
  }
};


const r313Hash32=(text,seed)=>{
  let h=(2166136261^seed)>>>0;
  for(let i=0;i<text.length;i++){
    h^=text.charCodeAt(i);
    h=Math.imul(h,16777619)>>>0
  }
  return h>>>0
};

const r313StableUuid=text=>{
  let hex=[0x13579bdf,0x2468ace0,0x9e3779b9,0x85ebca6b]
    .map(seed=>r313Hash32(String(text),seed).toString(16).padStart(8,'0'))
    .join('');
  hex=hex.slice(0,12)+'4'+hex.slice(13);
  const variant=((parseInt(hex[16],16)&3)|8).toString(16);
  hex=hex.slice(0,16)+variant+hex.slice(17);
  return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20,32)}`
};

const r313NormalizeDailyMeta=(date,value={})=>({
  date:String(date||value.date||''),
  label:String(value.label||''),
  color:['default','red','orange','yellow','green','blue','indigo','purple','black'].includes(value.color)
    ?value.color:'default',
  memo:String(value.memo||''),
  review:String(value.review||''),
  routineOverrides:Array.isArray(value.routineOverrides)
    ?value.routineOverrides
      .filter(x=>x&&x.routineId)
      .map(x=>({
        routineId:String(x.routineId),
        startMinute:Number.isFinite(Number(x.startMinute))?Number(x.startMinute):null,
        plannedDurationMinutes:Math.max(30,Number(x.plannedDurationMinutes)||30),
        deletedAt:x.deletedAt||null,
        updatedAt:x.updatedAt||null
      }))
    :[],
  routineSuppressions:Array.isArray(value.routineSuppressions)
    ?value.routineSuppressions
      .filter(x=>x&&x.routineId)
      .map(x=>({
        routineId:String(x.routineId),
        suppressed:x.suppressed!==false,
        updatedAt:x.updatedAt||null
      }))
    :[],
  createdAt:value.createdAt||null,
  updatedAt:value.updatedAt||null
});

const encodeDailyMeta=meta=>DAILY_META_PREFIX+JSON.stringify(
  r313NormalizeDailyMeta(meta.date,meta)
);

const decodeDailyMeta=row=>{
  try{
    if(!isDailyMetaPayload(row?.content_md))return null;
    const raw=JSON.parse(row.content_md.slice(DAILY_META_PREFIX.length)||'{}');
    if(!raw.date)return null;
    return r313NormalizeDailyMeta(raw.date,{
      ...raw,
      createdAt:raw.createdAt||row.created_at,
      updatedAt:raw.updatedAt||row.updated_at
    })
  }catch(e){
    console.warn('daily metadata decode failed',e);
    return null
  }
};

const r316MergeRoutineOverrides=(left=[],right=[])=>{
  const map=new Map();
  [...(left||[]),...(right||[])].forEach(value=>{
    if(!value?.routineId)return;
    const old=map.get(value.routineId);
    if(!old){
      map.set(value.routineId,{...value});
      return
    }
    const oldTime=Date.parse(old.updatedAt||0)||0;
    const newTime=Date.parse(value.updatedAt||0)||0;
    if(newTime>=oldTime)map.set(value.routineId,{...value})
  });
  return [...map.values()]
};

const r319MergeRoutineSuppressions=(left=[],right=[])=>{
  const map=new Map();
  [...(left||[]),...(right||[])].forEach(value=>{
    if(!value?.routineId)return;
    const old=map.get(value.routineId);
    if(!old){
      map.set(value.routineId,{...value});
      return
    }
    const oldTime=Date.parse(old.updatedAt||0)||0;
    const newTime=Date.parse(value.updatedAt||0)||0;
    if(newTime>=oldTime)map.set(value.routineId,{...value})
  });
  return [...map.values()]
};

const r313MergeDailyMetaValue=(left,right)=>{
  if(!left)return right?{...right}:null;
  if(!right)return{...left};

  const lt=Date.parse(left.updatedAt||left.createdAt||0)||0;
  const rt=Date.parse(right.updatedAt||right.createdAt||0)||0;
  const winner=rt>=lt?{...right}:{...left};
  winner.routineOverrides=r316MergeRoutineOverrides(
    left.routineOverrides,
    right.routineOverrides
  );
  winner.routineSuppressions=r319MergeRoutineSuppressions(
    left.routineSuppressions,
    right.routineSuppressions
  );
  return winner
};

const r312MergeMetaArray=(left=[],right=[])=>{
  const map=new Map();
  [...(left||[]),...(right||[])].forEach(value=>{
    if(!value?.id)return;
    const old=map.get(value.id);
    if(!old){
      map.set(value.id,{...value});
      return
    }
    const oldTime=Date.parse(old.updatedAt||old.createdAt||0)||0;
    const newTime=Date.parse(value.updatedAt||value.createdAt||0)||0;
    if(newTime>=oldTime)map.set(value.id,{...value})
  });
  return [...map.values()]
};

const r312ApplyCompletionDerivedState=item=>{
  const active=(item.completionHistory||[])
    .filter(r=>r?.completedAt&&!r.revokedAt)
    .sort((a,b)=>Date.parse(b.completedAt)-Date.parse(a.completedAt));
  item.completedAt=active[0]?.completedAt||null;
  return item
};

const R320_REVIEW_RECOVERY_KEY='review_todo_reserved_review_recovery_v1';

const r320ReviewLooksReserved=item=>{
  if(!item)return false;
  if(isWorkspaceReservedChildPayload(item.review))return true;
  if(!item.reviewId)return false;
  if(item.reviewId===item.dueId)return true;
  if((item.calendarEntries||[]).some(entry=>entry?.id===item.reviewId))return true;
  if((item.completionHistory||[]).some(entry=>entry?.id===item.reviewId))return true;
  return false
};

const r320SanitizeReservedReviews=(items,{backup=false}={})=>{
  const affected=[];

  (items||[]).forEach(item=>{
    if(!r320ReviewLooksReserved(item))return;

    affected.push({
      itemId:item.id,
      review:item.review,
      reviewId:item.reviewId,
      reviewUpdatedAt:item.reviewUpdatedAt,
      sanitizedAt:now()
    });

    delete item.review;
    delete item.reviewId;
    delete item.reviewUpdatedAt
  });

  if(backup&&affected.length){
    try{
      const existing=JSON.parse(localStorage.getItem(R320_REVIEW_RECOVERY_KEY)||'[]');
      const list=Array.isArray(existing)?existing:[];
      const keyed=new Map(list.map(row=>[
        `${row.itemId}|${row.reviewId||''}|${row.review||''}`,
        row
      ]));
      affected.forEach(row=>{
        keyed.set(`${row.itemId}|${row.reviewId||''}|${row.review||''}`,row)
      });
      localStorage.setItem(
        R320_REVIEW_RECOVERY_KEY,
        JSON.stringify([...keyed.values()].slice(-100))
      )
    }catch(e){
      console.warn('reserved review recovery snapshot failed',e)
    }
  }

  return affected.length
};

/* r32.0 fix2:
   이미 이 브라우저 localStorage에 Calendar metadata가 후기처럼 들어간 경우
   서버 row는 건드리지 않고 Workspace의 review 참조만 제거합니다. */
const r320RecoveredLocalReviews=r320SanitizeReservedReviews(memos,{backup:true});
if(r320RecoveredLocalReviews){

}

const r312MetaMergeBase=merge;
merge=(left,right)=>{
  r320SanitizeReservedReviews(left,{backup:true});
  r320SanitizeReservedReviews(right);

  const result=r312MetaMergeBase(left,right);
  const leftMap=new Map((left||[]).map(x=>[x.id,x]));
  const rightMap=new Map((right||[]).map(x=>[x.id,x]));

  result.forEach(item=>{
    const l=leftMap.get(item.id)||{};
    const r=rightMap.get(item.id)||{};
    item.calendarEntries=r312MergeMetaArray(l.calendarEntries,r.calendarEntries);
    item.completionHistory=r312MergeMetaArray(l.completionHistory,r.completionHistory);
    r312ApplyCompletionDerivedState(item)
  });

  r320SanitizeReservedReviews(result,{backup:true});
  return result
};

const r312MetaPullBase=pull;
pull=async()=>{
  const items=await r312MetaPullBase();
  if(!sb||!user)return items;

  const {data:childRows,error}=await sb
    .from('blocks')
    .select('id,parent_id,type,content_md,created_at,updated_at,deleted_at,sort_order,revision')
    .eq('user_id',user.id)
    .not('parent_id','is',null);

  if(error)throw error;

  const {data:dailyRows,error:dailyError}=await sb
    .from('blocks')
    .select('id,parent_id,type,content_md,created_at,updated_at,deleted_at,sort_order,revision')
    .eq('user_id',user.id)
    .is('parent_id',null)
    .like('content_md',DAILY_META_PREFIX+'%');

  if(dailyError)throw dailyError;

  const remoteDaily={};
  (dailyRows||[]).forEach(row=>{
    const decoded=decodeDailyMeta(row);
    if(!decoded)return;
    remoteDaily[decoded.date]=r313MergeDailyMetaValue(remoteDaily[decoded.date],decoded)
  });
  Object.entries(remoteDaily).forEach(([date,meta])=>{
    dailyMetaCache[date]=r313MergeDailyMetaValue(dailyMetaCache[date],meta)
  });

  const calendars=new Map();
  const completions=new Map();
  const regularReviews=new Map();

  (childRows||[]).forEach(row=>{
    if(isCalendarEntryMeta(row.content_md)){
      const decoded=decodeCalendarEntryMeta(row);
      if(decoded){
        const arr=calendars.get(row.parent_id)||[];
        arr.push(decoded);
        calendars.set(row.parent_id,arr)
      }
      return
    }

    if(isCompletionMeta(row.content_md)){
      const decoded=decodeCompletionMeta(row);
      if(decoded){
        const arr=completions.get(row.parent_id)||[];
        arr.push(decoded);
        completions.set(row.parent_id,arr)
      }
      return
    }

    if(isDueMeta(row.content_md))return;
    if(typeof isAnyRoutineLogPayload==='function'&&isAnyRoutineLogPayload(row.content_md))return;
    if(row.type!=='comment')return;
    if(isWorkspaceReservedChildPayload(row.content_md))return;

    const old=regularReviews.get(row.parent_id);
    if(!old||Date.parse(row.updated_at)>=Date.parse(old.updated_at)){
      regularReviews.set(row.parent_id,row)
    }
  });

  items.forEach(item=>{
    item.calendarEntries=calendars.get(item.id)||[];
    item.completionHistory=completions.get(item.id)||[];

    const reviewRow=regularReviews.get(item.id);
    if(reviewRow){
      item.review=reviewRow.content_md;
      item.reviewId=reviewRow.id;
      item.reviewUpdatedAt=reviewRow.updated_at
    }else{
      delete item.review;
      delete item.reviewId;
      delete item.reviewUpdatedAt
    }

    r312ApplyCompletionDerivedState(item)
  });

  r320SanitizeReservedReviews(items);
  return items
};

const r312MetaPushBase=push;
push=async()=>{
  await r312MetaPushBase();
  if(!sb||!user)return;

  const rows=[];

  Object.values(dailyMetaCache||{}).forEach(meta=>{
    if(!meta?.date)return;
    const normalized=r313NormalizeDailyMeta(meta.date,meta);
    const stamp=normalized.updatedAt||normalized.createdAt||now();
    rows.push({
      id:r313StableUuid(`${user.id}|daily|${normalized.date}`),
      user_id:user.id,
      parent_id:null,
      type:'note',
      content_md:encodeDailyMeta(normalized),
      created_at:normalized.createdAt||stamp,
      updated_at:stamp,
      sort_order:0,
      revision:1,
      deleted_at:null
    })
  });

  memos.forEach(item=>{
    (item.calendarEntries||[]).forEach(entry=>{
      if(!entry?.id)return;
      rows.push({
        id:entry.id,
        user_id:user.id,
        parent_id:item.id,
        type:'comment',
        content_md:encodeCalendarEntryMeta(entry),
        created_at:entry.createdAt||item.createdAt,
        updated_at:entry.updatedAt||item.updatedAt,
        sort_order:0,
        revision:1,
        deleted_at:null
      })
    });

    (item.completionHistory||[]).forEach(review=>{
      if(!review?.id)return;
      rows.push({
        id:review.id,
        user_id:user.id,
        parent_id:item.id,
        type:'comment',
        content_md:encodeCompletionMeta(review),
        created_at:review.createdAt||review.completedAt||item.createdAt,
        updated_at:review.updatedAt||review.completedAt||item.updatedAt,
        sort_order:0,
        revision:1,
        deleted_at:null
      })
    })
  });

  if(rows.length){
    const {error}=await sb.from('blocks').upsert(rows,{onConflict:'id'});
    if(error)throw error
  }
};

push=async()=>{

};

syncNow=async force=>{

/* =========================================================
   Rev. r33.0_261001_mobile_ui1 - Unified Item Core API
   Calendar/Routine의 다음 세대 코드는 memos 배열을 직접 만지지 않고
   이 API를 통해 현재 Review & Todo Item/Checklist를 사용합니다.

   Calendar 모듈은 memos 내부를 직접 조작하지 않고 이 API를 사용합니다.
   r31.2부터 Calendar Schedule / Completion Review도 기존 blocks child로 동기화합니다.
   ========================================================= */
const R31_SCHEMA_VERSION=2;

const r31Clone=value=>{
  if(value===undefined)return undefined;
  if(typeof structuredClone==='function'){
    try{return structuredClone(value)}catch{}
  }
  return JSON.parse(JSON.stringify(value))
};

const r31FindItem=itemId=>memos.find(m=>m.id===itemId);

const r31CreateItem=(input={})=>{
  const stamp=now();
  const rawChecklist=Array.isArray(input.checklist)?input.checklist:[];
  const content=String(input.content??'').trim();

  const checklist=rawChecklist
    .map(entry=>typeof entry==='string'?{text:entry}:entry)
    .filter(entry=>String(entry?.text??'').trim())
    .map(entry=>({
      id:isUuid(entry.id)?entry.id:id(),
      text:String(entry.text??'').trim(),
      done:!!entry.done,
      createdAt:entry.createdAt?iso(entry.createdAt):stamp,
      updatedAt:entry.updatedAt?iso(entry.updatedAt):stamp,
      completedAt:entry.done
        ?(entry.completedAt?iso(entry.completedAt):stamp)
        :null,
      deletedAt:null
    }));

  if(!content&&!checklist.length){
    throw new Error('내용 또는 체크리스트가 필요합니다.')
  }

  const item={
    id:id(),
    content,
    tasks:checklist,
    status:input.status==='archive'?'archive':'live',
    important:!!input.important,
    work:!!input.work,
    createdAt:stamp,
    updatedAt:stamp
  };

  if(typeof input.review==='string'&&input.review.trim()){
    item.review=input.review
  }
  if(typeof input.dueDate==='string')item.dueDate=input.dueDate;
  if(typeof input.dueTime==='string')item.dueTime=input.dueTime;
  if(typeof input.dueNotify==='boolean')item.dueNotify=input.dueNotify;
  if(Number.isFinite(Number(input.priorityOrder))){
    item.priorityOrder=Number(input.priorityOrder)
  }

  memos.unshift(item);
  save();
  return r31Clone(item)
};

const R31_ITEM_PATCH_FIELDS=new Set([
  'content','status','important','work','review',
  'dueDate','dueTime','dueNotify','priorityOrder'
]);

const r31UpdateItem=(itemId,patch={})=>{
  const item=r31FindItem(itemId);
  if(!item)throw new Error('Item을 찾을 수 없습니다.');

  Object.entries(patch||{}).forEach(([key,value])=>{
    if(!R31_ITEM_PATCH_FIELDS.has(key))return;

    if(key==='status'){
      if(!['live','archive','deleted'].includes(value))return;
      item.status=value;
      return
    }
    if(key==='important'||key==='work'||key==='dueNotify'){
      item[key]=!!value;
      return
    }
    if(key==='priorityOrder'){
      if(Number.isFinite(Number(value)))item.priorityOrder=Number(value);
      return
    }
    item[key]=value==null?'':String(value)
  });

  item.updatedAt=now();
  item.syncRevision=Math.max(1,Number(item.syncRevision)||1)+1;
  save();
  return r31Clone(item)
};

const r31AddChecklistItem=(itemId,textValue)=>{
  const item=r31FindItem(itemId);
  if(!item)throw new Error('Item을 찾을 수 없습니다.');

  const taskText=String(textValue??'').trim();
  if(!taskText)throw new Error('체크리스트 내용이 필요합니다.');

  const stamp=now();
  const task={
    id:id(),
    text:taskText,
    done:false,
    createdAt:stamp,
    updatedAt:stamp,
    completedAt:null,
    deletedAt:null
  };
  item.tasks=Array.isArray(item.tasks)?item.tasks:[];
  item.tasks.push(task);
  item.updatedAt=stamp;
  item.syncRevision=Math.max(1,Number(item.syncRevision)||1)+1;
  save();
  return r31Clone(task)
};

const r31UpdateChecklistItem=(itemId,taskId,patch={})=>{
  const item=r31FindItem(itemId);
  if(!item)throw new Error('Item을 찾을 수 없습니다.');

  const task=(item.tasks||[]).find(t=>t.id===taskId);
  if(!task)throw new Error('체크리스트 항목을 찾을 수 없습니다.');

  const stamp=now();

  if(Object.prototype.hasOwnProperty.call(patch,'text')){
    task.text=String(patch.text??'')
  }
  if(Object.prototype.hasOwnProperty.call(patch,'done')){
    const nextDone=!!patch.done;
    if(nextDone!==!!task.done){
      task.done=nextDone;
      task.completedAt=nextDone?stamp:null
    }
  }

  task.updatedAt=stamp;
  item.updatedAt=stamp;
  item.syncRevision=Math.max(1,Number(item.syncRevision)||1)+1;
  save();
  return r31Clone(task)
};

const r31RemoveChecklistItem=(itemId,taskId)=>{
  const item=r31FindItem(itemId);
  if(!item)throw new Error('Item을 찾을 수 없습니다.');

  const task=(item.tasks||[]).find(t=>t.id===taskId);
  if(!task)throw new Error('체크리스트 항목을 찾을 수 없습니다.');

  const stamp=now();
  task.deletedAt=stamp;
  task.updatedAt=stamp;
  item.updatedAt=stamp;
  item.syncRevision=Math.max(1,Number(item.syncRevision)||1)+1;
  save();
  return true
};


const r312TouchItem=(item,stamp=now())=>{
  item.updatedAt=stamp;
  item.syncRevision=Math.max(1,Number(item.syncRevision)||1)+1;
  return item
};

const r312GetCalendarEntries=date=>{
  const out=[];
  memos.forEach(item=>{
    (item.calendarEntries||[]).forEach(entry=>{
      if(entry?.status==='deleted')return;
      if(date&&entry.date!==date)return;
      out.push({...entry,itemId:item.id})
    })
  });
  return r31Clone(out)
};

const r312UpsertCalendarEntry=(entry,{saveNow=true}={})=>{
  if(!entry?.id||!entry?.itemId)throw new Error('Calendar Entry 정보가 올바르지 않습니다.');
  const item=r31FindItem(entry.itemId);
  if(!item)throw new Error('Item을 찾을 수 없습니다.');

  item.calendarEntries=Array.isArray(item.calendarEntries)?item.calendarEntries:[];
  const stamp=entry.updatedAt||now();
  const normalized={
    id:entry.id,
    itemId:item.id,
    date:String(entry.date||''),
    startMinute:entry.startMinute==null?null:Number(entry.startMinute),
    plannedDurationMinutes:Math.max(30,Number(entry.plannedDurationMinutes)||30),
    isBig3:!!entry.isBig3,
    entryType:entry.entryType||'normal',
    routineId:entry.routineId||null,
    status:entry.status||'planned',
    obsoleteReason:entry.obsoleteReason||null,
    createdAt:entry.createdAt||stamp,
    updatedAt:stamp
  };

  const idx=item.calendarEntries.findIndex(x=>x.id===normalized.id);
  if(idx>=0){
    const old=item.calendarEntries[idx];
    const oldTime=Date.parse(old.updatedAt||old.createdAt||0)||0;
    const newTime=Date.parse(normalized.updatedAt||normalized.createdAt||0)||0;
    if(newTime>=oldTime)item.calendarEntries[idx]=normalized
  }else{
    item.calendarEntries.push(normalized)
  }

  r312TouchItem(item,stamp);
  if(saveNow)save();
  return r31Clone(normalized)
};

const r312ImportCalendarEntries=entries=>{
  if(!Array.isArray(entries)||!entries.length)return 0;
  let changed=0;

  entries.forEach(entry=>{
    if(!entry?.itemId||!r31FindItem(entry.itemId))return;
    try{
      const item=r31FindItem(entry.itemId);
      const before=(item.calendarEntries||[]).find(x=>x.id===entry.id);
      r312UpsertCalendarEntry(entry,{saveNow:false});
      if(!before)changed++
    }catch{}
  });

  if(changed)save();
  return changed
};

const r312CompleteItem=(itemId,payload={})=>{
  const item=r31FindItem(itemId);
  if(!item)throw new Error('Item을 찾을 수 없습니다.');
  if(item.completedAt)throw new Error('이미 완료된 Item입니다.');

  const stamp=now();
  item.calendarEntries=Array.isArray(item.calendarEntries)?item.calendarEntries:[];
  item.completionHistory=Array.isArray(item.completionHistory)?item.completionHistory:[];

  const entryId=payload.calendarEntryId||null;
  item.calendarEntries.forEach(entry=>{
    if(entry.status==='deleted')return;
    if(entry.id===entryId){
      entry.status='completed';
      entry.obsoleteReason=null;
      entry.updatedAt=stamp
    }else if(entry.status==='planned'){
      entry.status='obsolete';
      entry.obsoleteReason='item_completed';
      entry.updatedAt=stamp
    }
  });

  const review={
    id:id(),
    itemId,
    calendarEntryId:entryId,
    planResult:['on_plan','partial','below'].includes(payload.planResult)
      ?payload.planResult:'',
    gapCause:String(payload.gapCause||''),
    improvement:String(payload.improvement||''),
    completedAt:stamp,
    revokedAt:null,
    createdAt:stamp,
    updatedAt:stamp
  };

  item.completionHistory.push(review);
  item.completedAt=stamp;
  r312TouchItem(item,stamp);
  save();

  return r31Clone({item,review})
};

const r312UndoCompleteItem=itemId=>{
  const item=r31FindItem(itemId);
  if(!item)throw new Error('Item을 찾을 수 없습니다.');

  item.completionHistory=Array.isArray(item.completionHistory)?item.completionHistory:[];
  item.calendarEntries=Array.isArray(item.calendarEntries)?item.calendarEntries:[];

  const active=item.completionHistory
    .filter(r=>r?.completedAt&&!r.revokedAt)
    .sort((a,b)=>Date.parse(b.completedAt)-Date.parse(a.completedAt))[0];

  if(!active)throw new Error('완료 기록이 없습니다.');

  const stamp=now();
  active.revokedAt=stamp;
  active.updatedAt=stamp;

  item.calendarEntries.forEach(entry=>{
    if(entry.status==='deleted')return;

    if(entry.id===active.calendarEntryId&&entry.status==='completed'){
      entry.status='planned';
      entry.obsoleteReason=null;
      entry.updatedAt=stamp;
      return
    }

    if(entry.status==='obsolete'&&entry.obsoleteReason==='item_completed'){
      entry.status='planned';
      entry.obsoleteReason=null;
      entry.updatedAt=stamp
    }
  });

  r312ApplyCompletionDerivedState(item);
  r312TouchItem(item,stamp);
  save();

  return r31Clone({item,revokedReview:active})
};

const r312GetCompletionHistory=itemId=>{
  const item=r31FindItem(itemId);
  return r31Clone(item?.completionHistory||[])
};

const r312FormatDateTime=value=>{
  if(!value)return'';
  const d=new Date(value);
  if(Number.isNaN(d.valueOf()))return'';
  const pad=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`
};



const r313GetDailyMeta=date=>{
  const value=dailyMetaCache[String(date)]||null;
  return value?r31Clone(value):null
};

const r313GetDailyMetaMap=()=>r31Clone(dailyMetaCache||{});

const r313UpsertDailyMeta=(date,patch={})=>{
  date=String(date||'');
  if(!date)throw new Error('날짜가 필요합니다.');

  const old=dailyMetaCache[date]||r313NormalizeDailyMeta(date,{});
  const stamp=patch.updatedAt||now();
  const next=r313NormalizeDailyMeta(date,{
    ...old,
    ...patch,
    date,
    createdAt:old.createdAt||patch.createdAt||stamp,
    updatedAt:stamp
  });

  dailyMetaCache[date]=next;
  return r31Clone(next)
};

const r313ImportDailyMeta=map=>{
  if(!map||typeof map!=='object')return 0;
  let changed=0;

  Object.entries(map).forEach(([date,value])=>{
    if(!value||typeof value!=='object')return;
    const incoming=r313NormalizeDailyMeta(date,value);
    const merged=r313MergeDailyMetaValue(dailyMetaCache[date],incoming);
    const before=JSON.stringify(dailyMetaCache[date]||null);
    const after=JSON.stringify(merged||null);
    dailyMetaCache[date]=merged;
    if(before!==after)changed++
  });

  return changed
};

/* ---------- Workspace ↔ Calendar integration ---------- */
const r319ExpandedWorkspaceMemos=new Set();
const r312WorkspaceRenderBase=render;
render=()=>{
  const cleaned=r320SanitizeReservedReviews(memos,{backup:true});
  if(cleaned)localStorage.setItem(DATA,JSON.stringify(memos));

  r312WorkspaceRenderBase();

  document.querySelectorAll('.card').forEach(card=>{
    const item=r31FindItem(card.dataset.id);
    if(!item||item.status==='deleted')return;

    const tools=card.querySelector('.card-tools');
    if(tools&&!tools.querySelector('.go-timetable')&&!item.completedAt){
      tools.insertAdjacentHTML(
        'afterbegin',
        '<button type="button" class="icon go-timetable" title="오늘 Calendar 브레인 덤프로 보내기" aria-label="Calendar로 보내기">📅</button>'
      )
    }

    const left=card.querySelector('.left');
    const memoEl=card.querySelector('.memo');
    const lineCount=String(item.content||'').replace(/\r/g,'').split('\n').length;

    if(memoEl&&lineCount>20){
      const expanded=r319ExpandedWorkspaceMemos.has(item.id);
      memoEl.classList.toggle('memo-long-collapsed',!expanded);
      memoEl.classList.toggle('memo-long-expanded',expanded);

      if(!left.querySelector('.memo-more-toggle')){
        memoEl.insertAdjacentHTML(
          'afterend',
          `<button type="button" class="memo-more-toggle" data-memo-more="${item.id}">
            ${expanded?'접기':'… 더보기'}
          </button>`
        )
      }else{
        left.querySelector('.memo-more-toggle').textContent=expanded?'접기':'… 더보기'
      }
    }

    if(left&&item.completedAt&&!left.querySelector('.item-completed-badge')){
      left.insertAdjacentHTML(
        'beforeend',
        `<div class="item-completed-badge">✓ 완료 ${esc(r312FormatDateTime(item.completedAt))}</div>`
      )
    }

    card.classList.toggle('item-completed',!!item.completedAt)
  })
};


document.addEventListener('focusin',e=>{
  const memo=e.target.closest?.('.memo.memo-long-collapsed');
  if(!memo)return;

  const card=memo.closest('.card');
  const itemId=card?.dataset.id;
  if(!itemId||r319ExpandedWorkspaceMemos.has(itemId))return;

  r319ExpandedWorkspaceMemos.add(itemId);
  render();

  setTimeout(()=>{
    const next=document.querySelector(`.card[data-id="${CSS.escape(itemId)}"] .memo`);
    if(!next)return;
    next.focus();
    try{
      const range=document.createRange();
      range.selectNodeContents(next);
      range.collapse(false);
      const selection=window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range)
    }catch{}
  },0)
},true);

document.addEventListener('click',e=>{
  const more=e.target.closest?.('[data-memo-more]');
  if(more){
    e.preventDefault();
    e.stopImmediatePropagation();
    const itemId=more.dataset.memoMore;
    if(r319ExpandedWorkspaceMemos.has(itemId))r319ExpandedWorkspaceMemos.delete(itemId);
    else r319ExpandedWorkspaceMemos.add(itemId);
    render();
    return
  }

  const button=e.target.closest?.('.go-timetable');
  if(!button)return;

  e.preventDefault();
  e.stopImmediatePropagation();

  const itemId=button.closest('.card')?.dataset.id;
  if(!itemId)return;

  if(!window.RTCalendar?.planItem){
    alert('Calendar 초기화가 아직 완료되지 않았습니다. 페이지를 새로고침한 뒤 다시 시도해주세요.');
    return
  }

  try{
    window.RTCalendar.planItem(itemId);
  }catch(error){
    alert(error?.message||'Calendar로 이동하지 못했습니다.')
  }
},true);

</script><script id="rt-calendar-embedded-script">
/* Review & Todo Calendar
   Rev. r31.2_260928 / Calendar Phase 3
   Daily planning engine:
   - Big3
   - Brain Dump
   - 30-minute TimeTable
   - ↑ / ↓ relocation
   - + / - duration
   - create Item modal
   - 00:00~24:00 with configurable folded hours
   - daily memo/review
   - basic Week / Month overview

   Calendar data is intentionally isolated from index.html.
   Completion/Review sync is added in the next phase.
*/
window.RTCalendarScriptLoaded=true;
const CAL_KEY='review_todo_calendar_v2';
const CAL_SCHEMA=2;
const SLOT=30;
const DAY_MINUTES=1440;

const $=(s,root=document)=>root.querySelector(s);
const $$=(s,root=document)=>[...root.querySelectorAll(s)];

const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[ch]));

const clone=value=>{
  if(value===undefined)return undefined;
  if(typeof structuredClone==='function'){
    try{return structuredClone(value)}catch{}
  }
  return JSON.parse(JSON.stringify(value));
};

const uuid=()=>{
  if(globalThis.crypto?.randomUUID)return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
    const r=Math.random()*16|0,v=c==='x'?r:(r&3|8);
    return v.toString(16)
  })
};

const nowIso=()=>new Date().toISOString();

const localDateKey=(d=new Date())=>{
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`
};

const parseDate=s=>{
  const [y,m,d]=String(s).split('-').map(Number);
  return new Date(y,m-1,d)
};

const shiftDate=(s,days)=>{
  const d=parseDate(s);
  d.setDate(d.getDate()+days);
  return localDateKey(d)
};

const minuteLabel=minute=>{
  if(minute===1440)return '24:00';
  const h=Math.floor(minute/60);
  const m=minute%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`
};

const prettyDate=s=>{
  const d=parseDate(s);
  const w=['일','월','화','수','목','금','토'];
  return `${d.getFullYear()}. ${String(d.getMonth()+1).padStart(2,'0')}. ${String(d.getDate()).padStart(2,'0')} (${w[d.getDay()]})`
};

const DAY_COLORS=['default','red','orange','yellow','green','blue','indigo','purple','black'];
const WORK_COLORS=['gray','red','orange','yellow','green','blue','indigo','purple'];
const WORK_COLOR_LABELS={
  gray:'회색',red:'빨강',orange:'주황',yellow:'노랑',
  green:'초록',blue:'파랑',indigo:'남색',purple:'보라'
};

const defaultState=()=>({
  schemaVersion:CAL_SCHEMA,
  entries:[],
  dayMeta:{},
  settings:{
    collapseBeforeMinute:360,
    collapseAfterMinute:1320,
    workStartMinute:510,
    workEndMinute:1050,
    workColor:'gray'
  }
});

const normalizeDayMeta=(date,value={})=>({
  date,
  label:String(value.label||''),
  color:DAY_COLORS.includes(value.color)?value.color:'default',
  memo:String(value.memo||''),
  review:String(value.review||''),
  routineOverrides:Array.isArray(value.routineOverrides)
    ?value.routineOverrides
      .filter(x=>x&&x.routineId)
      .map(x=>({
        routineId:String(x.routineId),
        startMinute:Number.isFinite(Number(x.startMinute))?Number(x.startMinute):null,
        plannedDurationMinutes:Math.max(SLOT,Number(x.plannedDurationMinutes)||SLOT),
        deletedAt:x.deletedAt||null,
        updatedAt:x.updatedAt||null
      }))
    :[],
  routineSuppressions:Array.isArray(value.routineSuppressions)
    ?value.routineSuppressions
      .filter(x=>x&&x.routineId)
      .map(x=>({
        routineId:String(x.routineId),
        suppressed:x.suppressed!==false,
        updatedAt:x.updatedAt||null
      }))
    :[],
  createdAt:value.createdAt||null,
  updatedAt:value.updatedAt||null
});

const normalizeState=raw=>{
  const base=defaultState();
  if(!raw||typeof raw!=='object')return base;

  const dayMeta={};
  if(raw.dayMeta&&typeof raw.dayMeta==='object'){
    Object.entries(raw.dayMeta).forEach(([date,value])=>{
      dayMeta[date]=normalizeDayMeta(date,value||{})
    })
  }

  /* r31.1/r31.2의 dayNotes를 신규 Daily Meta로 자동 이전 */
  if(raw.dayNotes&&typeof raw.dayNotes==='object'){
    Object.entries(raw.dayNotes).forEach(([date,value])=>{
      if(!dayMeta[date]){
        dayMeta[date]=normalizeDayMeta(date,{
          memo:value?.memo||'',
          review:value?.review||''
        })
      }else{
        if(!dayMeta[date].memo)dayMeta[date].memo=String(value?.memo||'');
        if(!dayMeta[date].review)dayMeta[date].review=String(value?.review||'')
      }
    })
  }

  return{
    schemaVersion:CAL_SCHEMA,
    entries:Array.isArray(raw.entries)?raw.entries.filter(Boolean):[],
    dayMeta,
    settings:{
      collapseBeforeMinute:Number.isFinite(Number(raw.settings?.collapseBeforeMinute))
        ?Math.max(0,Math.min(720,Number(raw.settings.collapseBeforeMinute)))
        :360,
      collapseAfterMinute:Number.isFinite(Number(raw.settings?.collapseAfterMinute))
        ?Math.max(720,Math.min(1440,Number(raw.settings.collapseAfterMinute)))
        :1320,
      workStartMinute:Number.isFinite(Number(raw.settings?.workStartMinute))
        ?Math.max(0,Math.min(1410,Number(raw.settings.workStartMinute)))
        :510,
      workEndMinute:Number.isFinite(Number(raw.settings?.workEndMinute))
        ?Math.max(30,Math.min(1440,Number(raw.settings.workEndMinute)))
        :1050,
      workColor:WORK_COLORS.includes(raw.settings?.workColor)
        ?raw.settings.workColor:'gray'
    }
  }
};

let state=(()=>{
  try{return normalizeState(JSON.parse(localStorage.getItem(CAL_KEY)||'null'))}
  catch{return defaultState()}
})();

let selectedDate=localDateKey();
let viewMode='day';
let expandedEarly=false;
let expandedLate=false;
let core=null;

let calendarDirty=false;
let completionEditingEntryId=null;
let completionRoutineContext=null;

const scheduleRemoteSync=()=>{
  /* r31.6:
     Calendar 변경은 localStorage/RTCore 메모리에 즉시 저장하지만
     서버 동기화는 여기서 실행하지 않습니다.
     기존 앱의 5분 자동 sync 또는 사용자의 수동 Sync 버튼만 서버에 접근합니다. */
  calendarDirty=true
};

const refreshEntriesFromCore=()=>{
  if(!core?.getCalendarEntries)return;
  try{
    state.entries=core.getCalendarEntries()||[];
    save()
  }catch(e){
    console.warn('Calendar core refresh failed',e)
  }
};

const mergeRoutineOverrides=(left=[],right=[])=>{
  const map=new Map();
  [...(left||[]),...(right||[])].forEach(value=>{
    if(!value?.routineId)return;
    const old=map.get(value.routineId);
    if(!old){
      map.set(value.routineId,{...value});
      return
    }
    const oldTime=Date.parse(old.updatedAt||0)||0;
    const newTime=Date.parse(value.updatedAt||0)||0;
    if(newTime>=oldTime)map.set(value.routineId,{...value})
  });
  return [...map.values()]
};

const mergeRoutineSuppressions=(left=[],right=[])=>{
  const map=new Map();
  [...(left||[]),...(right||[])].forEach(value=>{
    if(!value?.routineId)return;
    const old=map.get(value.routineId);
    if(!old){
      map.set(value.routineId,{...value});
      return
    }
    const oldTime=Date.parse(old.updatedAt||0)||0;
    const newTime=Date.parse(value.updatedAt||0)||0;
    if(newTime>=oldTime)map.set(value.routineId,{...value})
  });
  return [...map.values()]
};

const mergeDailyMetaValue=(left,right)=>{
  if(!left)return right?{...right}:null;
  if(!right)return{...left};
  const lt=Date.parse(left.updatedAt||left.createdAt||0)||0;
  const rt=Date.parse(right.updatedAt||right.createdAt||0)||0;
  const winner=rt>=lt?{...right}:{...left};
  winner.routineOverrides=mergeRoutineOverrides(
    left.routineOverrides,
    right.routineOverrides
  );
  winner.routineSuppressions=mergeRoutineSuppressions(
    left.routineSuppressions,
    right.routineSuppressions
  );
  return winner
};

const refreshDailyMetaFromCore=()=>{
  if(!core?.getDailyMetaMap)return;
  try{
    const remote=core.getDailyMetaMap()||{};
    Object.entries(remote).forEach(([date,value])=>{
      const incoming=normalizeDayMeta(date,value||{});
      state.dayMeta[date]=mergeDailyMetaValue(state.dayMeta[date],incoming)
    });
    save()
  }catch(e){
    console.warn('Daily Meta core refresh failed',e)
  }
};

const persistDailyMeta=(date,{sync=true}={})=>{
  const meta=ensureDayMeta(date);
  if(!meta.createdAt)meta.createdAt=nowIso();
  meta.updatedAt=nowIso();
  save();

  try{
    const stored=core?.upsertDailyMeta?.(date,meta);
    if(stored)state.dayMeta[date]=normalizeDayMeta(date,stored)
  }catch(e){
    console.error(e);
    toast(e?.message||'날짜 메모를 저장하지 못했습니다.','warn')
  }

  save();
  if(sync)scheduleRemoteSync()
};


const persistEntry=(entry,{sync=true}={})=>{
  save();
  try{
    core?.upsertCalendarEntry?.(entry)
  }catch(e){
    console.error(e);
    toast(e?.message||'일정을 저장하지 못했습니다.','warn')
  }
  if(sync)scheduleRemoteSync()
};



const save=()=>{
  localStorage.setItem(CAL_KEY,JSON.stringify(state));
};

const activeItems=()=>{
  const list=core?.getItems?.()||[];
  return list.filter(item=>item&&item.status!=='deleted')
};

const itemMap=()=>new Map(activeItems().map(item=>[item.id,item]));

const itemTitle=item=>{
  const raw=String(item?.content||'').replace(/\r/g,'');
  const firstLine=(raw.split('\n')[0]||'').trim();
  if(firstLine)return firstLine;
  const firstTask=(item?.tasks||[]).find(t=>!t.deletedAt&&String(t.text||'').trim());
  return firstTask?.text?.trim()||'제목 없는 항목'
};

const itemBody=item=>{
  const raw=String(item?.content||'').replace(/\r/g,'');
  const lines=raw.split('\n');
  if(lines.length<=1)return'';
  return lines.slice(1).join('\n').trim()
};

const itemPreview=(item,max=20)=>{
  const body=itemBody(item).replace(/\s+/g,' ').trim();
  if(!body)return'';
  return body.length>max?`${body.slice(0,max)}…`:body
};

const calendarTokenHtml=text=>{
  const source=String(text||'');
  const tokenRe=/([#@][가-힣A-Za-z0-9_-]+)/g;
  let out='',last=0;

  source.replace(tokenRe,(match,_token,offset)=>{
    out+=esc(source.slice(last,offset));
    if(match.startsWith('#')){
      out+=`<span class="cal-inline-tag">${esc(match)}</span>`
    }else{
      out+=`<span class="cal-inline-project">${esc(match)}</span>`
    }
    last=offset+match.length;
    return match
  });

  out+=esc(source.slice(last));
  return out
};



const durationSlots=duration=>Math.max(1,Math.ceil(Math.max(SLOT,Number(duration)||SLOT)/SLOT));
const bodyLinesForDuration=duration=>Math.max(0,Math.min(7,durationSlots(duration)-1));
const isWorkMinute=minute=>
  Number(minute)>=Number(state.settings.workStartMinute)&&
  Number(minute)<Number(state.settings.workEndMinute);
const workToneClass=()=>`cal-work-${state.settings.workColor||'gray'}`;


const entriesForDate=date=>state.entries
  .filter(e=>e.date===date&&e.status!=='deleted')
  .sort((a,b)=>{
    const am=a.startMinute==null?-1:Number(a.startMinute);
    const bm=b.startMinute==null?-1:Number(b.startMinute);
    return am-bm||Date.parse(a.createdAt||0)-Date.parse(b.createdAt||0)
  });

const visibleEntriesForDate=date=>{
  const items=itemMap();
  return entriesForDate(date).filter(e=>items.has(e.itemId)&&e.status!=='obsolete')
};

const getEntry=id=>state.entries.find(e=>e.id===id&&e.status!=='deleted');

const ensureDayMeta=date=>{
  if(!state.dayMeta[date])state.dayMeta[date]=normalizeDayMeta(date,{});
  return state.dayMeta[date]
};

const dayToneClass=(date,meta=ensureDayMeta(date))=>{
  if(meta.color&&meta.color!=='default')return `cal-tone-${meta.color}`;
  const day=parseDate(date).getDay();
  if(day===0)return'cal-tone-red';
  if(day===6)return'cal-tone-blue';
  return'cal-tone-default'
};

const daySummary=(date,items=itemMap())=>{
  const entries=visibleEntriesForDate(date).filter(e=>e.status!=='obsolete');
  const big3=entries.filter(e=>e.isBig3).slice(0,3);
  const scheduledOther=entries.filter(e=>e.startMinute!=null&&!e.isBig3);
  return{
    entries,
    big3,
    otherCount:scheduledOther.length,
    meta:ensureDayMeta(date),
    big3Titles:big3.map(e=>itemTitle(items.get(e.itemId)))
  }
};

const effectiveEnd=(entry,start=entry.startMinute)=>{
  if(start==null)return null;
  return Math.min(DAY_MINUTES,start+Math.max(SLOT,Number(entry.plannedDurationMinutes)||SLOT))
};

const overlaps=(start,end,other)=>{
  if(other.startMinute==null)return false;
  const os=Number(other.startMinute);
  const oe=effectiveEnd(other,os);
  return start<oe&&end>os
};

const hasCollision=(entry,candidateStart,candidateDuration=entry.plannedDurationMinutes)=>{
  const end=Math.min(DAY_MINUTES,candidateStart+Math.max(SLOT,Number(candidateDuration)||SLOT));
  return visibleEntriesForDate(entry.date)
    .filter(other=>other.id!==entry.id&&other.startMinute!=null&&other.status!=='obsolete')
    .some(other=>overlaps(candidateStart,end,other))
};

const findMoveSlot=(entry,direction)=>{
  const dir=direction==='up'?-1:1;
  let candidate=Number(entry.startMinute)+dir*SLOT;

  while(candidate>=0&&candidate<DAY_MINUTES){
    if(!hasCollision(entry,candidate))return candidate;
    candidate+=dir*SLOT
  }
  return null
};

const firstOpenSlot=(date,duration=SLOT)=>{
  const settings=state.settings;
  const entry={id:'__probe__',date,plannedDurationMinutes:duration,startMinute:null};
  const starts=[];
  for(let m=settings.collapseBeforeMinute;m<DAY_MINUTES;m+=SLOT)starts.push(m);
  for(let m=0;m<settings.collapseBeforeMinute;m+=SLOT)starts.push(m);

  for(const candidate of starts){
    const end=Math.min(DAY_MINUTES,candidate+duration);
    if(end<=candidate)continue;
    if(!hasCollision(entry,candidate,duration))return candidate
  }
  return null
};


const calendarRangeFits=(entry,date,startMinute,duration,ignoreEntryId=entry.id)=>{
  startMinute=Number(startMinute);
  duration=Math.max(SLOT,Number(duration)||SLOT);
  if(!Number.isFinite(startMinute)||startMinute<0||startMinute>=DAY_MINUTES)return false;

  const end=Math.min(DAY_MINUTES,startMinute+duration);
  return !visibleEntriesForDate(date)
    .filter(other=>
      other.id!==ignoreEntryId &&
      other.startMinute!=null &&
      other.status!=='obsolete' &&
      other.entryType!=='routine' &&
      other.entryType!=='routine_override'
    )
    .some(other=>overlaps(startMinute,end,other))
};

const calendarEntryFits=(entry,date,startMinute,ignoreEntryId=entry.id)=>
  calendarRangeFits(
    entry,
    date,
    startMinute,
    Math.max(SLOT,Number(entry.plannedDurationMinutes)||SLOT),
    ignoreEntryId
  );

const moveEntryTo=(entry,date,startMinute)=>{
  startMinute=Math.max(0,Math.min(DAY_MINUTES-SLOT,Math.round(Number(startMinute)/SLOT)*SLOT));

  if(!calendarEntryFits(entry,date,startMinute,entry.id)){
    toast('다른 일정과 겹쳐 이 위치로 옮길 수 없습니다.','warn');
    return false
  }

  const oldDate=entry.date;
  entry.date=date;
  entry.startMinute=startMinute;

  if(entry.isBig3&&oldDate!==date){
    const targetCount=visibleEntriesForDate(date)
      .filter(e=>e.id!==entry.id&&e.isBig3).length;
    if(targetCount>=3){
      entry.isBig3=false;
      toast('대상 날짜의 Big3가 이미 3개라 Big3는 해제하고 이동했습니다.','warn')
    }
  }

  entry.updatedAt=nowIso();
  persistEntry(entry);
  render();
  return true
};

const deferEntryToAdjacentMonday=(entry,direction)=>{
  const monday=direction==='previous'
    ?previousMondayFromWeek(entry.date)
    :nextMondayFromWeek(entry.date);

  entry.date=monday;
  entry.startMinute=null;
  entry.isBig3=false;
  entry.status='planned';
  entry.obsoleteReason=null;
  entry.updatedAt=nowIso();
  persistEntry(entry);
  selectedDate=monday;
  toast(direction==='previous'
    ?'이전 주 월요일 브레인 덤프로 넘겼습니다.'
    :'다음 주 월요일 브레인 덤프로 넘겼습니다.');
  render()
};


let dailyDragState=null;
let dailyRoutineDragState=null;
let dailyResizeState=null;
let lastCalendarDragAt=0;

const clearDailyDrag=()=>{
  if(dailyDragState||dailyRoutineDragState)lastCalendarDragAt=Date.now();
  dailyDragState=null;
  dailyRoutineDragState=null;
  document.body.classList.remove('cal-day-dragging');
  $$('.cal-drag-source').forEach(el=>el.classList.remove('cal-drag-source'));
  $$('.cal-day-drop-hover').forEach(el=>el.classList.remove('cal-day-drop-hover'))
};

const finishDailyResize=valid=>{
  const stateValue=dailyResizeState;
  if(!stateValue)return;

  dailyResizeState=null;
  document.body.classList.remove('cal-day-resizing');

  const entry=getEntry(stateValue.entryId);
  if(!entry){
    render();
    return
  }

  if(!valid||!stateValue.valid){
    toast('다른 일정과 겹쳐 시간 범위를 변경하지 않았습니다.','warn');
    render();
    return
  }

  entry.startMinute=stateValue.previewStart;
  entry.plannedDurationMinutes=stateValue.previewDuration;
  entry.updatedAt=nowIso();
  persistEntry(entry);
  render()
};

const onDailyResizeMove=e=>{
  const rs=dailyResizeState;
  if(!rs)return;

  const deltaSlots=Math.round((e.clientY-rs.originY)/rs.slotHeight);
  const delta=deltaSlots*SLOT;

  let nextStart=rs.originalStart;
  let nextDuration=rs.originalDuration;

  if(rs.edge==='top'){
    const originalEnd=rs.originalStart+rs.originalDuration;
    nextStart=Math.max(
      rs.gridFrom,
      Math.min(rs.originalStart+delta, Math.min(rs.gridTo-SLOT,originalEnd-SLOT))
    );
    nextDuration=Math.max(SLOT,originalEnd-nextStart)
  }else{
    const maxDuration=Math.max(SLOT,rs.gridTo-rs.originalStart);
    nextDuration=Math.max(
      SLOT,
      Math.min(rs.originalDuration+delta,maxDuration)
    )
  }

  nextStart=Math.round(nextStart/SLOT)*SLOT;
  nextDuration=Math.max(SLOT,Math.round(nextDuration/SLOT)*SLOT);

  const entry=getEntry(rs.entryId);
  if(!entry)return;

  const valid=calendarRangeFits(
    entry,
    entry.date,
    nextStart,
    nextDuration,
    entry.id
  );

  rs.previewStart=nextStart;
  rs.previewDuration=nextDuration;
  rs.valid=valid;

  const previewEnd=Math.min(DAY_MINUTES,nextStart+nextDuration);
  rs.block.style.setProperty('--cal-start',String(nextStart));
  rs.block.style.setProperty('--cal-end',String(previewEnd));
  rs.block.classList.toggle('resize-invalid',!valid)
};

const onDailyResizeUp=()=>{
  if(!dailyResizeState)return;
  const valid=dailyResizeState.valid;
  finishDailyResize(valid)
};

const startDailyResize=(entry,block,edge,event)=>{
  if(!entry||entry.status==='completed')return;
  const grid=block.closest('.cal-time-grid');
  const slot=grid?.querySelector('.cal-slot');
  if(!grid||!slot)return;

  event.preventDefault();
  event.stopPropagation();

  const originalStart=Number(entry.startMinute);
  const originalDuration=Math.max(SLOT,Number(entry.plannedDurationMinutes)||SLOT);

  dailyResizeState={
    entryId:entry.id,
    block,
    edge,
    originY:event.clientY,
    slotHeight:slot.getBoundingClientRect().height||34,
    gridFrom:Number(grid.dataset.gridFrom)||0,
    gridTo:Number(grid.dataset.gridTo)||DAY_MINUTES,
    originalStart,
    originalDuration,
    previewStart:originalStart,
    previewDuration:originalDuration,
    valid:true
  };

  document.body.classList.add('cal-day-resizing')
};

window.addEventListener('pointermove',onDailyResizeMove);
window.addEventListener('pointerup',onDailyResizeUp);
window.addEventListener('pointercancel',()=>finishDailyResize(false));

let weeklyDragState=null;

const clearWeeklyDrag=()=>{
  if(weeklyDragState)lastCalendarDragAt=Date.now();
  weeklyDragState=null;
  document.body.classList.remove('cal-week-dragging');
  $$('.cal-week-drag-source').forEach(el=>el.classList.remove('cal-week-drag-source'));
  $$('.cal-week-drop-hover').forEach(el=>el.classList.remove('cal-week-drop-hover'));

  $('#calNextWeekDropZone')?.classList.remove('show','active')

const toast=(message,type='info')=>{
  let el=$('#calToast');
  if(!el){
    el=document.createElement('div');
    el.id='calToast';
    el.className='cal-toast';
    document.body.appendChild(el)
  }
  el.textContent=message;
  el.className=`cal-toast show ${type}`;
  clearTimeout(toast._timer);
  toast._timer=setTimeout(()=>el.classList.remove('show'),2400)
};

const markUpdated=entry=>{
  entry.updatedAt=nowIso();
  persistEntry(entry);
};

const big3Count=date=>visibleEntriesForDate(date).filter(e=>e.isBig3).length;

const toggleBig3=entry=>{
  if(entry.isBig3){
    entry.isBig3=false;
    markUpdated(entry);
    render();
    return
  }
  if(big3Count(entry.date)>=3){
    toast('Big3는 하루 최대 3개까지 지정할 수 있습니다.','warn');
    return
  }
  entry.isBig3=true;
  markUpdated(entry);
  render()
};

const moveEntry=(entry,direction)=>{
  if(entry.startMinute==null)return;
  const target=findMoveSlot(entry,direction);
  if(target==null){
    toast(direction==='up'
      ?'위쪽에 이 일정이 들어갈 빈 시간이 없습니다.'
      :'아래쪽에 이 일정이 들어갈 빈 시간이 없습니다.','warn');
    return
  }
  entry.startMinute=target;
  markUpdated(entry);
  render()
};

const growEntry=entry=>{
  const next=Math.max(SLOT,Number(entry.plannedDurationMinutes)||SLOT)+SLOT;

  if(entry.startMinute!=null){
    const currentEnd=effectiveEnd(entry);
    const nextEnd=Math.min(DAY_MINUTES,Number(entry.startMinute)+next);

    // 자정을 넘는 예상시간 증가는 허용한다.
    // 실제 오늘 점유 영역이 늘어나는 경우에만 충돌을 검사한다.
    if(nextEnd>currentEnd&&hasCollision(entry,Number(entry.startMinute),next)){
      toast('다음 일정과 겹쳐 시간을 늘릴 수 없습니다. 다음 일정을 조정한 후 다시 시도해주세요.','warn');
      return
    }
  }

  entry.plannedDurationMinutes=next;
  markUpdated(entry);
  render()
};

const shrinkEntry=entry=>{
  const duration=Math.max(SLOT,Number(entry.plannedDurationMinutes)||SLOT);
  if(duration>SLOT){
    entry.plannedDurationMinutes=duration-SLOT;
  }else{
    entry.startMinute=null;
  }
  markUpdated(entry);
  render()
};

const checkIn=entry=>{
  if(entry.startMinute!=null)return;
  const slot=firstOpenSlot(entry.date,Math.max(SLOT,Number(entry.plannedDurationMinutes)||SLOT));
  if(slot==null){
    toast('오늘 일정에 들어갈 수 있는 빈 시간이 없습니다.','warn');
    return
  }
  entry.startMinute=slot;
  markUpdated(entry);
  render()
};

const renderTimeGrid=(from,to,entries,items)=>{
  const rows=[];
  for(let m=from;m<to;m+=SLOT){
    rows.push(`<div class="cal-slot ${m%60===0?'hour':''} ${isWorkMinute(m)?'work-hour':''}" data-minute="${m}">
      <span>${m%60===0?minuteLabel(m):''}</span><i></i>
    </div>`)
  }

  const blocks=entries.filter(e=>{
    if(e.startMinute==null)return false;
    const s=Number(e.startMinute),en=effectiveEnd(e,s);
    return s<to&&en>from
  }).map(e=>{
    const item=items.get(e.itemId);
    if(!item)return '';
    const s=Number(e.startMinute),en=effectiveEnd(e,s);
    const displayStart=Math.max(s,from);
    const displayEnd=Math.min(en,to);
    return (e.entryType==='routine'||e.entryType==='routine_override')
      ?routineBlockHtml(e,item,displayStart,displayEnd)
      :blockHtml(e,item,displayStart,displayEnd)
  }).join('');

  return `<div class="cal-time-grid ${workToneClass()}"
    data-grid-from="${from}" data-grid-to="${to}"
    style="--segment-from:${from};--segment-to:${to}">
    <div class="cal-slot-list">${rows.join('')}</div>
    <div class="cal-block-layer">${blocks}</div>
    ${currentTimeLineHtml(from,to)}
  </div>`
};

  }).length
};


const routineSuppressionState=(date,routineId)=>{
  const meta=ensureDayMeta(date);
  const rows=Array.isArray(meta.routineSuppressions)?meta.routineSuppressions:[];
  const row=rows
    .filter(x=>x?.routineId===routineId)
    .sort((a,b)=>(Date.parse(b.updatedAt||0)||0)-(Date.parse(a.updatedAt||0)||0))[0];
  return row?.suppressed===true
};

const activeRoutineOverride=(date,routineId)=>{
  const meta=ensureDayMeta(date);
  return (meta.routineOverrides||[])
    .filter(x=>x?.routineId===routineId&&!x.deletedAt)
    .sort((a,b)=>(Date.parse(b.updatedAt||0)||0)-(Date.parse(a.updatedAt||0)||0))[0]||null
};

const templateRoutineScheduled=(routineId,date)=>
  (core?.getRoutinesForDate?.(date)||[]).some(r=>r.id===routineId);

const routineOccurrenceExists=(routineId,date)=>{
  if(activeRoutineOverride(date,routineId))return true;
  if(routineSuppressionState(date,routineId))return false;
  return templateRoutineScheduled(routineId,date)
};

const routineSoftEntriesForDate=(date,hardEntries)=>{
  const template=core?.getRoutinesForDate?.(date)||[];
  const meta=ensureDayMeta(date);
  const activeOverrides=(meta.routineOverrides||[]).filter(x=>x?.routineId&&!x.deletedAt);
  const map=new Map(template.map(r=>[r.id,r]));

  activeOverrides.forEach(override=>{
    if(map.has(override.routineId))return;
    const routine=core?.getRoutineById?.(override.routineId);
    if(routine)map.set(routine.id,routine)
  });

  const routines=[...map.values()];
  const placed=[],unplaced=[];

  routines.forEach(routine=>{
    const override=activeRoutineOverride(date,routine.id);
    const suppressed=routineSuppressionState(date,routine.id);

    if(suppressed&&!override)return;

    const start=override
      ?Number(override.startMinute)
      :Number(routine.defaultStartMinute);
    const duration=override
      ?Math.max(SLOT,Number(override.plannedDurationMinutes)||SLOT)
      :Math.max(SLOT,Number(routine.defaultDurationMinutes)||SLOT);

    if(!Number.isFinite(start)){
      unplaced.push({...routine,unplacedReason:'시간 미설정'});
      return
    }

    const virtual={
      id:`routine:${routine.id}:${date}`,
      itemId:`routine-item:${routine.id}`,
      date,
      startMinute:start,
      plannedDurationMinutes:duration,
      isBig3:false,
      entryType:override?'routine_override':'routine',
      routineId:routine.id,
      status:'planned',
      routineCompleted:!!core?.getRoutineLog?.(routine.id,date)?.done
    };

    const end=Math.min(DAY_MINUTES,start+duration);
    const collision=hardEntries
      .filter(e=>
        e.startMinute!=null &&
        e.status!=='obsolete' &&
        e.entryType!=='routine' &&
        e.entryType!=='routine_override'
      )
      .some(e=>overlaps(start,end,e));

    if(collision)unplaced.push({...routine,unplacedReason:'일반 일정과 겹침'});
    else placed.push(virtual)
  });

  return{placed,unplaced,routines}
};

const upsertRoutineOverride=(routineId,date,startMinute,duration)=>{
  const meta=ensureDayMeta(date);
  meta.routineOverrides=Array.isArray(meta.routineOverrides)?meta.routineOverrides:[];
  const stamp=nowIso();
  const next={
    routineId,
    startMinute:Math.max(0,Math.min(DAY_MINUTES-SLOT,Math.round(Number(startMinute)/SLOT)*SLOT)),
    plannedDurationMinutes:Math.max(SLOT,Number(duration)||SLOT),
    deletedAt:null,
    updatedAt:stamp
  };
  const idx=meta.routineOverrides.findIndex(x=>x.routineId===routineId);
  if(idx>=0)meta.routineOverrides[idx]=next;
  else meta.routineOverrides.push(next);
  return next
};

const tombstoneRoutineOverride=(routineId,date)=>{
  const meta=ensureDayMeta(date);
  meta.routineOverrides=Array.isArray(meta.routineOverrides)?meta.routineOverrides:[];
  const old=activeRoutineOverride(date,routineId);
  if(!old)return;
  const next={...old,deletedAt:nowIso(),updatedAt:nowIso()};
  const idx=meta.routineOverrides.findIndex(x=>x.routineId===routineId);
  if(idx>=0)meta.routineOverrides[idx]=next;
  else meta.routineOverrides.push(next)
};

const setRoutineSuppressed=(routineId,date,suppressed)=>{
  const meta=ensureDayMeta(date);
  meta.routineSuppressions=Array.isArray(meta.routineSuppressions)?meta.routineSuppressions:[];
  const next={routineId,suppressed:!!suppressed,updatedAt:nowIso()};
  const idx=meta.routineSuppressions.findIndex(x=>x.routineId===routineId);
  if(idx>=0)meta.routineSuppressions[idx]=next;
  else meta.routineSuppressions.push(next)
};

const routineTargetFits=(routineId,date,startMinute)=>{
  const routine=core?.getRoutineById?.(routineId);
  if(!routine)return false;
  const duration=Math.max(SLOT,Number(routine.defaultDurationMinutes)||SLOT);
  const end=Math.min(DAY_MINUTES,Number(startMinute)+duration);

  return !visibleEntriesForDate(date)
    .filter(other=>other.startMinute!=null)
    .some(other=>overlaps(Number(startMinute),end,other))
};

const placeRoutineOverride=(routineId,date,startMinute)=>{
  const routine=core?.getRoutineById?.(routineId);
  if(!routine){
    toast('Routine을 찾을 수 없습니다.','warn');
    return false
  }

  if(!routineTargetFits(routineId,date,startMinute)){
    toast('일반 일정과 겹쳐 이 시간에는 Routine을 배치할 수 없습니다.','warn');
    return false
  }

  upsertRoutineOverride(
    routineId,
    date,
    startMinute,
    Math.max(SLOT,Number(routine.defaultDurationMinutes)||SLOT)
  );
  setRoutineSuppressed(routineId,date,false);
  persistDailyMeta(date);
  render();
  return true
};

const moveRoutineOccurrence=(routineId,sourceDate,targetDate,startMinute)=>{
  const routine=core?.getRoutineById?.(routineId);
  if(!routine){
    toast('Routine을 찾을 수 없습니다.','warn');
    return false
  }

  if(sourceDate!==targetDate&&routineOccurrenceExists(routineId,targetDate)){
    toast('대상 날짜에는 이미 같은 Routine이 있습니다. 같은 Routine은 하루에 한 번만 배치합니다.','warn');
    return false
  }

  if(!routineTargetFits(routineId,targetDate,startMinute)){
    toast('일반 일정과 겹쳐 이 위치로 Routine을 옮길 수 없습니다.','warn');
    return false
  }

  const duration=Math.max(SLOT,Number(routine.defaultDurationMinutes)||SLOT);

  if(sourceDate!==targetDate){
    if(activeRoutineOverride(sourceDate,routineId))tombstoneRoutineOverride(routineId,sourceDate);
    if(templateRoutineScheduled(routineId,sourceDate))setRoutineSuppressed(routineId,sourceDate,true);

    setRoutineSuppressed(routineId,targetDate,false);
    upsertRoutineOverride(routineId,targetDate,startMinute,duration);

    persistDailyMeta(sourceDate,{sync:false});
    persistDailyMeta(targetDate,{sync:false});
    scheduleRemoteSync()
  }else{
    setRoutineSuppressed(routineId,targetDate,false);
    upsertRoutineOverride(routineId,targetDate,startMinute,duration);
    persistDailyMeta(targetDate)
  }

  render();
  return true
};

const migrateLegacyRoutineOverrides=()=>{
  const legacy=(state.entries||[]).filter(e=>e?.entryType==='routine_override'&&e.routineId);
  if(!legacy.length)return 0;

  legacy.forEach(entry=>{
    const meta=ensureDayMeta(entry.date);
    meta.routineOverrides=Array.isArray(meta.routineOverrides)?meta.routineOverrides:[];
    const value={
      routineId:entry.routineId,
      startMinute:entry.startMinute,
      plannedDurationMinutes:Math.max(SLOT,Number(entry.plannedDurationMinutes)||SLOT),
      deletedAt:null,
      updatedAt:entry.updatedAt||entry.createdAt||nowIso()
    };
    const idx=meta.routineOverrides.findIndex(x=>x.routineId===entry.routineId);
    if(idx<0)meta.routineOverrides.push(value);
    else{
      const old=meta.routineOverrides[idx];
      if((Date.parse(value.updatedAt)||0)>=(Date.parse(old.updatedAt)||0)){
        meta.routineOverrides[idx]=value
      }
    }
  });

  state.entries=state.entries.filter(e=>e?.entryType!=='routine_override');
  save();
  return legacy.length
};
