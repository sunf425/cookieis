<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-title" content="Review & Todo"><link rel="icon" type="image/png" sizes="192x192" href="./app-icon.png?v=r15">
<link rel="shortcut icon" type="image/png" sizes="192x192" href="./app-icon.png?v=r15">
<link rel="apple-touch-icon" sizes="192x192" href="./app-icon.png?v=r15">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#377b59"><title>Review & Todo</title><style id="rt-calendar-embedded-style">
/* Review & Todo Calendar
   Rev. r31.7_260928 / Routine Execution + Daily Drag Fix */

.main.calendar-mode{padding:22px 28px}
.main.calendar-mode .wrap{max-width:1380px;width:100%}
.calendar-page{width:100%;min-width:0}
.calendar-page.hidden{display:none!important}

.top-mode-switch{gap:3px}
.top-mode-switch .top-mode-btn{min-width:0}
#calendarNav.active{background:#edf7f1!important;color:#236345!important}

.cal-header{
  position:sticky;
  top:-22px;
  z-index:6;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:14px;
  padding:14px 0 13px;
  margin-bottom:12px;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #e8e9e7;
}
.cal-date-nav{display:flex;align-items:center;gap:6px;min-width:0}
.cal-date-nav>button,
.cal-view-switch button,
.cal-header-actions button{
  border:1px solid #e2e5e2;
  background:#fff;
  color:#444943;
  border-radius:8px;
  min-height:34px;
  padding:6px 10px;
  cursor:pointer;
  font:inherit;
}
.cal-date-nav>button:first-child,
.cal-date-nav>button:last-child{width:36px;padding:0;font-size:20px}
.cal-date-nav .cal-date-title{
  border-color:transparent;
  font-weight:800;
  font-size:15px;
  text-align:left;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.cal-view-switch{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  padding:3px;
  border:1px solid #e2e5e2;
  background:#f7f8f7;
  border-radius:10px;
}
.cal-view-switch button{
  border:0;
  background:transparent;
  min-height:30px;
  padding:4px 12px;
}
.cal-view-switch button.active{
  background:#fff;
  color:#246445;
  font-weight:800;
  box-shadow:0 1px 4px #00000010;
}
.cal-header-actions{display:flex;justify-content:flex-end;gap:6px}
.cal-header-actions button:first-child{font-weight:750}

.cal-day-layout{
  display:grid;
  grid-template-columns:minmax(260px,340px) minmax(520px,1fr);
  gap:16px;
  align-items:start;
}
.cal-day-left{
  display:flex;
  flex-direction:column;
  gap:12px;
  position:sticky;
  top:55px;
  max-height:calc(100vh - 78px);
  overflow:auto;
  padding-right:2px;
}
.cal-panel{
  background:#fff;
  border:1px solid #e5e7e5;
  border-radius:12px;
  box-shadow:0 1px 3px #00000008;
}
.cal-panel-head{
  min-height:45px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px 12px;
  border-bottom:1px solid #eff0ee;
}
.cal-panel-head strong{font-size:13px}
.cal-panel-head small{font-size:11px;color:#939892}

.cal-big3-list{padding:7px}
.cal-big3-item{
  display:flex;
  width:100%;
  align-items:center;
  gap:9px;
  padding:9px 8px;
  border:0;
  background:transparent;
  border-radius:8px;
  text-align:left;
  cursor:pointer;
  color:#343834;
}
.cal-big3-item:hover{background:#f5f7f5}
.cal-big3-item b{
  display:grid;
  place-items:center;
  width:23px;
  height:23px;
  border-radius:50%;
  background:#edf6f0;
  color:#276748;
  font-size:11px;
  flex:0 0 auto;
}
.cal-big3-item span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-empty-mini{padding:16px 12px;color:#9a9e99;font-size:12px;text-align:center}

.cal-brain-list{padding:6px}
.cal-brain-item{padding:9px;border-radius:9px}
.cal-brain-item+.cal-brain-item{border-top:1px solid #f0f1ef}
.cal-brain-title{display:flex;align-items:center;gap:6px;min-width:0}
.cal-brain-title strong{font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-big3-badge{
  flex:0 0 auto;
  border-radius:999px;
  background:#f0eafa;
  color:#684b99;
  padding:2px 6px;
  font-size:9px;
  font-weight:850;
}
.cal-brain-actions{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.cal-brain-actions button,
.cal-time-actions button,
.cal-add-secondary,
.cal-settings-mini{
  border:1px solid #e2e5e2;
  background:#fff;
  border-radius:6px;
  color:#6e746e;
  font:inherit;
  font-size:10px;
  padding:4px 7px;
  cursor:pointer;
}
.cal-brain-actions button:hover,
.cal-time-actions button:hover{background:#f2f5f2;color:#303530}
.cal-brain-actions button.active,
.cal-time-actions button.active{background:#f0eafa;color:#60438f;border-color:#d9c9ef}
.cal-brain-actions button.danger{color:#aa5b5b}
.cal-add-secondary{
  width:calc(100% - 16px);
  margin:2px 8px 10px;
  min-height:34px;
  border-style:dashed;
  font-size:12px;
}

.cal-daily-text-panel{padding:12px}
.cal-daily-text-panel label{display:block}
.cal-daily-text-panel label+label{margin-top:12px}
.cal-daily-text-panel label>strong{display:block;margin-bottom:5px;font-size:12px}
.cal-daily-text-panel textarea{
  width:100%;
  min-height:86px;
  resize:vertical;
  border:1px solid #e4e6e4;
  border-radius:8px;
  padding:9px 10px;
  outline:0;
  font:inherit;
  font-size:12px;
  line-height:1.6;
  background:#fbfcfb;
}
.cal-daily-text-panel textarea:focus{background:#fff;border-color:#8bb49c}

.cal-timetable-panel{position:relative;overflow:hidden}
.cal-timetable-head{position:relative;top:auto;z-index:1;background:#fff}
.cal-timetable-head>div{display:flex;align-items:baseline;gap:7px}

.cal-fold{
  width:100%;
  border:0;
  border-bottom:1px solid #eceeec;
  background:#f6f7f6;
  min-height:35px;
  color:#707570;
  font:inherit;
  font-size:11px;
  cursor:pointer;
}
.cal-fold b{margin-left:8px;color:#526258}

.cal-time-grid{position:relative;min-height:48px;background:#fff}
.cal-slot-list{position:relative}
.cal-slot{
  height:34px;
  display:grid;
  grid-template-columns:60px 1fr;
  align-items:start;
  position:relative;
}
.cal-slot>span{
  padding:3px 9px 0 0;
  text-align:right;
  font-size:9px;
  color:#a0a49f;
  transform:none;
}
.cal-slot>i{
  height:100%;
  border-top:1px solid #f0f1ef;
  border-left:1px solid #eceeec;
}
.cal-slot.hour>i{border-top-color:#dde1dd}
.cal-slot.hour>span{color:#757a75;font-weight:700}

.cal-block-layer{
  position:absolute;
  left:61px;
  right:8px;
  top:0;
  bottom:0;
  pointer-events:none;
}
.cal-time-block{
  position:absolute;
  left:8px;
  right:4px;
  top:calc((var(--cal-start) - var(--segment-from)) / 30 * 34px + 2px);
  height:calc((var(--cal-end) - var(--cal-start)) / 30 * 34px - 4px);
  min-height:30px;
  z-index:2;
  pointer-events:auto;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
  padding:6px 7px 5px 9px;
  border:1px solid #cddfd4;
  border-left:4px solid #4d8d68;
  border-radius:8px;
  background:#f3faf5;
  overflow:hidden;
}
.cal-time-block-main{min-width:0;display:flex;flex-direction:column}
.cal-time-block-main strong{
  font-size:11px;
  line-height:1.35;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.cal-time-block-main small{
  color:#6f7c72;
  font-size:9px;
  line-height:1.3;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.cal-time-actions{
  display:flex;
  gap:2px;
  flex:0 0 auto;
  opacity:.25;
  transition:opacity .12s ease;
}
.cal-time-block:hover .cal-time-actions{opacity:1}
.cal-time-actions button{padding:2px 5px;background:#ffffffd9}

.cal-floating-add{
  position:sticky;
  float:right;
  right:16px;
  bottom:18px;
  z-index:8;
  width:52px;
  height:52px;
  margin:14px 14px 14px auto;
  border:0;
  border-radius:50%;
  background:#2d7752;
  color:#fff;
  font-size:27px;
  line-height:1;
  cursor:pointer;
  box-shadow:0 7px 20px #245c413b;
}

.cal-week-grid{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:8px;
}
.cal-week-day{
  min-height:145px;
  border:1px solid #e4e7e4;
  background:#fff;
  border-radius:11px;
  padding:10px;
  text-align:left;
  cursor:pointer;
  color:#3d423e;
}
.cal-week-day:hover{border-color:#afc9b8}
.cal-week-day.today{box-shadow:inset 0 0 0 2px #7da78c}
.cal-week-day-head{display:flex;justify-content:space-between;color:#7f847f}
.cal-week-day>strong{display:block;font-size:26px;margin-top:25px}
.cal-week-day>small{color:#949994}
.cal-week-big3{display:block;margin-top:6px;color:#7357a2;font-size:10px}

.cal-month-weekdays,
.cal-month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-month-weekdays span{padding:8px;text-align:center;color:#858a85;font-size:11px}
.cal-month-grid{border-top:1px solid #e5e7e5;border-left:1px solid #e5e7e5}
.cal-month-day{
  min-height:105px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:8px;
  padding:9px;
  border:0;
  border-right:1px solid #e5e7e5;
  border-bottom:1px solid #e5e7e5;
  background:#fff;
  color:#454945;
  cursor:pointer;
}
.cal-month-day:hover{background:#fafcfa}
.cal-month-day.outside{color:#b5b8b5;background:#fbfbfb}
.cal-month-day.today b{
  display:grid;
  place-items:center;
  width:25px;height:25px;
  border-radius:50%;
  background:#2f7653;
  color:#fff;
}
.cal-month-day span{font-size:10px;color:#7f857f}
.cal-month-day i{
  font-style:normal;
  font-size:9px;
  padding:2px 5px;
  border-radius:999px;
  color:#684b99;
  background:#f0eafa;
}
.cal-overview-note{
  margin-top:14px;
  padding:11px 13px;
  border-radius:9px;
  background:#f7f8f7;
  color:#858a85;
  font-size:11px;
}

.cal-modal{
  position:fixed;
  inset:0;
  z-index:50;
  display:grid;
  place-items:center;
  padding:16px;
  background:#0000005c;
}
.cal-modal.hidden{display:none!important}
.cal-dialog{
  width:min(440px,100%);
  background:#fff;
  border-radius:14px;
  padding:20px;
  box-shadow:0 20px 70px #00000035;
}
.cal-dialog h2{margin:0 0 7px;font-size:18px}
.cal-dialog>p{margin:0 0 14px;color:#878c87;font-size:12px}
.cal-dialog input,
.cal-dialog select{
  width:100%;
  border:1px solid #dfe3df;
  border-radius:8px;
  padding:9px 10px;
  outline:0;
  background:#fff;
  font:inherit;
}
.cal-dialog input:focus,
.cal-dialog select:focus{border-color:#77a589}
.cal-dialog label{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin:10px 0;
  color:#555b56;
  font-size:12px;
}
.cal-dialog label span{display:flex;align-items:center;gap:7px}
.cal-dialog label select{min-width:110px}
.cal-dialog-actions{
  display:flex;
  justify-content:flex-end;
  gap:7px;
  margin-top:16px;
}
.cal-dialog-actions button{
  min-width:72px;
  border:1px solid #dfe2df;
  background:#fff;
  border-radius:8px;
  padding:8px 12px;
  font:inherit;
  cursor:pointer;
}
.cal-dialog-actions button.primary{background:#2f7653;color:#fff;border-color:#2f7653}
.cal-create-dialog input{font-size:15px;padding:11px 12px}

.cal-toast{
  position:fixed;
  left:50%;
  bottom:28px;
  z-index:80;
  transform:translate(-50%,16px);
  max-width:min(520px,calc(100vw - 30px));
  padding:9px 13px;
  border-radius:9px;
  background:#2f3530;
  color:#fff;
  font-size:12px;
  box-shadow:0 8px 28px #0004;
  opacity:0;
  pointer-events:none;
  transition:.16s ease;
}
.cal-toast.show{opacity:1;transform:translate(-50%,0)}
.cal-toast.warn{background:#744f35}

.calendar-jump-highlight{animation:calJump 1.6s ease}
@keyframes calJump{
  0%,100%{box-shadow:none}
  30%{box-shadow:0 0 0 3px #78a88a55;background:#f1f9f4}
}

@media(max-width:900px){
  .main.calendar-mode{padding:14px}
  .cal-header{
    top:-14px;
    grid-template-columns:1fr auto;
  }
  .cal-view-switch{grid-row:2;grid-column:1/-1}
  .cal-header-actions{grid-column:2}
  .cal-day-layout{grid-template-columns:minmax(220px,290px) minmax(430px,1fr);gap:10px}
}

@media(max-width:620px){
  .main.calendar-mode{padding:10px 10px 24px}
  .main.calendar-mode .wrap{max-width:none}
  .calendar-page{padding-bottom:60px}
  .cal-header{
    position:sticky;
    top:0;
    z-index:10;
    grid-template-columns:1fr auto;
    gap:7px;
    padding:9px 0 8px;
    margin-bottom:8px;
  }
  .cal-date-nav{min-width:0}
  .cal-date-nav>button:first-child,
  .cal-date-nav>button:last-child{width:31px}
  .cal-date-nav .cal-date-title{font-size:12px;padding:4px;min-width:0}
  .cal-header-actions button{padding:5px 7px;font-size:10px}
  .cal-view-switch{grid-column:1/-1;grid-row:2}
  .cal-view-switch button{font-size:11px}

  .cal-day-layout{
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .cal-day-left{
    display:contents;
    position:static;
    max-height:none;
    overflow:visible;
  }
  .cal-big3-panel{order:1}
  .cal-timetable-panel{order:2;width:100%}
  .cal-brain-panel{order:3}
  .cal-daily-text-panel{order:4}
  .cal-timetable-head{top:87px}

  .cal-time-grid{min-width:0}
  .cal-slot{grid-template-columns:49px 1fr;height:36px}
  .cal-slot>span{font-size:8px;padding-right:7px}
  .cal-block-layer{left:50px;right:4px}
  .cal-time-block{
    left:4px;
    right:1px;
    top:calc((var(--cal-start) - var(--segment-from)) / 30 * 36px + 2px);
    height:calc((var(--cal-end) - var(--cal-start)) / 30 * 36px - 4px);
    padding:5px 4px 4px 7px;
  }
  .cal-time-block-main strong{font-size:10.5px}
  .cal-time-block-main small{font-size:8px}
  .cal-time-actions{opacity:1;gap:1px}
  .cal-time-actions button{font-size:9px;padding:2px 4px}
  .cal-time-actions button[data-cal-act="big3"]{font-size:8px}

  .cal-floating-add{
    width:56px;height:56px;
    bottom:14px;
    right:10px;
    margin-right:10px;
  }
  .cal-week-grid{grid-template-columns:1fr}
  .cal-week-day{min-height:74px;display:grid;grid-template-columns:1fr auto auto;align-items:center}
  .cal-week-day>strong{margin:0;font-size:19px}
  .cal-week-big3{margin:0}
  .cal-month-day{min-height:72px;padding:6px;gap:3px}
  .cal-month-day span{font-size:9px}
  .cal-month-day i{font-size:7px;padding:1px 3px}

  .cal-modal{padding:12px}
  .cal-dialog{padding:18px 15px;border-radius:13px}
}

@media(max-width:390px){
  .cal-time-actions button{padding:2px 3px}
  .cal-time-block-main small{display:none}
}


/* ===== r31.2 Completion / Review ===== */
.cal-time-block.completed{
  border-color:#d7dbd7;
  border-left-color:#9a9f9b;
  background:#f2f3f2;
  color:#747975;
}
.cal-time-block.completed .cal-time-block-main strong{
  text-decoration:line-through;
  text-decoration-thickness:1px;
}
.cal-time-block.completed .cal-time-block-main small{color:#969b97}
.cal-check-btn{
  background:#2f7653!important;
  border-color:#2f7653!important;
  color:#fff!important;
  font-weight:800!important;
}
.cal-undo-btn{
  background:#fff!important;
  border-color:#d4d7d4!important;
  color:#737873!important;
  white-space:nowrap;
}
.cal-completion-dialog{width:min(570px,100%)}
.cal-completion-kicker{
  display:inline-flex;
  padding:3px 8px;
  border-radius:999px;
  background:#edf7f1;
  color:#317453;
  font-size:10px;
  font-weight:850;
  margin-bottom:8px;
}
.cal-completion-dialog h2{
  margin-bottom:18px;
  font-size:17px;
  line-height:1.45;
}
.cal-completion-question{
  margin:0 0 9px!important;
  color:#353a36!important;
  font-size:13px!important;
  font-weight:800;
}
.cal-completion-question.second{margin-top:18px!important}
.cal-result-options{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-bottom:15px;
}
.cal-result-options label{margin:0;display:block}
.cal-result-options input{
  position:absolute;
  opacity:0;
  pointer-events:none;
}
.cal-result-options span{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:43px;
  border:1px solid #e0e4e0;
  border-radius:9px;
  background:#fafbfa;
  color:#555b56;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
}
.cal-result-options input:checked+span{
  border-color:#75a187;
  background:#edf7f1;
  color:#2e684a;
  box-shadow:inset 0 0 0 1px #75a187;
}
.cal-completion-dialog textarea{
  width:100%;
  min-height:92px;
  resize:vertical;
  border:1px solid #dfe3df;
  border-radius:9px;
  padding:10px 11px;
  outline:0;
  font:inherit;
  font-size:12px;
  line-height:1.6;
  background:#fbfcfb;
}
.cal-completion-dialog textarea:focus{
  border-color:#78a58a;
  background:#fff;
}
.cal-completion-help{
  margin:6px 0 0!important;
  color:#989d99!important;
  font-size:10px!important;
}

@media(max-width:620px){
  .cal-result-options{grid-template-columns:1fr}
  .cal-result-options span{
    min-height:39px;
    justify-content:flex-start;
    padding:0 12px;
  }
  .cal-completion-dialog{
    max-height:calc(100vh - 24px);
    overflow:auto;
  }
  .cal-time-actions .cal-check-btn,
  .cal-time-actions .cal-undo-btn{font-size:8px!important}
}


/* ===== r31.2 fix1: TimeTable fold/layout correction ===== */
.cal-fold{
  position:relative;
  z-index:3;
  display:block;
  clear:both;
}
.cal-fold-early{
  border-top:0;
  border-bottom:1px solid #e5e8e5;
}
.cal-fold-late{
  border-top:1px solid #e5e8e5;
  border-bottom:0;
}
.cal-timetable-panel{
  overflow:hidden;
}
.cal-time-grid{
  overflow:hidden;
}
.cal-time-block-main:has(> strong:only-child){
  justify-content:center;
}
@media(max-width:620px){
  .cal-timetable-head{top:auto}
}


/* ======================================================
   r31.3 — Day label / Monthly / Weekly
   ====================================================== */

.cal-day-label-body{padding:10px 12px 12px}
.cal-day-label-body input{
  width:100%;
  height:36px;
  border:1px solid #e0e4e0;
  border-radius:8px;
  padding:7px 10px;
  font:inherit;
  font-size:12px;
  outline:0;
  background:#fbfcfb;
}
.cal-day-label-body input:focus{border-color:#7da88d;background:#fff}
.cal-color-palette{
  display:flex;
  align-items:center;
  gap:7px;
  margin-bottom:9px;
  flex-wrap:wrap;
}
.cal-color-swatch{
  position:relative;
  width:19px;
  height:19px;
  padding:0;
  border-radius:5px;
  border:1px solid #d8ddd9;
  cursor:pointer;
  background:var(--day-tone,#f2f4f2);
}
.cal-color-swatch.active{
  box-shadow:0 0 0 2px #fff,0 0 0 4px currentColor;
}
.cal-tone-default{--day-tone:#eef1ee;--day-text:#4a504b;color:#4a504b}
.cal-tone-red{--day-tone:#e55b5b;--day-text:#c43e3e;color:#c43e3e}
.cal-tone-orange{--day-tone:#ea9147;--day-text:#cb6d23;color:#cb6d23}
.cal-tone-yellow{--day-tone:#e2ba3f;--day-text:#a98217;color:#a98217}
.cal-tone-green{--day-tone:#55a46f;--day-text:#347c4c;color:#347c4c}
.cal-tone-blue{--day-tone:#4e87d9;--day-text:#316bbb;color:#316bbb}
.cal-tone-indigo{--day-tone:#526bb0;--day-text:#3d5599;color:#3d5599}
.cal-tone-purple{--day-tone:#8c63c7;--day-text:#7046aa;color:#7046aa}
.cal-tone-black{--day-tone:#3f4340;--day-text:#303330;color:#303330}
.cal-color-swatch.cal-tone-default{
  background:linear-gradient(135deg,#fff 0 45%,#cfd5d0 46% 54%,#fff 55% 100%);
}
.cal-color-swatch:not(.cal-tone-default){background:var(--day-tone)}

/* Monthly */
.cal-month-weekdays .sun{color:#c94d4d}
.cal-month-weekdays .sat{color:#4178c0}
.cal-month-day{
  min-height:132px;
  gap:4px;
  overflow:hidden;
}
.cal-month-date-row{
  display:flex;
  width:100%;
  align-items:center;
  min-width:0;
  gap:6px;
  color:var(--day-text,#454945);
}
.cal-month-date-row>b{
  flex:0 0 auto;
  font-size:12px;
}
.cal-month-date-row>span{
  min-width:0;
  flex:1;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  color:inherit;
  font-size:10px;
  font-weight:700;
}
.cal-month-day.today .cal-month-date-row>b{
  display:grid;
  place-items:center;
  width:24px;
  height:24px;
  border-radius:50%;
  background:var(--day-tone,#2f7653);
  color:#fff;
}
.cal-month-big3{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:3px;
  margin-top:5px;
  color:#404640;
}
.cal-month-big3>span{
  display:flex;
  align-items:center;
  gap:5px;
  min-width:0;
  width:100%;
  font-size:10px;
  line-height:1.35;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.cal-month-big3>span>i{
  display:grid;
  place-items:center;
  flex:0 0 auto;
  width:15px;height:15px;
  border-radius:50%;
  font-style:normal;
  font-size:8px;
  font-weight:800;
  color:#6b4b9a;
  background:#f0eafa;
}
.cal-month-count{
  margin-top:auto;
  color:#7c827d;
  font-size:11px;
  font-weight:800;
}

/* Weekly summary */
.cal-week-summary{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  border-top:1px solid #e4e7e4;
  border-left:1px solid #e4e7e4;
}
.cal-week-summary-day{
  min-width:0;
  min-height:132px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  padding:8px;
  border:0;
  border-right:1px solid #e4e7e4;
  border-bottom:1px solid #e4e7e4;
  background:#fff;
  color:#404540;
  cursor:pointer;
  text-align:left;
}
.cal-week-summary-day:hover{background:#fafcfa}
.cal-week-summary-day.today{box-shadow:inset 0 0 0 2px #7ea98f}
.cal-week-summary-date{
  display:flex;
  align-items:baseline;
  gap:5px;
  color:var(--day-text,#535853);
}
.cal-week-summary-date b{font-size:12px}
.cal-week-summary-date span{font-size:9px}
.cal-week-summary-label{
  width:100%;
  height:17px;
  margin-top:2px;
  color:var(--day-text,#535853);
  font-size:9px;
  font-weight:750;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.cal-week-summary-big3{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:2px;
  margin-top:6px;
}
.cal-week-summary-big3 span{
  display:flex;
  gap:4px;
  min-width:0;
  width:100%;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:9px;
}
.cal-week-summary-big3 span b{
  color:#7655a4;
  flex:0 0 auto;
}
.cal-week-count{
  margin-top:auto;
  font-size:10px;
  color:#777d78;
}

/* Weekly 30-minute read-only timetable */
.cal-week-timetable-wrap{
  width:100%;
  overflow:auto;
  border-left:1px solid #e1e4e1;
  border-right:1px solid #e1e4e1;
  border-bottom:1px solid #e1e4e1;
  background:#fff;
}
.cal-week-timetable{
  position:relative;
  display:grid;
  grid-template-columns:54px repeat(7,minmax(105px,1fr));
  grid-template-rows:repeat(var(--cal-week-slots),32px);
  min-width:var(--cal-week-min-width);
}
.cal-week-time-label{
  z-index:1;
  padding:3px 6px 0 0;
  border-top:1px solid #eceeec;
  color:#8b908b;
  font-size:8px;
  text-align:right;
  background:#fff;
}
.cal-week-time-cell{
  border-top:1px solid #eceeec;
  border-left:1px solid #eceeec;
  background:#fff;
  cursor:pointer;
}
.cal-week-time-cell:hover{background:#fafcfa}
.cal-week-time-block{
  z-index:3;
  min-width:0;
  margin:2px;
  padding:4px 5px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  border:1px solid #cddfd4;
  border-left:3px solid #4d8d68;
  border-radius:6px;
  background:#f3faf5;
  color:#354039;
  font:inherit;
  font-size:9px;
  font-weight:700;
  text-align:left;
  cursor:pointer;
}
.cal-week-time-block.completed{
  border-color:#d9dcda;
  border-left-color:#9da19e;
  background:#f2f3f2;
  color:#858a86;
  text-decoration:line-through;
}

@media(max-width:900px){
  .cal-week-summary{min-width:760px}
  .cal-month-day{min-height:116px}
}
@media(max-width:620px){
  .cal-color-palette{gap:8px}
  .cal-color-swatch{width:22px;height:22px}
  .cal-month-day{min-height:92px;padding:5px}
  .cal-month-big3>span{font-size:8px}
  .cal-month-big3>span>i{display:none}
  .cal-month-date-row>span{font-size:8px}
  .cal-month-count{font-size:9px}
  .cal-week-summary{min-width:760px}
  .cal-week-timetable{min-width:900px}
}

}

.cal-week-weekdays>span{

.cal-week-weekdays>span.sat{color:#3e73bb}

.cal-week-dates{

}
.cal-week-date-cell{

}
.cal-week-date-cell:hover{background:#fafcfa}

.cal-week-date-cell>b{
  flex:0 0 auto;

}
.cal-week-date-cell>span{
  min-width:0;
  flex:1;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:13px;

}
.cal-week-timetable{

.cal-week-time-block>span{

.cal-week-time-block>b{

.cal-week-time-block.big3{

/* ======================================================
   r31.4 — Routine Soft Schedule
   ====================================================== */
.cal-routine-soft-block{

.cal-routine-badge{

}
.cal-routine-unplaced-list{padding:6px}
.cal-routine-unplaced-list button{
  width:100%;
  display:flex;
  justify-content:space-between;
  gap:8px;
  padding:8px;
  border:0;
  border-radius:7px;
  background:transparent;
  text-align:left;

}
.cal-routine-unplaced-list button:hover{background:#faf7ff}
.cal-routine-unplaced-list b{

}
.cal-routine-unplaced-list span{

/* Routine editor schedule fields */

}
.routine-schedule-row label{

  gap:6px;
  font-size:11px;
}
.routine-schedule-row input{
  min-width:0;
  width:100%;
}

/* Calendar Routine dashboard */
.cal-routine-dashboard-dialog{
  width:min(820px,100%);
  max-height:calc(100vh - 30px);
  overflow:auto;

}
.cal-routine-close{

}
.cal-routine-dashboard-head{

  align-items:flex-start;

  padding-right:38px;
}
.cal-routine-dashboard-head h2{margin:0;font-size:20px}
.cal-routine-dashboard-head p{margin:5px 0 0;color:#8a8f8a;font-size:11px}
.cal-routine-dashboard-head .primary{

  color:#fff;

}
.cal-routine-stats{

}
.cal-routine-stats>div{

  background:#fbfcfb;

.cal-routine-stats b{display:block;font-size:20px;color:#374039}
.cal-routine-stats span{display:block;margin-top:3px;color:#8a8f8a;font-size:10px}
.cal-routine-heat-wrap{

}
.cal-routine-heat-wrap>strong{font-size:11px}
.cal-routine-heatmap{

}
.cal-routine-heat{
  width:14px;height:14px;

  background:#eceeec;
}
.cal-routine-heat.full{background:#3c8a5d}
.cal-routine-heat.partial{background:#e4ba52}
.cal-routine-heat.miss{background:#e7c2c2}
.cal-routine-list-head{
  display:flex;

  margin:18px 0 7px;

}
.cal-routine-manage-list{

}
.cal-routine-manage-list>button{
  width:100%;
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  padding:11px 5px;
  border:0;
  border-bottom:1px solid #eceeec;
  background:#fff;

.cal-routine-manage-list>button:hover{background:#fafbfa}
.cal-routine-manage-list>button>span{display:flex;flex-direction:column;min-width:0}
.cal-routine-manage-list b{

  overflow:hidden;
  white-space:nowrap;

}
.cal-routine-manage-list small{margin-top:3px;color:#909590;font-size:9px}
.cal-routine-manage-list>button>span:last-child{text-align:right}
.cal-routine-empty{
  padding:24px;

@media(max-width:620px){
  .cal-month-date-row>b{font-size:13px!important}
  .cal-month-date-row>span{font-size:11px!important}
  .cal-month-big3>span{font-size:9px!important}

  .cal-week-layout{min-width:820px}
  .cal-week-weekdays,
  .cal-week-dates,
  .cal-week-timetable{
    grid-template-columns:48px repeat(7,minmax(105px,1fr));
  }
  .cal-week-date-cell>b{font-size:13px}
  .cal-week-date-cell>span{font-size:11px}

  .cal-routine-stats{grid-template-columns:repeat(2,1fr)}
  .routine-schedule-row{grid-template-columns:1fr}
}


/* ======================================================
   r31.5 — Weekly drag & drop
   ====================================================== */
.cal-week-workspace{
  display:grid;
  grid-template-columns:minmax(0,1fr) 0;
  gap:0;
  align-items:stretch;
  transition:grid-template-columns .15s ease,gap .15s ease;
}
body.cal-week-dragging .cal-week-workspace{
  grid-template-columns:minmax(0,1fr) 150px;
  gap:8px;
}
.cal-week-time-block[draggable="true"]{
  cursor:grab;
}
.cal-week-time-block[draggable="true"]:active{
  cursor:grabbing;
}
.cal-week-time-cell.cal-week-drop-hover{
  background:#eaf5ee!important;
  box-shadow:inset 0 0 0 2px #63a37c;
}
.cal-next-week-drop{
  min-width:0;
  overflow:hidden;
  opacity:0;
  pointer-events:none;
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:7px;
  border:2px dashed #d0d6d1;
  border-radius:10px;
  background:#fafbfa;
  color:#707771;
  text-align:center;
  transition:opacity .15s ease,background .15s ease,border-color .15s ease;
}
.cal-next-week-drop.show{
  opacity:1;
  pointer-events:auto;
}
.cal-next-week-drop.active{
  border-color:#4e966b;
  background:#eef8f2;
  color:#2f6f4d;
}
.cal-next-week-drop span{
  font-size:11px;
  font-weight:850;
  line-height:1.35;
}
.cal-next-week-drop b{
  font-size:24px;
}
.cal-next-week-drop small{
  font-size:9px;
  color:#919691;
}

/* Routine placement */
.cal-routine-placement-dialog{
  width:min(420px,100%);
}
.cal-routine-placement-dialog>label{
  margin-top:14px;
}
.cal-routine-placement-dialog select{
  width:160px;
}

@media(max-width:820px){
  body.cal-week-dragging .cal-week-workspace{
    grid-template-columns:minmax(0,1fr);
  }
  .cal-next-week-drop{
    display:none!important;
  }
}


/* ======================================================
   r31.6 — hide legacy Routine main mode
   ====================================================== */
#routineNav{display:none!important}

/* ======================================================
   r31.6 — Weekly previous / next week overlay drop zones
   Grid width never shrinks while dragging.
   ====================================================== */
.cal-week-workspace{
  display:block!important;
  position:relative!important;
}
body.cal-week-dragging .cal-week-workspace{
  display:block!important;
}
.cal-adjacent-week-drop{
  position:absolute;
  top:0;
  bottom:0;
  z-index:30;
  width:92px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:8px;
  opacity:0;
  pointer-events:none;
  border:2px dashed #cbd2cc;
  background:rgba(250,251,250,.94);
  color:#69716a;
  text-align:center;
  transition:opacity .13s ease,background .13s ease,border-color .13s ease;
}
.cal-adjacent-week-drop.previous{
  left:0;
  border-radius:0 10px 10px 0;
}
.cal-adjacent-week-drop.next{
  right:0;
  border-radius:10px 0 0 10px;
}
body.cal-week-dragging .cal-adjacent-week-drop{
  opacity:.78;
  pointer-events:auto;
}
.cal-adjacent-week-drop.active{
  opacity:1!important;
  border-color:#4f966b;
  background:#edf8f1;
  color:#2f6e4c;
}
.cal-adjacent-week-drop b{font-size:23px}
.cal-adjacent-week-drop span{
  font-size:10px;
  line-height:1.35;
  font-weight:850;
}
.cal-adjacent-week-drop small{
  font-size:8px;
  color:#8e948f;
}

/* old r31.5 side panel no longer used */
.cal-next-week-drop{display:none!important}

/* ======================================================
   r31.6 — Daily drag & resize
   ====================================================== */
.cal-time-block.editable{
  cursor:grab;
}
.cal-time-block.editable:active{
  cursor:grabbing;
}
.cal-slot.cal-day-drop-hover>i{
  background:#eaf5ee;
  box-shadow:inset 0 0 0 2px #62a17a;
}
.cal-resize-handle{
  position:absolute;
  left:10px;
  right:10px;
  z-index:12;
  height:8px;
  cursor:ns-resize;
  opacity:0;
  transition:opacity .1s ease;
}

  content:'';
  position:absolute;
  left:50%;
  width:34px;
  height:3px;
  transform:translateX(-50%);
  border-radius:999px;
  background:#6a9a7c;
}
.cal-resize-top::after{top:2px}
.cal-resize-bottom::after{bottom:2px}

  opacity:.72;
}
.cal-time-block.resize-invalid{
  border-color:#d45b5b!important;
  border-left-color:#d45b5b!important;
  background:#fff0f0!important;
}

    let ld=memoDeletedAt(l),rd=memoDeletedAt(r);
    if(ld||rd){
      if(ld&&rd)x.set(r.id,Date.parse(rd)>=Date.parse(ld)?r:l);

      return

    if(Date.parse(r.updatedAt)>Date.parse(l.updatedAt))x.set(r.id,r);
    else{
      let q=new Map((l.tasks||[]).map(t=>[t.id,t]));

        if(!o||Date.parse(t.updatedAt)>Date.parse(o.updatedAt))q.set(t.id,t)

      l.tasks=[...q.values()]
    }
  });
  return[...x.values()].sort((a,b)=>Date.parse(b.createdAt)-Date.parse(a.createdAt))
};

  let[b,t]=await Promise.all([
    sb.from('blocks').select('id,parent_id,type,content_md,created_at,updated_at,deleted_at,sort_order,revision').eq('user_id',user.id),
    sb.from('block_tasks').select('id,block_id,content_md,task_state,created_at,updated_at,completed_at,deleted_at').eq('user_id',user.id)
  ]);
  if(b.error)throw b.error;if(t.error)throw t.error;
  let comments=new Map(b.data.filter(x=>x.parent_id).map(x=>[x.parent_id,x]));
  return b.data.filter(x=>!x.parent_id).map(x=>{
    let deleted=!!x.deleted_at&&isTrashPayload(x.content_md),
        archive=!!x.deleted_at&&!deleted,
        content=deleted?decodeTrashPayload(x.content_md):x.content_md,
        code=x.sort_order<0?-x.sort_order-1:0,
        c=comments.get(x.id),
        rowTasks=t.data.filter(y=>y.block_id===x.id).map(y=>{
          let deletedWithParent=deleted&&y.deleted_at&&x.deleted_at&&Date.parse(y.deleted_at)===Date.parse(x.deleted_at);
          return{
            id:y.id,text:y.content_md,done:y.task_state==='done',
            createdAt:y.created_at,updatedAt:y.updated_at,completedAt:y.completed_at,
            deletedAt:deletedWithParent?null:y.deleted_at
          }
        });
    return normalizeTrashMemo({
      id:x.id,content,tasks:rowTasks,
      status:deleted?'deleted':(archive?'archive':'live'),
      deletedAt:deleted?x.deleted_at:null,
      trashContent:deleted?content:undefined,
      syncRevision:Math.max(1,Number(x.revision)||1),
      important:Boolean(code&2),work:Boolean(code&1),
      review:c?.content_md,reviewId:c?.id,reviewUpdatedAt:c?.updated_at,
      createdAt:x.created_at,updatedAt:x.updated_at
    })
  })
};

/* Push: parent row만 tombstone으로 표시합니다.
   task/comment의 원래 삭제 상태를 덮어쓰지 않아 Trash 복구 때 기존 상태가 그대로 돌아옵니다. */
push=async()=>{
  let roots=memos.map((m,i)=>{
    normalizeTrashMemo(m);
    let deleted=m.status==='deleted',deletedAt=memoDeletedAt(m);
    return{
      id:m.id,user_id:user.id,parent_id:null,type:'note',
      content_md:deleted?encodeTrashPayload(m):m.content,
      created_at:m.createdAt,
      updated_at:deleted?(deletedAt||m.updatedAt):m.updatedAt,
      sort_order:-(i*4+(m.important?2:0)+(m.work?1:0)+1),
      revision:Math.max(1,Number(m.syncRevision)||1),
      deleted_at:deleted?(deletedAt||m.updatedAt):(m.status==='archive'?m.updatedAt:null)
    }
  });
  let reviews=memos
    .filter(m=>m.review!==undefined&&!isWorkspaceReservedChildPayload(m.review))
    .filter(m=>m.reviewId!==m.dueId)
    .filter(m=>!(m.calendarEntries||[]).some(entry=>entry?.id===m.reviewId))
    .filter(m=>!(m.completionHistory||[]).some(entry=>entry?.id===m.reviewId))
    .map(m=>({
      id:m.reviewId||(m.reviewId=id()),user_id:user.id,parent_id:m.id,type:'comment',
      content_md:m.review||'',created_at:m.createdAt,
      updated_at:m.reviewUpdatedAt||m.updatedAt,sort_order:0,
      revision:Math.max(1,Number(m.syncRevision)||1),
      deleted_at:m.status==='archive'?m.updatedAt:null
    }));
  let ts=memos.flatMap(m=>(m.tasks||[]).map((x,i)=>({
    id:x.id,block_id:m.id,user_id:user.id,content_md:x.text,
    task_state:x.done?'done':'open',focused:false,archived:false,
    created_at:x.createdAt,updated_at:x.updatedAt,completed_at:x.completedAt,
    sort_order:i,revision:1,deleted_at:x.deletedAt||null
  })));
  let blocks=[...roots,...reviews];
  if(blocks.length){let{error}=await sb.from('blocks').upsert(blocks,{onConflict:'id'});if(error)throw error}
  if(ts.length){let{error}=await sb.from('block_tasks').upsert(ts,{onConflict:'id'});if(error)throw error}
};

/* 혹시 과거 버전 marker가 archive로 로컬에 남아 있으면 즉시 Trash로 이동 */
memos.forEach(m=>{

/* Rev. r20_260827
   1) 메모 본문의 http(s), www, 일반 도메인(cad.ednc.com 포함)을 링크로 렌더링
   2) 메모별 마감일/시간 + 알림 설정
   3) 마감 메타데이터는 기존 blocks 테이블의 child comment에 예약 prefix로 저장
      (DB 스키마 변경 없음 / index.html 단일 파일 유지)
*/
const DUE_META_PREFIX='[[review-todo:due:v1]]';
const WORKSPACE_RESERVED_CHILD_PREFIXES=[
  DUE_META_PREFIX,
  '[[review-todo:calendar-entry:v1]]',
  '[[review-todo:completion:v1]]',
  '[[review-todo:daily-meta:v1]]',
  '[[ROUTINE_LOG_V1]]',
  '[[ROUTINE_LOG_V2]]'
];
const isWorkspaceReservedChildPayload=value=>
  typeof value==='string'&&
  WORKSPACE_RESERVED_CHILD_PREFIXES.some(prefix=>value.startsWith(prefix));
const DUE_NOTIFIED_KEY='review_todo_due_notified_v1';
const dueNotified=JSON.parse(localStorage.getItem(DUE_NOTIFIED_KEY)||'{}');
const isDueMeta=v=>typeof v==='string'&&v.startsWith(DUE_META_PREFIX);
const encodeDueMeta=m=>DUE_META_PREFIX+JSON.stringify({
  dueDate:m.dueDate||'',
  dueTime:m.dueTime||'',
  notify:!!m.dueNotify
});
const decodeDueMeta=v=>{
  try{
    if(!isDueMeta(v))return null;
    let o=JSON.parse(v.slice(DUE_META_PREFIX.length)||'{}');
    return{
      dueDate:typeof o.dueDate==='string'?o.dueDate:'',
      dueTime:typeof o.dueTime==='string'?o.dueTime:'',
      dueNotify:!!o.notify
    }
  }catch{return{dueDate:'',dueTime:'',dueNotify:false}}
};
const dueTimestamp=m=>{
  if(!m?.dueDate)return null;
  let time=m.dueTime||'23:59';
  let d=new Date(`${m.dueDate}T${time}:00`);
  return Number.isNaN(d.valueOf())?null:d;
};
const dueLabel=m=>{
  if(!m?.dueDate)return'';
  let [y,mo,da]=m.dueDate.split('-'),time=m.dueTime||'23:59';
  return `${y}. ${mo}. ${da}  ${time}까지`
};
const memoTasksCompleted=m=>{
  let active=tasks(m);
  return active.length>0&&active.every(t=>t.done)
};
const dueDayOffset=m=>{
  if(!m?.dueDate)return null;
  let [y,mo,da]=m.dueDate.split('-').map(Number);
  let dueDay=new Date(y,mo-1,da),nowDay=new Date(),today=new Date(nowDay.getFullYear(),nowDay.getMonth(),nowDay.getDate());
  if(Number.isNaN(dueDay.valueOf()))return null;
  return Math.round((dueDay.getTime()-today.getTime())/86400000)
};
const dueCountdown=m=>{
  if(memoTasksCompleted(m))return{text:'',cls:'completed'};
  let delta=dueDayOffset(m);if(delta===null)return{text:'',cls:''};
  if(delta===0)return{text:'D-0',cls:'due-zero'};
  if(delta>0)return{text:`D-${delta}`,cls:'due-future'};
  let late=Math.abs(delta);
  if(late<=30)return{text:`D+${late}`,cls:'due-late'};
  return{text:'일정 초과',cls:'due-exceeded'}
};
const dueState=m=>{
  if(memoTasksCompleted(m))return'completed';
  let delta=dueDayOffset(m);
  if(delta===null)return'';
  if(delta<0)return'overdue';
  if(delta===0)return'today';
  return'future'
};
const dueBadgeHtml=m=>{
  let label=esc(dueLabel(m)),count=dueCountdown(m);
  if(!count.text)return label+(m.dueNotify?', 알림':'');
  let prefix=m.dueNotify?', 알림 ':', ';
  return `${label}${prefix}<span class="${count.cls}">${esc(count.text)}</span>`
};

/* 태그와 URL을 동시에 안전하게 렌더링합니다.
   일반 도메인은 https:// 를 붙여 새 창으로 엽니다. */
const LINK_TOKEN_RE=/(https?:\/\/[^\s<]+|www\.[^\s<]+|(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}(?:\/[^\s<]*)?|#([가-힣\w-]+))/gi;
const trimUrlPunctuation=value=>{
  let tail='',url=value;
  while(url&&/[.,!?;:)\]}]$/.test(url)){tail=url.slice(-1)+tail;url=url.slice(0,-1)}
  return{url,tail}
};
mark=s=>{
  let out='',last=0,text=String(s??'');
  text.replace(LINK_TOKEN_RE,(match,_whole,tagName,offset)=>{
    out+=esc(text.slice(last,offset));
    if(match.startsWith('#')){
      let name=tagName||match.slice(1);
      out+=`<span class="hashtag" data-tag="${esc(name)}" contenteditable="false">#${esc(name)}</span>`
    }else{
      let{url,tail}=trimUrlPunctuation(match);
      let href=/^https?:\/\//i.test(url)?url:'https://'+url;
      out+=`<a class="memo-link" href="${esc(href)}" target="_blank" rel="noopener noreferrer" contenteditable="false">${esc(url)}</a>${esc(tail)}`
    }
    last=offset+match.length;
    return match
  });
  out+=esc(text.slice(last));
  return out
};

      left.insertAdjacentHTML('beforeend',`<button class="due-badge ${state}" title="마감기한 변경">${dueBadgeHtml(m)}</button>`)
    }
  })
};

/* 기존 blocks 스키마를 그대로 사용:
   due metadata도 child comment로 저장하되 예약 prefix로 review와 구분합니다. */
pull=async()=>{
  let[b,t]=await Promise.all([
    sb.from('blocks').select('id,parent_id,type,content_md,created_at,updated_at,deleted_at,sort_order,revision').eq('user_id',user.id),
    sb.from('block_tasks').select('id,block_id,content_md,task_state,created_at,updated_at,completed_at,deleted_at').eq('user_id',user.id)
  ]);
  if(b.error)throw b.error;if(t.error)throw t.error;
  let childRows=b.data.filter(x=>x.parent_id);
  let reviews=new Map();
  let dues=new Map();
  childRows.forEach(x=>{
    if(isDueMeta(x.content_md)){
      let old=dues.get(x.parent_id);
      if(!old||Date.parse(x.updated_at)>=Date.parse(old.updated_at))dues.set(x.parent_id,x);
      return
    }

    if(x.type!=='comment')return;
    if(isWorkspaceReservedChildPayload(x.content_md))return;

    let old=reviews.get(x.parent_id);
    if(!old||Date.parse(x.updated_at)>=Date.parse(old.updated_at))reviews.set(x.parent_id,x)
  });
  return b.data.filter(x=>!x.parent_id).map(x=>{
    let deleted=!!x.deleted_at&&isTrashPayload(x.content_md),
        archive=!!x.deleted_at&&!deleted,
        content=deleted?decodeTrashPayload(x.content_md):x.content_md,
        code=x.sort_order<0?-x.sort_order-1:0,
        c=reviews.get(x.id),
        drow=dues.get(x.id),
        dmeta=drow?decodeDueMeta(drow.content_md):null,
        rowTasks=t.data.filter(y=>y.block_id===x.id).map(y=>{
          let deletedWithParent=deleted&&y.deleted_at&&x.deleted_at&&Date.parse(y.deleted_at)===Date.parse(x.deleted_at);
          return{
            id:y.id,text:y.content_md,done:y.task_state==='done',
            createdAt:y.created_at,updatedAt:y.updated_at,completedAt:y.completed_at,
            deletedAt:deletedWithParent?null:y.deleted_at
          }
        });
    return normalizeTrashMemo({
      id:x.id,content,tasks:rowTasks,
      status:deleted?'deleted':(archive?'archive':'live'),
      deletedAt:deleted?x.deleted_at:null,
      trashContent:deleted?content:undefined,
      syncRevision:Math.max(1,Number(x.revision)||1),
      priorityOrder:Math.floor(code/4),
      important:Boolean(code&2),work:Boolean(code&1),
      review:c?.content_md,reviewId:c?.id,reviewUpdatedAt:c?.updated_at,
      dueDate:dmeta?.dueDate||'',
      dueTime:dmeta?.dueTime||'',
      dueNotify:!!dmeta?.dueNotify,
      dueId:drow?.id,
      dueUpdatedAt:drow?.updated_at,
      createdAt:x.created_at,updatedAt:x.updated_at
    })
  })
};

push=async()=>{
  let roots=memos.map((m,i)=>{
    normalizeTrashMemo(m);
    let deleted=m.status==='deleted',deletedAt=memoDeletedAt(m);
    return{
      id:m.id,user_id:user.id,parent_id:null,type:'note',
      content_md:deleted?encodeTrashPayload(m):m.content,
      created_at:m.createdAt,
      updated_at:deleted?(deletedAt||m.updatedAt):m.updatedAt,
      sort_order:-((Number.isFinite(Number(m.priorityOrder))?Math.max(0,Math.trunc(Number(m.priorityOrder))):i)*4+(m.important?2:0)+(m.work?1:0)+1),
      revision:Math.max(1,Number(m.syncRevision)||1),
      deleted_at:deleted?(deletedAt||m.updatedAt):(m.status==='archive'?m.updatedAt:null)
    }
  });
  let reviews=memos.filter(m=>m.review!==undefined).map(m=>({
    id:m.reviewId||(m.reviewId=id()),user_id:user.id,parent_id:m.id,type:'comment',
    content_md:m.review||'',created_at:m.createdAt,
    updated_at:m.reviewUpdatedAt||m.updatedAt,sort_order:0,
    revision:Math.max(1,Number(m.syncRevision)||1),
    deleted_at:m.status==='archive'?m.updatedAt:null
  }));
  let dues=memos.filter(m=>m.dueId||m.dueDate).map(m=>({
    id:m.dueId||(m.dueId=id()),user_id:user.id,parent_id:m.id,type:'comment',
    content_md:encodeDueMeta(m),created_at:m.createdAt,
    updated_at:m.dueUpdatedAt||m.updatedAt,sort_order:0,
    revision:Math.max(1,Number(m.syncRevision)||1),
    deleted_at:null
  }));
  let ts=memos.flatMap(m=>(m.tasks||[]).map((x,i)=>({
    id:x.id,block_id:m.id,user_id:user.id,content_md:x.text,
    task_state:x.done?'done':'open',focused:false,archived:false,
    created_at:x.createdAt,updated_at:x.updatedAt,completed_at:x.completedAt,
    sort_order:i,revision:1,deleted_at:x.deletedAt||null
  })));
  let blocks=[...roots,...reviews,...dues];
  if(blocks.length){let{error}=await sb.from('blocks').upsert(blocks,{onConflict:'id'});if(error)throw error}
  if(ts.length){let{error}=await sb.from('block_tasks').upsert(ts,{onConflict:'id'});if(error)throw error}
};

/* 알림: 단일 HTML 제한상 페이지가 실행 중일 때 검사합니다.
   앱을 다시 열었을 때도 즉시 검사하여 놓친 마감을 알립니다. */
const focusDueMemo=memoId=>{
  let m=memos.find(x=>x.id===memoId);
  if(!m||m.status==='deleted')return;
  view=m.status==='archive'?'archive':'live';
  deadlineOnly=false;
  selectedTags=[];
  query='';
  flagOnly=false;
  workMode=0;
  tasksOnly=false;
  $('#search').value='';
  render();
  setTimeout(()=>{
    let card=document.querySelector(`.card[data-id="${memoId}"]`);
    if(!card)return;
    card.scrollIntoView({behavior:'smooth',block:'center'});
    card.classList.add('notification-target');
    setTimeout(()=>card.classList.remove('notification-target'),2200)
  },80)
};
const checkDueNotifications=()=>{
  if(!('Notification'in window)||Notification.permission!=='granted')return;
  let changed=false;
  memos.filter(m=>m.status==='live'&&m.dueNotify&&m.dueDate&&!memoTasksCompleted(m)).forEach(m=>{
    let d=dueTimestamp(m);if(!d||d.getTime()>Date.now())return;
    let key=`${m.dueDate}|${m.dueTime||''}`;
    if(dueNotified[m.id]===key)return;
    let body=(m.content||'').trim().replace(/\s+/g,' ').slice(0,120)||'마감된 메모가 있습니다.';
    try{
      let notification=new Notification('Review & Todo · 마감 알림',{body,tag:'review-todo-due-'+m.id});
      notification.onclick=()=>{
        try{window.focus()}catch{}
        focusDueMemo(m.id);
        notification.close()
      };
      dueNotified[m.id]=key;changed=true
    }catch(e){console.warn(e)}
  });
  if(changed)localStorage.setItem(DUE_NOTIFIED_KEY,JSON.stringify(dueNotified))
};
setInterval(checkDueNotifications,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkDueNotifications()});
window.addEventListener('focus',checkDueNotifications);

/* PC에서만 우측 조작부를 2줄로 재구성합니다.
   모바일에서는 기존 DOM 구조를 그대로 유지합니다. */
const layoutDesktopCardTools=()=>{
  const desktop=window.matchMedia('(min-width:621px)').matches;

  document.querySelectorAll('.card').forEach(card=>{
    const right=card.querySelector('.right');
    if(!right)return;

    let tools=right.querySelector(':scope > .card-tools');

    if(desktop){
      if(right.querySelector(':scope > .pc-meta-row'))return;

      /* right의 날짜 텍스트 노드를 찾아 별도 span으로 보존 */
      let dateText='';
      [...right.childNodes].forEach(node=>{
        if(node.nodeType===Node.TEXT_NODE&&node.textContent.trim()){
          dateText+=node.textContent.trim();
          node.remove();
        }
      });

      if(!tools)return;
      const flag=tools.querySelector('.important');
      const work=tools.querySelector('.work-chip');

      const meta=document.createElement('div');
      meta.className='pc-meta-row';

      if(flag)meta.appendChild(flag);
      if(work)meta.appendChild(work);

      const dateSpan=document.createElement('span');
      dateSpan.className='pc-date';
      dateSpan.textContent=dateText;
      meta.appendChild(dateSpan);

      right.insertBefore(meta,tools);
    }else{
      const meta=right.querySelector(':scope > .pc-meta-row');

/*

   - 기존 r30.x의 Routine V1 데이터는 삭제하지 않습니다.
   - 새 버전은 Routine V2 저장소/서버 prefix로 새로 시작합니다.
   - V1 payload는 새 Routine으로 불러오지 않지만 Memo로 오인되지 않게 계속 필터링합니다.
   - 따라서 r30.4로 되돌릴 경우 기존 V1 데이터는 그대로 남아 있습니다.
*/
const LEGACY_ROUTINE_DATA='review_todo_routines_v1';

const localDateKey=(d=new Date())=>{
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');

};

const parseLocalDate=s=>{
  const [y,m,d]=(s||'').split('-').map(Number);
  return new Date(y,m-1,d)
};
const shiftDate=(s,days)=>{
  const d=parseLocalDate(s);d.setDate(d.getDate()+days);return localDateKey(d)
};
const routineDayLabel=s=>{
  const d=parseLocalDate(s),w=['일','월','화','수','목','금','토'];

};

const isRoutinePayload=s=>typeof s==='string'&&s.startsWith(ROUTINE_PREFIX);

const activeRoutines=()=>routineStore.routines.filter(r=>!r.deletedAt);

const routineForDate=(r,dateKey)=>{
  if(r.deletedAt)return false;
  const d=parseLocalDate(dateKey);
  if(new Date(r.createdAt).getTime()>d.getTime()+86400000-1)return false;
  return (r.weekdays||[]).includes(d.getDay())
};

const routinesForDate=dateKey=>activeRoutines()
  .filter(r=>routineForDate(r,dateKey))
  .sort((a,b)=>Date.parse(a.createdAt)-Date.parse(b.createdAt));

const routineLog=(routineId,dateKey)=>routineStore.logs.find(l=>l.routineId===routineId&&l.date===dateKey);

const routineLogCompleted=(routine,log)=>{
  if(!log)return false;
  if(log.done)return true;
  if(log.revokedAt&&log.completedAt)return false;
  if((routine.mode||'check')==='check')return false;
  return log.value!==null&&log.value!==undefined
};


const ensureRoutineLog=(routineId,dateKey)=>{
  let l=routineLog(routineId,dateKey);
  if(l)return l;
  const stamp=now();
  l={
    id:id(),routineId,date:dateKey,
    done:false,value:null,note:'',
    planResult:'',gapCause:'',improvement:'',
    completedAt:null,revokedAt:null,
    createdAt:stamp,updatedAt:stamp
  };
  routineStore.logs.push(l);
  return l
};

const routinePeriodStats=days=>{
  const end=parseLocalDate(localDateKey()),start=new Date(end);start.setDate(end.getDate()-days+1);
  let totalScheduled=0,totalDone=0,completedDays=0,bestStreak=0,currentStreak=0;
  const dayRows=[];
  for(let i=0;i<days;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    const key=localDateKey(d);
    const rs=routinesForDate(key);
    let done=0;
    rs.forEach(r=>{if(routineLogCompleted(r,routineLog(r.id,key)))done++});
    totalScheduled+=rs.length;
    totalDone+=done;
    const full=rs.length>0&&done===rs.length;
    if(full){completedDays++;currentStreak++;bestStreak=Math.max(bestStreak,currentStreak)}else currentStreak=0;
    dayRows.push({key,total:rs.length,done,ratio:rs.length?done/rs.length:0});
  }
  return{
    totalScheduled,totalDone,completedDays,bestStreak,dayRows,
    rate:totalScheduled?Math.round(totalDone/totalScheduled*100):0
  }
};

const routineSelectedProgress=()=>{
  const rs=routinesForDate(routineDate);
  const done=rs.filter(r=>routineLogCompleted(r,routineLog(r.id,routineDate))).length;
  return{total:rs.length,done,rate:rs.length?Math.round(done/rs.length*100):0}
};

const routineMinuteToTime=m=>{
  if(!Number.isFinite(Number(m)))return'';
  m=Math.max(0,Math.min(1410,Number(m)));
  const h=Math.floor(m/60),min=m%60;
  return `${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')}`
};
const routineTimeToMinute=value=>{
  const match=String(value||'').match(/^(\d{1,2}):(\d{2})$/);
  if(!match)return null;
  const h=Number(match[1]),m=Number(match[2]);
  if(h<0||h>23||![0,30].includes(m))return null;
  return h*60+m
};

/* ---------- Supabase Routine Sync ---------- */
/* Rev. r20_260827
   DB schema는 변경하지 않습니다.
   - 메모/루틴 root: blocks.type='note'
   - 후기/루틴 일별 기록: blocks.type='comment'
   - 할 일: 기존 block_tasks 테이블 그대로
   실제 데이터 종류는 content_md prefix로 구분합니다.
*/
const mergeRoutines=(local,remote)=>{
  const map=new Map(local.map(x=>[x.id,x]));
  remote.forEach(r=>{
    const l=map.get(r.id);
    if(!l){map.set(r.id,r);return}
    if(l.deletedAt||r.deletedAt){
      if(r.deletedAt&&!l.deletedAt){map.set(r.id,r);return}
      if(l.deletedAt&&!r.deletedAt)return;
    }
    if(Date.parse(r.updatedAt||r.createdAt)>Date.parse(l.updatedAt||l.createdAt))map.set(r.id,r)
  });
  return [...map.values()]
};
const mergeRoutineLogs=(local,remote)=>{
  const map=new Map(local.map(x=>[x.id,x]));
  remote.forEach(r=>{
    const l=map.get(r.id);
    if(!l||Date.parse(r.updatedAt||r.createdAt)>Date.parse(l.updatedAt||l.createdAt))map.set(r.id,r)
  });
  return [...map.values()]
};

const pullRoutines=async()=>{
  const {data,error}=await sb.from('blocks')
    .select('id,parent_id,type,content_md,created_at,updated_at,deleted_at')
    .eq('user_id',user.id)
    .in('type',['note','comment']);
  if(error)throw error;

  const remoteRoutines=[],remoteLogs=[];
  (data||[]).forEach(row=>{
    if(row.type==='note'&&isRoutinePayload(row.content_md)){
      const d=decodeRoutine(row.content_md);if(!d)return;
      remoteRoutines.push({
        id:row.id,
        title:d.title||'',
        goal:d.goal||'',
        weekdays:Array.isArray(d.weekdays)?d.weekdays:[],
        mode:d.mode||'check',
        defaultStartMinute:Number.isFinite(Number(d.defaultStartMinute))?Number(d.defaultStartMinute):null,
        defaultDurationMinutes:Math.max(30,Number(d.defaultDurationMinutes)||30),
        createdAt:row.created_at||d.createdAt||now(),
        updatedAt:row.updated_at||d.updatedAt||row.created_at||now(),
        deletedAt:row.deleted_at||null
      })
    }else if(row.type==='comment'&&isRoutineLogPayload(row.content_md)){
      const d=decodeRoutineLog(row.content_md);if(!d||!row.parent_id)return;
      remoteLogs.push({
        id:row.id,routineId:row.parent_id,date:d.date,
        done:!!d.done,value:d.value??null,note:d.note||'',
        planResult:d.planResult||'',
        gapCause:d.gapCause||'',
        improvement:d.improvement||'',
        completedAt:d.completedAt||null,
        revokedAt:d.revokedAt||null,
        createdAt:row.created_at||d.createdAt||now(),
        updatedAt:row.updated_at||d.updatedAt||row.created_at||now()
      })
    }
  });
  routineStore.routines=mergeRoutines(routineStore.routines,remoteRoutines);
  routineStore.logs=mergeRoutineLogs(routineStore.logs,remoteLogs);
};

const pushRoutines=async()=>{
  const rows=[];
  routineStore.routines.forEach(r=>rows.push({
    id:r.id,user_id:user.id,parent_id:null,type:'note',
    content_md:encodeRoutine(r),created_at:r.createdAt,updated_at:r.updatedAt,
    sort_order:0,revision:1,deleted_at:r.deletedAt||null
  }));
  routineStore.logs.forEach(l=>rows.push({
    id:l.id,user_id:user.id,parent_id:l.routineId,type:'comment',
    content_md:encodeRoutineLog(l),created_at:l.createdAt,updated_at:l.updatedAt,
    sort_order:0,revision:1,deleted_at:null
  }));
  if(rows.length){
    const {error}=await sb.from('blocks').upsert(rows,{onConflict:'id'});
    if(error){
      console.error('routine blocks upsert failed',error);
      throw error
    }
  }
};

const syncRoutines=async()=>{
  if(!sb||!user||!navigator.onLine)return;
  await pullRoutines();
  await pushRoutines();
  saveRoutineLocal(false);
  if(appMode==='routine')renderRoutinePage()
};

/* 기존 memo pull이 routine root를 메모로 오인하지 않도록 최종 필터 */
const r16MemoPullBase=pull;
pull=async()=>{
  const rows=await r16MemoPullBase();
  return rows.filter(m=>!isAnyRoutinePayload(m.content)&&!isDailyMetaPayload(m.content))
};

/* 혹시 이전 실행에서 루틴 row가 메모처럼 로컬에 섞였다면 제거 */
memos=memos.filter(m=>!isAnyRoutinePayload(m.content)&&!isDailyMetaPayload(m.content));
localStorage.setItem(DATA,JSON.stringify(memos));

/* 기존 5분/수동 sync 흐름에 루틴 동기화를 함께 연결 */
const r16SyncBase=syncNow;
let lastRoutineSync=0;
syncNow=async force=>{
  const result=await r16SyncBase(force);
  if(!sb||!user||!navigator.onLine)return result;
  if(!force&&Date.now()-lastRoutineSync<300000)return result;
  try{
    await syncRoutines();
    lastRoutineSync=Date.now();
    status('동기화됨');
  }catch(e){
    console.error(e);
    status(`동기화 실패 · ${e?.code||e?.message||'루틴 저장 오류'}`);
  }
  return result
};

/* =========================================================
   Rev. r20_260827
   - 서버 notice.txt 공지사항: 앱 시작 시 새 공지만 1회 자동 표시 + 좌측 메뉴 재열람
   - Todo 보기 4단계: 모두 / Todo 포함 블럭 / Todo만 / 메모-only
   - 태그 입력 즉시 인식(공백·줄바꿈·편집 종료)
   - 태그 우클릭 제외 필터(복수 OR 제외)
   ========================================================= */

/* ---------- Revision ---------- */
if($('#revision'))$('#revision').textContent='Rev. r33.0_261001_mobile_ui1';

/* ---------- Notice ---------- */
const NOTICE_SEEN_KEY='review_todo_notice_seen_v1';
let noticeContent='',noticeSignature='',noticeLoaded=false;

if($('#account')&&!$('#noticeOpen')){
  $('#account').insertAdjacentHTML('beforebegin','<button id="noticeOpen" class="plain notice-open">공지사항</button>');
}
if(!$('#noticeModal')){
  document.body.insertAdjacentHTML('beforeend',`
  <div id="noticeModal" class="modal hidden">
    <div class="dialog notice-dialog">
      <h2>공지사항</h2>
      <div id="noticeVersionLabel" class="notice-version-label"></div>
      <div id="noticeBody" class="notice-body"></div>
      <div class="notice-history-actions">
        <button id="noticePrev" class="button">이전</button>
        <button id="noticeNext" class="button">다음</button>
      </div>
      <div class="notice-actions">
        <button id="noticeConfirm" class="button primary">확인</button>
        <small>공지사항은 좌측 하단 메뉴에서 다시 확인하실 수 있습니다.</small>
      </div>
    </div>
  </div>`);
}

const noticeFallbackHash=s=>{
  let h=2166136261;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}
  return 'f'+(h>>>0).toString(16)
};
const noticeHash=async s=>{
  try{
    if(crypto?.subtle){
      const data=new TextEncoder().encode(s);
      const digest=await crypto.subtle.digest('SHA-256',data);
      return [...new Uint8Array(digest)].map(v=>v.toString(16).padStart(2,'0')).join('')
    }
  }catch{}
  return noticeFallbackHash(s)
};
/*
  공지 파일은 오래된 순서 → 최신 순서로 관리합니다.
  앞으로 새 버전 공지를 추가할 때에는 이 배열 끝에 새 파일명 하나만 추가하면 됩니다.
  실제 서버에 없는 과거 파일은 탐색할 때 자동으로 건너뜁니다.
*/
const NOTICE_ARCHIVE_FILES=[
  'notice_r27_260827.txt',
  'notice_r28_260827.txt',
  'notice_r29_260827.txt',
  'notice_r30.1_260831.txt',
  'notice_r30.2_260831.txt',
  'notice_r30.3_260831.txt',
  'notice_r30.4_260831.txt'
];
const NOTICE_LATEST_INDEX=NOTICE_ARCHIVE_FILES.length-1;
let noticeCurrentIndex=NOTICE_LATEST_INDEX;
let noticeCurrentFile=NOTICE_ARCHIVE_FILES[NOTICE_LATEST_INDEX];

const noticeVersionText=fileName=>
  fileName
    .replace(/^notice_/,'')
    .replace(/\.txt$/,'')
    .replace(/_(\d{6})$/,' · $1');

const noticeUpdateNavigation=()=>{
  const prev=$('#noticePrev');
  const next=$('#noticeNext');
  if(prev)prev.disabled=false;
  if(next)next.disabled=noticeCurrentIndex>=NOTICE_LATEST_INDEX;

  const label=$('#noticeVersionLabel');
  if(label)label.textContent=noticeVersionText(noticeCurrentFile)
};

const noticeShowCurrent=()=>{
  $('#noticeBody').textContent=noticeContent;
  noticeUpdateNavigation();
  $('#noticeModal').classList.remove('hidden')
};

const noticeFetchFile=async fileName=>{
  try{
    const url=new URL(fileName,window.location.href);
    const response=await fetch(url.toString(),{
      cache:'no-store',
      headers:{'Cache-Control':'no-cache'}
    });
    if(!response.ok)return null;

    const body=(await response.text()).replace(/^\uFEFF/,'').trim();
    return body||null
  }catch(e){
    console.warn('공지 파일 탐색 실패',fileName,e);
    return null
  }
};

const noticeMove=async direction=>{
  if(direction>0&&noticeCurrentIndex>=NOTICE_LATEST_INDEX)return;

  const start=noticeCurrentIndex+direction;

  for(
    let i=start;
    i>=0&&i<=NOTICE_LATEST_INDEX;
    i+=direction
  ){
    const fileName=NOTICE_ARCHIVE_FILES[i];
    const body=await noticeFetchFile(fileName);
    if(!body)continue;

    noticeCurrentIndex=i;
    noticeCurrentFile=fileName;
    noticeContent=body;
    noticeShowCurrent();
    return
  }

  alert('더 이상 공지사항이 없습니다.')
};

const openNotice=manual=>{
  if(!noticeLoaded){
    if(manual)alert('공지사항을 불러오는 중입니다.');
    return
  }
  if(!noticeContent){
    if(manual){
      alert(noticeLoadError
        ?'공지 파일을 불러오지 못했습니다.\n'+noticeLoadError+'\n\nindex.html과 notice_r30.4_260831.txt가 같은 폴더에 있는지 확인하세요.'
        :'현재 등록된 공지사항이 없습니다.')
    }
    return
  }

  /* 좌측 메뉴에서 다시 열 때는 항상 최신 공지부터 보여줍니다. */
  noticeCurrentIndex=NOTICE_LATEST_INDEX;
  noticeCurrentFile=NOTICE_ARCHIVE_FILES[NOTICE_LATEST_INDEX];
  noticeShowCurrent()
};

$('#noticeOpen')?.addEventListener('click',()=>openNotice(true));
$('#noticePrev')?.addEventListener('click',()=>noticeMove(-1));
$('#noticeNext')?.addEventListener('click',()=>noticeMove(1));
$('#noticeConfirm')?.addEventListener('click',()=>{
  $('#noticeModal').classList.add('hidden');
  /*
    과거 공지를 보고 닫더라도 '최신 공지를 확인했다'는 기록은
    시작 시 불러온 최신 noticeSignature를 기준으로 유지합니다.
  */
  if(noticeSignature)localStorage.setItem(NOTICE_SEEN_KEY,noticeSignature)
});
let noticeLoadError='';
const NOTICE_FILES=['notice_r30.4_260831.txt','notice.txt'];

const loadNoticeAtStartup=async()=>{
  noticeLoadError='';
  noticeContent='';
  noticeSignature='';
  noticeLoaded=false;

  for(const fileName of NOTICE_FILES){
    try{
      const url=new URL(fileName,window.location.href);
      const response=await fetch(url.toString(),{
        cache:'no-store',
        headers:{'Cache-Control':'no-cache'}
      });

      if(!response.ok){
        noticeLoadError=`${fileName}: HTTP ${response.status}`;
        continue
      }

      const body=(await response.text()).replace(/^\uFEFF/,'').trim();
      if(!body){
        noticeLoadError=`${fileName}: 파일이 비어 있습니다.`;
        continue
      }

      noticeContent=body;
      noticeLoaded=true;
      noticeLoadError='';
      noticeSignature=await noticeHash(body);
      noticeCurrentIndex=NOTICE_LATEST_INDEX;
      noticeCurrentFile=NOTICE_ARCHIVE_FILES[NOTICE_LATEST_INDEX];

      if(localStorage.getItem(NOTICE_SEEN_KEY)!==noticeSignature){
        openNotice(false)
      }
      return
    }catch(e){
      noticeLoadError=`${fileName}: ${e?.message||e}`;
      console.warn('공지 파일 로딩 실패',fileName,e)
    }
  }

  noticeLoaded=true;
  console.warn('사용 가능한 공지 파일을 찾지 못했습니다.',noticeLoadError)
};
loadNoticeAtStartup();

/* ---------- Todo 4-state view ---------- */
/*
  0 = 모두 보기            📝✅
  1 = Todo 포함 블럭       메모(회색)+✅
  2 = Todo 내용만          ✅
  3 = Todo 없는 메모       📝
*/
let taskViewMode=0;
tasksOnly=false;

const taskViewButton=()=>document.querySelector('[data-lite="tasks"]');

  const b=taskViewButton();if(!b)return;
  b.classList.toggle('filter-on',taskViewMode!==0);
  b.classList.toggle('task-mode-with-todo',taskViewMode===1);
  b.innerHTML=taskViewMode===0
    ?'<span class="task-mode-note">📝</span><span>✅</span>'
    :taskViewMode===1
      ?'<span class="task-mode-note muted">📝</span><span>✅</span>'
      :taskViewMode===2?'✅':'📝';
  b.title=[
    '모두 보기',
    '할 일이 있는 블럭만 보기 (메모 + 할 일)',
    '할 일이 있는 블럭에서 할 일만 보기',
    '할 일이 없는 메모만 보기'
  ][taskViewMode]
};

/* 기존 document capture의 boolean tasksOnly 핸들러보다 먼저 처리 */
window.addEventListener('click',e=>{
  const b=e.target.closest?.('[data-lite="tasks"]');if(!b)return;
  e.preventDefault();e.stopImmediatePropagation();
  tasksOnly=false;
  taskViewMode=(taskViewMode+1)%4;
  render()
},true);

/* ---------- Tag include / exclude ---------- */
let excludedTags=[];
const memoHasTag=(m,name)=>{
  const re=new RegExp('(^|\\s)#'+String(name).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?=\\s|$|[.,!?;:])','m');
  return re.test(m?.content||'')
};
const refreshTagFilterAppearance=()=>{
  document.querySelectorAll('#tags .tag[data-tag]').forEach(b=>{
    const name=b.dataset.tag||'';
    b.classList.toggle('tag-excluded',!!name&&excludedTags.includes(name));
    if(name){
      b.title=excludedTags.includes(name)
        ?'제외 중 · 우클릭하여 제외 해제'
        :'좌클릭: 포함 / 우클릭: 제외'
    }
  });
  const picker=$('#tagPicker');
  if(picker){
    const count=(selectedTags?.length||0)+(excludedTags.length||0);
    picker.textContent=count?`태그 ${count}`:'태그'
  }
};

/* PC 좌측 태그 좌클릭은 포함 상태로 전환하고 제외와 상호배타 처리 */
window.addEventListener('click',e=>{
  const b=e.target.closest?.('#tags .tag[data-tag]');if(!b)return;
  e.preventDefault();e.stopImmediatePropagation();
  const name=b.dataset.tag||'';
  if(!name){selectedTags=[];excludedTags=[]}
  else{
    excludedTags=excludedTags.filter(x=>x!==name);
    selectedTags=selectedTags.includes(name)
      ?selectedTags.filter(x=>x!==name)
      :[...selectedTags,name]
  }
  render()
},true);

window.addEventListener('contextmenu',e=>{
  const b=e.target.closest?.('#tags .tag[data-tag]');if(!b)return;
  e.preventDefault();e.stopImmediatePropagation();
  const name=b.dataset.tag||'';if(!name)return;
  selectedTags=selectedTags.filter(x=>x!==name);
  excludedTags=excludedTags.includes(name)
    ?excludedTags.filter(x=>x!==name)
    :[...excludedTags,name];
  render()
},true);

/* Mobile 태그 팝업에서도 우클릭/롱클릭 가능한 환경은 같은 제외 규칙 사용 */
$('#tagOptions')?.addEventListener('contextmenu',e=>{
  const b=e.target.closest?.('[data-popup-tag]');if(!b)return;
  e.preventDefault();e.stopPropagation();
  const name=b.dataset.popupTag;
  selectedTags=selectedTags.filter(x=>x!==name);
  excludedTags=excludedTags.includes(name)
    ?excludedTags.filter(x=>x!==name)
    :[...excludedTags,name];
  b.classList.toggle('excluded',excludedTags.includes(name))
});

/* ---------- Immediate hashtag recognition ---------- */
const selectionTextOffset=root=>{
  const sel=window.getSelection();if(!sel||!sel.rangeCount||!root.contains(sel.focusNode))return null;
  const range=document.createRange();
  range.selectNodeContents(root);
  range.setEnd(sel.focusNode,sel.focusOffset);
  return range.toString().length
};
const restoreTextOffset=(root,offset)=>{
  if(offset===null||!root)return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  let left=offset,node;
  while((node=walker.nextNode())){
    const n=node.nodeValue?.length||0;
    if(left<=n){
      const r=document.createRange(),s=window.getSelection();
      r.setStart(node,Math.max(0,left));r.collapse(true);
      s.removeAllRanges();s.addRange(r);root.focus();return
    }
    left-=n
  }
  focusEnd(root)
};
let tagCommitTimer=0;
const commitMemoTagRecognition=el=>{
  const card=el?.closest?.('.card');if(!card)return;
  const memoId=card.dataset.id,m=memos.find(x=>x.id===memoId);if(!m)return;
  const offset=selectionTextOffset(el);
  m.content=el.innerText;
  m.updatedAt=now();
  localStorage.setItem(DATA,JSON.stringify(memos));
  status('로컬에 저장됨');
  clearTimeout(tagCommitTimer);
  tagCommitTimer=setTimeout(()=>{
    render();
    const next=document.querySelector(`.card[data-id="${memoId}"] .memo`);
    restoreTextOffset(next,offset)
  },0)
};
document.addEventListener('input',e=>{
  if(!e.target.classList?.contains('memo'))return;
  if(e.data===' '||e.inputType==='insertParagraph'||e.inputType==='insertLineBreak'){
    commitMemoTagRecognition(e.target)
  }
},true);
/* 편집 종료는 기존 저장 흐름 뒤 최종 render가 태그를 즉시 강조하도록 보강 */
document.addEventListener('focusout',e=>{
  if(!e.target.classList?.contains('memo'))return;
  const card=e.target.closest('.card'),m=memos.find(x=>x.id===card?.dataset.id);if(!m)return;
  m.content=e.target.innerText;
  m.updatedAt=now();
  localStorage.setItem(DATA,JSON.stringify(memos));
  setTimeout(()=>render(),0)
},true);

/* ---------- Final view post-processing ---------- */
const r20RenderBase=render;
render=()=>{
  tasksOnly=false;
  r20RenderBase();

  const cards=[...document.querySelectorAll('#list .card')];
  cards.forEach(card=>{
    const m=memos.find(x=>x.id===card.dataset.id);if(!m)return;
    const activeTasks=tasks(m);
    const hasTasks=activeTasks.length>0;
    const excluded=excludedTags.some(name=>memoHasTag(m,name));

    let visible=!excluded;
    if(taskViewMode===1||taskViewMode===2)visible=visible&&hasTasks;
    else if(taskViewMode===3)visible=visible&&!hasTasks;

    card.classList.toggle('task-view-hidden',!visible);

    const memoEl=card.querySelector('.memo');
    const reviewEl=card.querySelector('.review-box');
    if(memoEl)memoEl.classList.toggle('task-body-hidden',taskViewMode===2);
    if(reviewEl)reviewEl.classList.toggle('task-body-hidden',taskViewMode===2);
  });

  /* 날짜 구분선도 실제 보이는 카드가 없는 구간이면 감춤 */
  const list=$('#list');
  if(list){
    const children=[...list.children];
    children.forEach((el,i)=>{
      if(!el.classList.contains('datehead'))return;
      let hasVisible=false;
      for(let j=i+1;j<children.length&&!children[j].classList.contains('datehead');j++){
        if(children[j].classList.contains('card')&&!children[j].classList.contains('task-view-hidden')){
          hasVisible=true;break
        }
      }
      el.classList.toggle('task-view-hidden',!hasVisible)
    });
    list.querySelector('.r20-filter-empty')?.remove();
    const visibleCards=cards.filter(c=>!c.classList.contains('task-view-hidden'));
    if(cards.length&&!visibleCards.length){
      list.insertAdjacentHTML('beforeend','<div class="empty r20-filter-empty">현재 보기 조건에 맞는 기록이 없습니다.</div>')
    }
  }

  updateTaskViewButton();
  refreshTagFilterAppearance();

  /* 모바일 태그 팝업의 제외 상태 표시 */
  document.querySelectorAll('#tagOptions [data-popup-tag]').forEach(b=>{
    b.classList.toggle('excluded',excludedTags.includes(b.dataset.popupTag))
  })
};

/* tag popup이 열린 직후에도 제외 상태를 다시 칠함 */
$('#tagPicker')?.addEventListener('click',()=>setTimeout(()=>{
  document.querySelectorAll('#tagOptions [data-popup-tag]').forEach(b=>{
    b.classList.toggle('excluded',excludedTags.includes(b.dataset.popupTag))
  })
},0));

/* =========================================================
   Rev. r30.4_260831 (r24 안정본 기반)
   - Todo 보기 버튼 폭 고정
   - 메모 편집 중 공백/줄바꿈 시 포커스 유지 + 태그 목록 즉시 갱신
   - Ctrl/Cmd+Enter 메모 추가 후 입력창 포커스 유지
   - @프로젝트: 목록/필터/추가/삭제/메모별 지정
   ========================================================= */

/* ---------- Revision ---------- */
if($('#revision'))$('#revision').textContent='Rev. r33.0_261001_mobile_ui1';

/* ---------- Projects ---------- */
const PROJECTS_KEY='review_todo_projects_v1';
let projectRegistry=(()=>{
  try{
    const v=JSON.parse(localStorage.getItem(PROJECTS_KEY)||'[]');
    return Array.isArray(v)?[...new Set(v.map(x=>String(x||'').trim()).filter(Boolean))]:[]
  }catch{return[]}
})();
let selectedProjects=[];
let projectManagerSelection=[];
let projectEditingMemoId=null;
let projectEditingSelection=[];

const projectTokenPattern=/@([^\s@#]+)/gu;
const projectNamesInText=s=>[...new Set([...(String(s||'').matchAll(projectTokenPattern))].map(m=>m[1]).filter(Boolean))];
const projectNamesInMemo=m=>projectNamesInText(m?.content||'');
/* 프로젝트 목록의 기준은 메모 본문에 실제 존재하는 @프로젝트입니다.
   관리창에서는 프로젝트를 추가/삭제하지 않고 선택/필터링만 합니다. */
const allProjectNames=()=>[...new Set(
  memos.filter(m=>m.status!=='deleted').flatMap(projectNamesInMemo)
)].sort((a,b)=>a.localeCompare(b,'ko'));
const saveProjectRegistry=()=>{
  projectRegistry=[...new Set(projectRegistry.map(x=>String(x||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));
  localStorage.setItem(PROJECTS_KEY,JSON.stringify(projectRegistry))
};
const stripProjectTokens=(content,names=null)=>{
  const target=names?new Set(names):null;
  let s=String(content||'').replace(/(^|[\s])@([^\s@#]+)/gu,(whole,prefix,name)=>{
    if(target&&!target.has(name))return whole;
    return prefix
  });
  return s.replace(/[ \t]{2,}/g,' ').replace(/[ \t]+\n/g,'\n').replace(/\n[ \t]+/g,'\n').trim()
};
const setMemoProjects=(m,names)=>{
  if(!m)return;
  const clean=stripProjectTokens(m.content);
  const suffix=[...new Set(names)].filter(Boolean).map(name=>'@'+name).join(' ');
  m.content=(clean+(clean&&suffix?' ':'')+suffix).trim();
  m.updatedAt=now()
};
const memoMatchesSelectedProjects=m=>{
  if(!selectedProjects.length)return true;
  const names=new Set(projectNamesInMemo(m));
  return selectedProjects.some(name=>names.has(name))
};

if(!$('#projectModal')){
  document.body.insertAdjacentHTML('beforeend',`

    <div class="dialog project-dialog">
      <button id="projectManagerClose" class="plain project-dialog-close" type="button" title="프로젝트 관리 닫기">닫기</button>

      <div id="projectManageList" class="project-list"></div>
      <div class="row">
        <button id="projectFilterClear" class="button">전체 프로젝트 보기</button>
        <button id="projectFilterApply" class="button primary">선택</button>
      </div>
    </div>
  </div>`);
}

      <div id="memoProjectList" class="project-list"></div>

      </div>

const drawProjectManager=()=>{
  const root=$('#projectManageList');if(!root)return;
  const names=allProjectNames();
  root.innerHTML=names.length?names.map(name=>`
    <button class="project-option ${projectManagerSelection.includes(name)?'selected':''}" data-project-filter="${esc(name)}">@${esc(name)}</button>
  `).join(''):'<div class="project-empty">메모에 입력된 @프로젝트가 없습니다.</div>'
};
const openProjectManager=()=>{
  projectManagerSelection=[...selectedProjects];
  drawProjectManager();
  $('#projectModal').classList.remove('hidden')
};
const drawMemoProjectPicker=()=>{
  const root=$('#memoProjectList');if(!root)return;
  const names=allProjectNames();
  root.innerHTML=names.length?names.map(name=>`
    <button class="project-option ${projectEditingSelection.includes(name)?'selected':''}" data-memo-project="${esc(name)}">@${esc(name)}</button>
  `).join(''):'<div class="project-empty">사용 가능한 프로젝트가 없습니다. 메모 본문에 @프로젝트명을 직접 입력하면 목록에 나타납니다.</div>'
};
const openMemoProjectPicker=memoId=>{
  const m=memos.find(x=>x.id===memoId);if(!m)return;
  projectEditingMemoId=memoId;
  projectEditingSelection=projectNamesInMemo(m);
  drawMemoProjectPicker();
  $('#memoProjectModal').classList.remove('hidden')
};

$('#projectManageList')?.addEventListener('click',e=>{
  const b=e.target.closest('[data-project-filter]');if(!b)return;
  const name=b.dataset.projectFilter;
  projectManagerSelection=projectManagerSelection.includes(name)
    ?projectManagerSelection.filter(x=>x!==name)
    :[...projectManagerSelection,name];
  drawProjectManager()
});
$('#projectFilterApply')?.addEventListener('click',()=>{
  selectedProjects=[...projectManagerSelection];
  $('#projectModal').classList.add('hidden');
  render()
});
$('#projectFilterClear')?.addEventListener('click',()=>{
  selectedProjects=[];
  projectManagerSelection=[];
  $('#projectModal').classList.add('hidden');
  render()
});
$('#memoProjectList')?.addEventListener('click',e=>{
  const b=e.target.closest('[data-memo-project]');if(!b)return;
  const name=b.dataset.memoProject;
  projectEditingSelection=projectEditingSelection.includes(name)
    ?projectEditingSelection.filter(x=>x!==name)
    :[...projectEditingSelection,name];
  drawMemoProjectPicker()
});
$('#memoProjectCancel')?.addEventListener('click',()=>{
  $('#memoProjectModal').classList.add('hidden');
  projectEditingMemoId=null;projectEditingSelection=[]
});
$('#memoProjectRemove')?.addEventListener('click',()=>{
  const m=memos.find(x=>x.id===projectEditingMemoId);
  if(m&&projectNamesInMemo(m).length){
    setMemoProjects(m,[]);
    localStorage.setItem(DATA,JSON.stringify(memos));
    status('프로젝트 제거 · 로컬에 저장됨');
    syncNow(true)
  }
  $('#memoProjectModal').classList.add('hidden');
  projectEditingMemoId=null;projectEditingSelection=[];
  render()
});
$('#memoProjectApply')?.addEventListener('click',()=>{
  const m=memos.find(x=>x.id===projectEditingMemoId);
  if(m){
    projectEditingSelection.forEach(name=>{
      if(!projectRegistry.includes(name))projectRegistry.push(name)
    });
    saveProjectRegistry();
    setMemoProjects(m,projectEditingSelection);
    localStorage.setItem(DATA,JSON.stringify(memos));
    status('프로젝트 지정 · 로컬에 저장됨');
    syncNow(true)
  }
  $('#memoProjectModal').classList.add('hidden');
  projectEditingMemoId=null;projectEditingSelection=[];
  render()
});

/* ---------- Tag sidebar without interrupting editing ---------- */
/* r32.0 fix5:
   가상 #Plan helper는 Workspace sidebar의 첫 render보다 먼저 초기화되어야 합니다.
   이전 fix3/fix4에서는 이 선언이 뒤에 있어 TDZ ReferenceError가 발생했고,
   그 결과 RTCore 생성까지 실행이 중단되어 Calendar 초기화가 실패했습니다. */
const R320_VIRTUAL_PLAN_TAG='Plan';

const r320MemoIsPlan=m=>
  Array.isArray(m?.calendarEntries)&&
  m.calendarEntries.some(entry=>entry&&entry.status!=='deleted');

const r320MemoHasWorkspaceTag=(m,name)=>
  name===R320_VIRTUAL_PLAN_TAG
    ?r320MemoIsPlan(m)
    :memoHasTag(m,name);

const drawTagSidebarR21=()=>{
  const root=$('#tags');if(!root)return;
  const source=memos.filter(m=>{
    if(m.status==='deleted')return false;
    return view==='archive'?m.status==='archive':m.status!=='archive'
  });
  const tagSet=new Set(
    source.flatMap(m=>(String(m.content||'').match(/#([가-힣\w-]+)/g)||[]).map(x=>x.slice(1)))
  );
  if(source.some(r320MemoIsPlan))tagSet.add(R320_VIRTUAL_PLAN_TAG);
  const tags=[...tagSet].sort((a,b)=>a.localeCompare(b,'ko'));
  const projectCount=selectedProjects.length;

  /*
    r30.4 fix4:
    @프로젝트는 태그 목록과 완전히 분리된 #projectPriorityRow에서만 관리합니다.
  */
  let controlRow=$('#projectPriorityRow');
  if(!controlRow){
    controlRow=document.createElement('div');
    controlRow.id='projectPriorityRow';
    controlRow.className='project-priority-row';
    root.parentNode.insertBefore(controlRow,root)
  }
  if(controlRow){
    /*
      r30.4 fix9:
      PC 전용 프로젝트/우선순위 행은 필요할 때만 동적으로 생성합니다.
      모바일 DOM에는 별도 상단 행을 두지 않습니다.
    */
    if(root.parentNode&&controlRow.nextElementSibling!==root){
      root.parentNode.insertBefore(controlRow,root)
    }

    let project=$('#projectPickerSide');
    if(!project){
      project=document.createElement('button');
      project.id='projectPickerSide';
      project.type='button';
      controlRow.appendChild(project)
    }else if(project.parentNode!==controlRow){
      controlRow.appendChild(project)
    }
    project.className=`button project-sidebar ${projectCount?'active-project':''}`;
    project.innerHTML=projectCount
      ?'<span>필터링 중</span>'
      :'<span>@프로젝트</span>';
  }

  root.querySelectorAll(':scope > .tag[data-tag]').forEach(el=>el.remove());

  const all=document.createElement('button');
  all.type='button';
  all.className=`tag ${selectedTags.length||excludedTags.length?'':'active'}`;
  all.dataset.tag='';
  all.textContent='전체 보기';
  root.appendChild(all);

  tags.forEach(name=>{
    const button=document.createElement('button');
    button.type='button';
    button.className=`tag ${selectedTags.includes(name)?'active':''} ${excludedTags.includes(name)?'tag-excluded':''}`;
    button.dataset.tag=name;
    button.textContent='#'+name;
    root.appendChild(button)
  });

  refreshTagFilterAppearance()
};

/* r20의 공백/줄바꿈 render를 차단하고, 모델과 좌측 태그 목록만 갱신합니다. */
window.addEventListener('input',e=>{
  const el=e.target;
  if(!el?.classList?.contains('memo'))return;
  const tagBoundary=e.data===' '||e.inputType==='insertParagraph'||e.inputType==='insertLineBreak';
  if(!tagBoundary)return;
  e.stopImmediatePropagation();
  const card=el.closest('.card'),m=memos.find(x=>x.id===card?.dataset.id);
  if(!m)return;
  m.content=el.innerText;
  m.updatedAt=now();
  localStorage.setItem(DATA,JSON.stringify(memos));
  status('로컬에 저장됨');
  drawTagSidebarR21()
},true);

/* Ctrl/Cmd+Enter로 새 메모를 저장한 뒤 입력창으로 즉시 복귀합니다. */
window.addEventListener('keydown',e=>{
  if(!(e.ctrlKey||e.metaKey)||e.key!=='Enter'||e.target!==$('#newMemo'))return;
  e.preventDefault();e.stopImmediatePropagation();
  createMemo();
  setTimeout(()=>{
    const input=$('#newMemo');
    input?.focus();
    if(input){
      input.style.height='auto';
      input.style.height=input.scrollHeight+'px'
    }
  },0)
},true);
