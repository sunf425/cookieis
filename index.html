const MEMO_TOMBSTONE='[[review-todo:tombstone:v1]]';

merge=(a,b)=>{
  let x=new Map(a.map(m=>[m.id,m]));
  b.forEach(r=>{
    let l=x.get(r.id);
    if(!l){x.set(r.id,r);return}
    let ld=memoDeletedAt(l),rd=memoDeletedAt(r);
    if(ld||rd){
      if(ld&&rd)x.set(r.id,Date.parse(rd)>=Date.parse(ld)?r:l);
      else x.set(r.id,rd?r:l);
      return
    }
    if(Date.parse(r.updatedAt)>Date.parse(l.updatedAt))x.set(r.id,r);
    else{
      let q=new Map((l.tasks||[]).map(t=>[t.id,t]));
      (r.tasks||[]).forEach(t=>{
        let o=q.get(t.id);
        if(!o||Date.parse(t.updatedAt)>Date.parse(o.updatedAt))q.set(t.id,t)
      });
      l.tasks=[...q.values()]
    }
  });
  return[...x.values()].sort((a,b)=>Date.parse(b.createdAt)-Date.parse(a.createdAt))
};

/* Rev. 20260820_r04
   - PC: 태그는 좌측 목록으로 표시
   - Mobile: 검색/태그 팝업, 조작 버튼 확대, 입력 버튼 한 줄, 메모별 Todo추가
   - Trash: 삭제 메모는 Live/Archive에서 완전히 숨기고 휴지통 팝업에서만 표시/복구
   - Sync: 삭제/복구 generation(revision)으로 stale device의 부활을 차단하고 명시적 복구는 허용
*/
const TRASH_PREFIX='[[TRASH_TOMBSTONE]]';
const OLD_TRASH_MARKER='[[review-todo:tombstone:v1]]';
const isTrashPayload=v=>typeof v==='string'&&(v===OLD_TRASH_MARKER||v===TRASH_PREFIX||v.startsWith(TRASH_PREFIX+'\n'));
const encodeTrashPayload=m=>TRASH_PREFIX+'\n'+(m.trashContent??m.content??'');
const decodeTrashPayload=v=>{
  if(typeof v!=='string')return '';
  if(v.startsWith(TRASH_PREFIX+'\n'))return v.slice((TRASH_PREFIX+'\n').length);
  return '';
};
const normalizeTrashMemo=m=>{
  if(!m)return m;
  if(isTrashPayload(m.content)){
    let recovered=decodeTrashPayload(m.content);
    m.status='deleted';
    m.deletedAt=m.deletedAt||m.updatedAt;
    m.trashContent=m.trashContent||recovered;
    m.content=m.trashContent||'';
    m.syncRevision=Math.max(1,Number(m.syncRevision)||1);
  }
  if(m.status==='deleted'){
    m.trashContent=m.trashContent??m.content??'';
    m.syncRevision=Math.max(1,Number(m.syncRevision)||1);
  }
  return m;
};
memos.forEach(normalizeTrashMemo);

/* revision-aware remove-wins:
   - 같은 generation이면 deleted가 우선
   - 명시적 복구는 generation을 올리므로 오래된 tombstone보다 우선
*/
merge=(a,b)=>{
  let x=new Map(a.map(m=>[m.id,normalizeTrashMemo({...m})]));
  b.forEach(raw=>{
    let r=normalizeTrashMemo({...raw}),l=x.get(r.id);
    if(!l){x.set(r.id,r);return}
    let lr=Number(l.syncRevision)||1,rr=Number(r.syncRevision)||1;
    if(lr!==rr){
      x.set(r.id,rr>lr?r:l);
      return;
    }
    let ld=l.status==='deleted',rd=r.status==='deleted';
    if(ld!==rd){
      x.set(r.id,rd?r:l);
      return;
    }
    if(ld&&rd){
      let winner=Date.parse(r.deletedAt||r.updatedAt)>=Date.parse(l.deletedAt||l.updatedAt)?r:l;
      let other=winner===r?l:r;
      if(!winner.trashContent&&other.trashContent)winner.trashContent=other.trashContent;
      if(!winner.content&&winner.trashContent)winner.content=winner.trashContent;
      x.set(r.id,winner);
      return;
    }
    if(Date.parse(r.updatedAt)>Date.parse(l.updatedAt))x.set(r.id,r);
    else{
      let q=new Map((l.tasks||[]).map(t=>[t.id,t]));
      (r.tasks||[]).forEach(t=>{
        let o=q.get(t.id);
        if(!o||Date.parse(t.updatedAt)>Date.parse(o.updatedAt))q.set(t.id,t)
      });
      l.tasks=[...q.values()]
    }
  });
  return[...x.values()].sort((a,b)=>Date.parse(b.createdAt)-Date.parse(a.createdAt))
};

  let reviews=memos.filter(m=>m.review!==undefined).map(m=>({
    id:m.reviewId||(m.reviewId=id()),user_id:user.id,parent_id:m.id,type:'comment',
    content_md:m.review||'',created_at:m.createdAt,
    updated_at:m.reviewUpdatedAt||m.updatedAt,sort_order:0,
    revision:Math.max(1,Number(m.syncRevision)||1),
    deleted_at:m.status==='archive'?m.updatedAt:null
  }));
  let ts=memos.flatMap(m=>(m.tasks||[]).map((x,i)=>({
    id:x.id,block_id:m.id,user_id:user.id,content_md:x.text,
    task_state:x.done?'done':'open',focused:false,archived:false,
    created_at:x.createdAt,updated_at:x.updatedAt,completed_at:x.completedAt,
    sort_order:i,revision:1,deleted_at:x.deletedAt||null
  })));
  let blocks=[...roots,...reviews];
  if(blocks.length){let{error}=await sb.from('blocks').upsert(blocks,{onConflict:'id'});if(error)throw error}
  if(ts.length){let{error}=await sb.from('block_tasks').upsert(ts,{onConflict:'id'});if(error)throw error}
};

/* 혹시 과거 버전 marker가 archive로 로컬에 남아 있으면 즉시 Trash로 이동 */
memos.forEach(m=>{
  if((m.status==='archive'||m.status==='live')&&isTrashPayload(m.content)){
    normalizeTrashMemo(m)
  }
});

/* Trash UI */
$('#revision').insertAdjacentHTML('beforebegin','<button id="trashOpen" class="plain trash-open">휴지통</button>');
document.body.insertAdjacentHTML('beforeend',`
<div id="trashModal" class="modal hidden">
  <div class="dialog trash-dialog">
    <button id="trashClose" class="plain" style="float:right;width:auto">닫기</button>
    <h2>휴지통</h2>
    <p>삭제된 메모는 동기화용 tombstone으로 유지되며 Live / Archive에는 표시되지 않습니다.</p>
    <div id="trashList" class="trash-list"></div>
  </div>
</div>`);
const trashPreview=m=>{
  let body=(m.trashContent??m.content??'').trim();
  if(body)return body;
  let active=(m.tasks||[]).filter(t=>!t.deletedAt).map(t=>t.text).filter(Boolean);
  return active.length?active.join(' · '):'이전 버전에서 삭제되어 원문이 남아 있지 않은 항목';
};
const drawTrash=()=>{
  let deleted=memos.filter(m=>m.status==='deleted').sort((a,b)=>Date.parse(b.deletedAt||b.updatedAt)-Date.parse(a.deletedAt||a.updatedAt));
  $('#trashList').innerHTML=deleted.length?deleted.map(m=>`
    <div class="trash-row" data-trash-id="${m.id}">
      <div class="trash-copy">
        <div class="trash-text">${esc(trashPreview(m))}</div>
        <div class="trash-date">${date(m.deletedAt||m.updatedAt)}</div>
      </div>
      <button class="trash-restore" title="복구">↶ 복구</button>
    </div>`).join(''):'<div class="empty">휴지통이 비어 있습니다.</div>';
};
$('#trashOpen').onclick=()=>{drawTrash();$('#trashModal').classList.remove('hidden')};
$('#trashClose').onclick=()=>$('#trashModal').classList.add('hidden');
$('#trashList').onclick=e=>{
  let b=e.target.closest('.trash-restore');if(!b)return;
  let m=memos.find(x=>x.id===b.closest('[data-trash-id]').dataset.trashId);if(!m)return;
  let stamp=now();
  m.content=m.trashContent??m.content??'';
  m.status='live';
  m.deletedAt=null;
  m.updatedAt=stamp;
  m.syncRevision=Math.max(1,Number(m.syncRevision)||1)+1;
  save();
  drawTrash();
  syncNow(true);
};

/* Mobile 검색 팝업 */
document.querySelector('.views').insertAdjacentHTML('afterend','<button id="mobileSearchOpen" class="button mobile-search-open">검색</button>');
document.body.insertAdjacentHTML('beforeend',`
<div id="searchModal" class="modal hidden">
  <div class="dialog search-dialog">
    <h2>검색</h2>
    <input id="mobileSearchInput" placeholder="검색어 띄어쓰기 입력…">
    <div class="row">
      <button id="mobileSearchClear" class="button">초기화</button>
      <button id="mobileSearchApply" class="button primary">검색</button>
    </div>
  </div>
</div>`);
$('#mobileSearchOpen').onclick=()=>{
  $('#mobileSearchInput').value=query;
  $('#searchModal').classList.remove('hidden');
  setTimeout(()=>$('#mobileSearchInput').focus(),0)
};
$('#mobileSearchApply').onclick=()=>{
  query=$('#mobileSearchInput').value;
  $('#search').value=query;
  $('#searchModal').classList.add('hidden');
  render()
};
$('#mobileSearchClear').onclick=()=>{
  query='';$('#search').value='';$('#mobileSearchInput').value='';
  $('#searchModal').classList.add('hidden');render()
};
$('#mobileSearchInput').onkeydown=e=>{
  if(e.key==='Enter'){e.preventDefault();$('#mobileSearchApply').click()}
};

/* 저장된 메모에 모바일 전용 Todo 추가 버튼 */
const r04RenderBase=render;
render=()=>{
  r04RenderBase();
  document.querySelectorAll('.card').forEach(card=>{
    let tools=card.querySelector('.card-tools');
    if(tools&&!tools.querySelector('.mobile-todo-add')){
      tools.insertAdjacentHTML('afterbegin','<button class="mobile-todo-add" title="할 일 추가">Todo추가</button>')
    }
  });
};
window.addEventListener('click',e=>{
  let b=e.target.closest?.('.mobile-todo-add');if(!b)return;
  e.preventDefault();e.stopImmediatePropagation();
  let card=b.closest('.card'),m=memos.find(x=>x.id===card.dataset.id);if(!m)return;
  let stamp=now(),next={id:id(),text:'',done:false,createdAt:stamp,updatedAt:stamp,completedAt:null,deletedAt:null};
  m.tasks.push(next);m.updatedAt=stamp;save();
  setTimeout(()=>document.querySelector(`[data-task="${next.id}"] .tasktext`)?.focus(),0)
},true);
