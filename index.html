/* 삭제 동기화 안전장치: 메모 삭제는 물리 DELETE하지 않고 tombstone으로 남깁니다.

   병합은 remove-wins: 어느 기기든 tombstone을 본 이후에는 오래된 live/archive 사본이 절대 부활하지 않습니다. */
const MEMO_TOMBSTONE='[[review-todo:tombstone:v1]]';
const isMemoTombstoneRow=x=>x?.deleted_at&&x?.content_md===MEMO_TOMBSTONE;
const memoDeletedAt=m=>m?.deletedAt||((m?.status==='deleted')?m.updatedAt:null);

merge=(a,b)=>{
  let x=new Map(a.map(m=>[m.id,m]));
  b.forEach(r=>{
    let l=x.get(r.id);
    if(!l){x.set(r.id,r);return}
    let ld=memoDeletedAt(l),rd=memoDeletedAt(r);
    if(ld||rd){
      if(ld&&rd)x.set(r.id,Date.parse(rd)>=Date.parse(ld)?r:l);
      else x.set(r.id,rd?r:l);
      return
    }
    if(Date.parse(r.updatedAt)>Date.parse(l.updatedAt))x.set(r.id,r);
    else{
      let q=new Map((l.tasks||[]).map(t=>[t.id,t]));
      (r.tasks||[]).forEach(t=>{
        let o=q.get(t.id);
        if(!o||Date.parse(t.updatedAt)>Date.parse(o.updatedAt))q.set(t.id,t)
      });
      l.tasks=[...q.values()]
    }
  });
  return[...x.values()].sort((a,b)=>Date.parse(b.createdAt)-Date.parse(a.createdAt))
};

/* Rev. r20_260827
   - PC: 태그는 좌측 목록으로 표시
   - Mobile: 검색/태그 팝업, 조작 버튼 확대, 입력 버튼 한 줄, 메모별 Todo추가
   - Trash: 삭제 메모는 Live/Archive에서 완전히 숨기고 휴지통 팝업에서만 표시/복구
   - Sync: 삭제/복구 generation(revision)으로 stale device의 부활을 차단하고 명시적 복구는 허용
*/
const TRASH_PREFIX='[[TRASH_TOMBSTONE]]';
const OLD_TRASH_MARKER='[[review-todo:tombstone:v1]]';
const isTrashPayload=v=>typeof v==='string'&&(v===OLD_TRASH_MARKER||v===TRASH_PREFIX||v.startsWith(TRASH_PREFIX+'\n'));
const encodeTrashPayload=m=>TRASH_PREFIX+'\n'+(m.trashContent??m.content??'');
const decodeTrashPayload=v=>{
  if(typeof v!=='string')return '';
  if(v.startsWith(TRASH_PREFIX+'\n'))return v.slice((TRASH_PREFIX+'\n').length);
  return '';
};
const normalizeTrashMemo=m=>{
  if(!m)return m;
  if(isTrashPayload(m.content)){
    let recovered=decodeTrashPayload(m.content);
    m.status='deleted';
    m.deletedAt=m.deletedAt||m.updatedAt;
    m.trashContent=m.trashContent||recovered;
    m.content=m.trashContent||'';
    m.syncRevision=Math.max(1,Number(m.syncRevision)||1);
  }
  if(m.status==='deleted'){
    m.trashContent=m.trashContent??m.content??'';
    m.syncRevision=Math.max(1,Number(m.syncRevision)||1);
  }
  return m;
};
memos.forEach(normalizeTrashMemo);

/* revision-aware remove-wins:
   - 같은 generation이면 deleted가 우선
   - 명시적 복구는 generation을 올리므로 오래된 tombstone보다 우선
*/
merge=(a,b)=>{
  let x=new Map(a.map(m=>[m.id,normalizeTrashMemo({...m})]));
  b.forEach(raw=>{
    let r=normalizeTrashMemo({...raw}),l=x.get(r.id);
    if(!l){x.set(r.id,r);return}
    let lr=Number(l.syncRevision)||1,rr=Number(r.syncRevision)||1;
    if(lr!==rr){
      x.set(r.id,rr>lr?r:l);
      return;
    }
    let ld=l.status==='deleted',rd=r.status==='deleted';
    if(ld!==rd){
      x.set(r.id,rd?r:l);
      return;
    }
    if(ld&&rd){
      let winner=Date.parse(r.deletedAt||r.updatedAt)>=Date.parse(l.deletedAt||l.updatedAt)?r:l;
      let other=winner===r?l:r;
      if(!winner.trashContent&&other.trashContent)winner.trashContent=other.trashContent;
      if(!winner.content&&winner.trashContent)winner.content=winner.trashContent;
      x.set(r.id,winner);
      return;
    }
    if(Date.parse(r.updatedAt)>Date.parse(l.updatedAt))x.set(r.id,r);
    else{
      let q=new Map((l.tasks||[]).map(t=>[t.id,t]));
      (r.tasks||[]).forEach(t=>{
        let o=q.get(t.id);
        if(!o||Date.parse(t.updatedAt)>Date.parse(o.updatedAt))q.set(t.id,t)
      });
      l.tasks=[...q.values()]
    }
  });
  return[...x.values()].sort((a,b)=>Date.parse(b.createdAt)-Date.parse(a.createdAt))
};

/* Pull: legacy/current trash marker를 모두 deleted로 해석하고,
   새 tombstone은 marker 아래에 원문을 보존합니다. */
pull=async()=>{
  let[b,t]=await Promise.all([
    sb.from('blocks').select('id,parent_id,type,content_md,created_at,updated_at,deleted_at,sort_order,revision').eq('user_id',user.id),
    sb.from('block_tasks').select('id,block_id,content_md,task_state,created_at,updated_at,completed_at,deleted_at').eq('user_id',user.id)
  ]);
  if(b.error)throw b.error;if(t.error)throw t.error;
  let comments=new Map(b.data.filter(x=>x.parent_id).map(x=>[x.parent_id,x]));
  return b.data.filter(x=>!x.parent_id).map(x=>{
    let deleted=!!x.deleted_at&&isTrashPayload(x.content_md),
        archive=!!x.deleted_at&&!deleted,
        content=deleted?decodeTrashPayload(x.content_md):x.content_md,
        code=x.sort_order<0?-x.sort_order-1:0,
        c=comments.get(x.id),
        rowTasks=t.data.filter(y=>y.block_id===x.id).map(y=>{
          let deletedWithParent=deleted&&y.deleted_at&&x.deleted_at&&Date.parse(y.deleted_at)===Date.parse(x.deleted_at);
          return{
            id:y.id,text:y.content_md,done:y.task_state==='done',
            createdAt:y.created_at,updatedAt:y.updated_at,completedAt:y.completed_at,
            deletedAt:deletedWithParent?null:y.deleted_at

        });
    return normalizeTrashMemo({
      id:x.id,content,tasks:rowTasks,
      status:deleted?'deleted':(archive?'archive':'live'),
      deletedAt:deleted?x.deleted_at:null,
      trashContent:deleted?content:undefined,
      syncRevision:Math.max(1,Number(x.revision)||1),
      important:Boolean(code&2),work:Boolean(code&1),
      review:c?.content_md,reviewId:c?.id,reviewUpdatedAt:c?.updated_at,
      createdAt:x.created_at,updatedAt:x.updated_at
    })
  })
};

/* Push: parent row만 tombstone으로 표시합니다.
   task/comment의 원래 삭제 상태를 덮어쓰지 않아 Trash 복구 때 기존 상태가 그대로 돌아옵니다. */
push=async()=>{
  let roots=memos.map((m,i)=>{
    normalizeTrashMemo(m);
    let deleted=m.status==='deleted',deletedAt=memoDeletedAt(m);
    return{
      id:m.id,user_id:user.id,parent_id:null,type:'note',
      content_md:deleted?encodeTrashPayload(m):m.content,
      created_at:m.createdAt,
      updated_at:deleted?(deletedAt||m.updatedAt):m.updatedAt,
      sort_order:-(i*4+(m.important?2:0)+(m.work?1:0)+1),
      revision:Math.max(1,Number(m.syncRevision)||1),
      deleted_at:deleted?(deletedAt||m.updatedAt):(m.status==='archive'?m.updatedAt:null)
    }
  });
  let reviews=memos.filter(m=>m.review!==undefined).map(m=>({
    id:m.reviewId||(m.reviewId=id()),user_id:user.id,parent_id:m.id,type:'comment',
    content_md:m.review||'',created_at:m.createdAt,
    updated_at:m.reviewUpdatedAt||m.updatedAt,sort_order:0,
    revision:Math.max(1,Number(m.syncRevision)||1),
    deleted_at:m.status==='archive'?m.updatedAt:null
  }));
  let ts=memos.flatMap(m=>(m.tasks||[]).map((x,i)=>({
    id:x.id,block_id:m.id,user_id:user.id,content_md:x.text,
    task_state:x.done?'done':'open',focused:false,archived:false,
    created_at:x.createdAt,updated_at:x.updatedAt,completed_at:x.completedAt,
    sort_order:i,revision:1,deleted_at:x.deletedAt||null
  })));
  let blocks=[...roots,...reviews];
  if(blocks.length){let{error}=await sb.from('blocks').upsert(blocks,{onConflict:'id'});if(error)throw error}
  if(ts.length){let{error}=await sb.from('block_tasks').upsert(ts,{onConflict:'id'});if(error)throw error}
};

/* Rev. r20_260827
   1) 메모 본문의 http(s), www, 일반 도메인(cad.ednc.com 포함)을 링크로 렌더링
   2) 메모별 마감일/시간 + 알림 설정
   3) 마감 메타데이터는 기존 blocks 테이블의 child comment에 예약 prefix로 저장
      (DB 스키마 변경 없음 / index.html 단일 파일 유지)
*/
const DUE_META_PREFIX='[[review-todo:due:v1]]';
const DUE_NOTIFIED_KEY='review_todo_due_notified_v1';
const dueNotified=JSON.parse(localStorage.getItem(DUE_NOTIFIED_KEY)||'{}');
const isDueMeta=v=>typeof v==='string'&&v.startsWith(DUE_META_PREFIX);
const encodeDueMeta=m=>DUE_META_PREFIX+JSON.stringify({
  dueDate:m.dueDate||'',
  dueTime:m.dueTime||'',
  notify:!!m.dueNotify
});
const decodeDueMeta=v=>{
  try{
    if(!isDueMeta(v))return null;
    let o=JSON.parse(v.slice(DUE_META_PREFIX.length)||'{}');
    return{
      dueDate:typeof o.dueDate==='string'?o.dueDate:'',
      dueTime:typeof o.dueTime==='string'?o.dueTime:'',
      dueNotify:!!o.notify
    }
  }catch{return{dueDate:'',dueTime:'',dueNotify:false}}
};
const dueTimestamp=m=>{
  if(!m?.dueDate)return null;
  let time=m.dueTime||'23:59';
  let d=new Date(`${m.dueDate}T${time}:00`);
  return Number.isNaN(d.valueOf())?null:d;
};
const dueLabel=m=>{
  if(!m?.dueDate)return'';
  let [y,mo,da]=m.dueDate.split('-'),time=m.dueTime||'23:59';
  return `${y}. ${mo}. ${da}  ${time}까지`
};
const memoTasksCompleted=m=>{
  let active=tasks(m);
  return active.length>0&&active.every(t=>t.done)
};
const dueDayOffset=m=>{
  if(!m?.dueDate)return null;
  let [y,mo,da]=m.dueDate.split('-').map(Number);
  let dueDay=new Date(y,mo-1,da),nowDay=new Date(),today=new Date(nowDay.getFullYear(),nowDay.getMonth(),nowDay.getDate());
  if(Number.isNaN(dueDay.valueOf()))return null;
  return Math.round((dueDay.getTime()-today.getTime())/86400000)
};
const dueCountdown=m=>{
  if(memoTasksCompleted(m))return{text:'',cls:'completed'};
  let delta=dueDayOffset(m);if(delta===null)return{text:'',cls:''};
  if(delta===0)return{text:'D-0',cls:'due-zero'};
  if(delta>0)return{text:`D-${delta}`,cls:'due-future'};
  let late=Math.abs(delta);
  if(late<=30)return{text:`D+${late}`,cls:'due-late'};
  return{text:'일정 초과',cls:'due-exceeded'}
};
const dueState=m=>{
  if(memoTasksCompleted(m))return'completed';
  let delta=dueDayOffset(m);
  if(delta===null)return'';
  if(delta<0)return'overdue';
  if(delta===0)return'today';
  return'future'
};
const dueBadgeHtml=m=>{
  let label=esc(dueLabel(m)),count=dueCountdown(m);
  if(!count.text)return label+(m.dueNotify?', 알림':'');
  let prefix=m.dueNotify?', 알림 ':', ';
  return `${label}${prefix}<span class="${count.cls}">${esc(count.text)}</span>`
};

/* 태그와 URL을 동시에 안전하게 렌더링합니다.
   일반 도메인은 https:// 를 붙여 새 창으로 엽니다. */
const LINK_TOKEN_RE=/(https?:\/\/[^\s<]+|www\.[^\s<]+|(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}(?:\/[^\s<]*)?|#([가-힣\w-]+))/gi;
const trimUrlPunctuation=value=>{
  let tail='',url=value;
  while(url&&/[.,!?;:)\]}]$/.test(url)){tail=url.slice(-1)+tail;url=url.slice(0,-1)}
  return{url,tail}
};
mark=s=>{
  let out='',last=0,text=String(s??'');
  text.replace(LINK_TOKEN_RE,(match,_whole,tagName,offset)=>{
    out+=esc(text.slice(last,offset));
    if(match.startsWith('#')){
      let name=tagName||match.slice(1);
      out+=`<span class="hashtag" data-tag="${esc(name)}" contenteditable="false">#${esc(name)}</span>`
    }else{
      let{url,tail}=trimUrlPunctuation(match);
      let href=/^https?:\/\//i.test(url)?url:'https://'+url;
      out+=`<a class="memo-link" href="${esc(href)}" target="_blank" rel="noopener noreferrer" contenteditable="false">${esc(url)}</a>${esc(tail)}`
    }
    last=offset+match.length;
    return match
  });
  out+=esc(text.slice(last));
  return out
};

/* 기존 blocks 스키마를 그대로 사용:
   due metadata도 child comment로 저장하되 예약 prefix로 review와 구분합니다. */
pull=async()=>{
  let[b,t]=await Promise.all([
    sb.from('blocks').select('id,parent_id,type,content_md,created_at,updated_at,deleted_at,sort_order,revision').eq('user_id',user.id),
    sb.from('block_tasks').select('id,block_id,content_md,task_state,created_at,updated_at,completed_at,deleted_at').eq('user_id',user.id)
  ]);
  if(b.error)throw b.error;if(t.error)throw t.error;
  let childRows=b.data.filter(x=>x.parent_id);
  let reviews=new Map();
  let dues=new Map();
  childRows.forEach(x=>{
    if(isDueMeta(x.content_md)){
      let old=dues.get(x.parent_id);
      if(!old||Date.parse(x.updated_at)>=Date.parse(old.updated_at))dues.set(x.parent_id,x)
    }else{
      let old=reviews.get(x.parent_id);
      if(!old||Date.parse(x.updated_at)>=Date.parse(old.updated_at))reviews.set(x.parent_id,x)
    }
  });
  return b.data.filter(x=>!x.parent_id).map(x=>{
    let deleted=!!x.deleted_at&&isTrashPayload(x.content_md),
        archive=!!x.deleted_at&&!deleted,
        content=deleted?decodeTrashPayload(x.content_md):x.content_md,
        code=x.sort_order<0?-x.sort_order-1:0,
        c=reviews.get(x.id),
        drow=dues.get(x.id),
        dmeta=drow?decodeDueMeta(drow.content_md):null,
        rowTasks=t.data.filter(y=>y.block_id===x.id).map(y=>{
          let deletedWithParent=deleted&&y.deleted_at&&x.deleted_at&&Date.parse(y.deleted_at)===Date.parse(x.deleted_at);
          return{
            id:y.id,text:y.content_md,done:y.task_state==='done',
            createdAt:y.created_at,updatedAt:y.updated_at,completedAt:y.completed_at,
            deletedAt:deletedWithParent?null:y.deleted_at
          }
        });
    return normalizeTrashMemo({
      id:x.id,content,tasks:rowTasks,
      status:deleted?'deleted':(archive?'archive':'live'),
      deletedAt:deleted?x.deleted_at:null,
      trashContent:deleted?content:undefined,
      syncRevision:Math.max(1,Number(x.revision)||1),
      important:Boolean(code&2),work:Boolean(code&1),
      review:c?.content_md,reviewId:c?.id,reviewUpdatedAt:c?.updated_at,
      dueDate:dmeta?.dueDate||'',
      dueTime:dmeta?.dueTime||'',
      dueNotify:!!dmeta?.dueNotify,
      dueId:drow?.id,
      dueUpdatedAt:drow?.updated_at,
      createdAt:x.created_at,updatedAt:x.updated_at
    })
  })
};

push=async()=>{
  let roots=memos.map((m,i)=>{
    normalizeTrashMemo(m);
    let deleted=m.status==='deleted',deletedAt=memoDeletedAt(m);
    return{
      id:m.id,user_id:user.id,parent_id:null,type:'note',
      content_md:deleted?encodeTrashPayload(m):m.content,
      created_at:m.createdAt,
      updated_at:deleted?(deletedAt||m.updatedAt):m.updatedAt,
      sort_order:-(i*4+(m.important?2:0)+(m.work?1:0)+1),
      revision:Math.max(1,Number(m.syncRevision)||1),
      deleted_at:deleted?(deletedAt||m.updatedAt):(m.status==='archive'?m.updatedAt:null)
    }
  });
  let reviews=memos.filter(m=>m.review!==undefined).map(m=>({
    id:m.reviewId||(m.reviewId=id()),user_id:user.id,parent_id:m.id,type:'comment',
    content_md:m.review||'',created_at:m.createdAt,
    updated_at:m.reviewUpdatedAt||m.updatedAt,sort_order:0,
    revision:Math.max(1,Number(m.syncRevision)||1),
    deleted_at:m.status==='archive'?m.updatedAt:null
  }));
  let dues=memos.filter(m=>m.dueId||m.dueDate).map(m=>({
    id:m.dueId||(m.dueId=id()),user_id:user.id,parent_id:m.id,type:'comment',
    content_md:encodeDueMeta(m),created_at:m.createdAt,
    updated_at:m.dueUpdatedAt||m.updatedAt,sort_order:0,
    revision:Math.max(1,Number(m.syncRevision)||1),
    deleted_at:null
  }));
  let ts=memos.flatMap(m=>(m.tasks||[]).map((x,i)=>({
    id:x.id,block_id:m.id,user_id:user.id,content_md:x.text,
    task_state:x.done?'done':'open',focused:false,archived:false,
    created_at:x.createdAt,updated_at:x.updatedAt,completed_at:x.completedAt,
    sort_order:i,revision:1,deleted_at:x.deletedAt||null
  })));
  let blocks=[...roots,...reviews,...dues];
  if(blocks.length){let{error}=await sb.from('blocks').upsert(blocks,{onConflict:'id'});if(error)throw error}
  if(ts.length){let{error}=await sb.from('block_tasks').upsert(ts,{onConflict:'id'});if(error)throw error}
};

/* 알림: 단일 HTML 제한상 페이지가 실행 중일 때 검사합니다.
   앱을 다시 열었을 때도 즉시 검사하여 놓친 마감을 알립니다. */
const focusDueMemo=memoId=>{
  let m=memos.find(x=>x.id===memoId);
  if(!m||m.status==='deleted')return;
  view=m.status==='archive'?'archive':'live';
  deadlineOnly=false;
  selectedTags=[];
  query='';
  flagOnly=false;
  workMode=0;
  tasksOnly=false;
  $('#search').value='';
  render();
  setTimeout(()=>{
    let card=document.querySelector(`.card[data-id="${memoId}"]`);
    if(!card)return;
    card.scrollIntoView({behavior:'smooth',block:'center'});
    card.classList.add('notification-target');
    setTimeout(()=>card.classList.remove('notification-target'),2200)
  },80)
};
const checkDueNotifications=()=>{
  if(!('Notification'in window)||Notification.permission!=='granted')return;
  let changed=false;
  memos.filter(m=>m.status==='live'&&m.dueNotify&&m.dueDate&&!memoTasksCompleted(m)).forEach(m=>{
    let d=dueTimestamp(m);if(!d||d.getTime()>Date.now())return;
    let key=`${m.dueDate}|${m.dueTime||''}`;
    if(dueNotified[m.id]===key)return;
    let body=(m.content||'').trim().replace(/\s+/g,' ').slice(0,120)||'마감된 메모가 있습니다.';
    try{
      let notification=new Notification('Review & Todo · 마감 알림',{body,tag:'review-todo-due-'+m.id});
      notification.onclick=()=>{
        try{window.focus()}catch{}
        focusDueMemo(m.id);
        notification.close()
      };
      dueNotified[m.id]=key;changed=true
    }catch(e){console.warn(e)}
  });
  if(changed)localStorage.setItem(DUE_NOTIFIED_KEY,JSON.stringify(dueNotified))
};
setInterval(checkDueNotifications,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkDueNotifications()});

/* PC에서만 우측 조작부를 2줄로 재구성합니다.
   모바일에서는 기존 DOM 구조를 그대로 유지합니다. */
const layoutDesktopCardTools=()=>{
  const desktop=window.matchMedia('(min-width:621px)').matches;

  document.querySelectorAll('.card').forEach(card=>{
    const right=card.querySelector('.right');
    if(!right)return;

    let tools=right.querySelector(':scope > .card-tools');

    if(desktop){
      if(right.querySelector(':scope > .pc-meta-row'))return;

      /* right의 날짜 텍스트 노드를 찾아 별도 span으로 보존 */
      let dateText='';
      [...right.childNodes].forEach(node=>{
        if(node.nodeType===Node.TEXT_NODE&&node.textContent.trim()){
          dateText+=node.textContent.trim();
          node.remove();
        }
      });

      if(!tools)return;
      const flag=tools.querySelector('.important');
      const work=tools.querySelector('.work-chip');

      const meta=document.createElement('div');
      meta.className='pc-meta-row';

      if(flag)meta.appendChild(flag);
      if(work)meta.appendChild(work);

      const dateSpan=document.createElement('span');
      dateSpan.className='pc-date';
      dateSpan.textContent=dateText;
      meta.appendChild(dateSpan);

      right.insertBefore(meta,tools);
    }else{
      const meta=right.querySelector(':scope > .pc-meta-row');
      if(!meta)return;

      tools=right.querySelector(':scope > .card-tools');
      const flag=meta.querySelector('.important');
      const work=meta.querySelector('.work-chip');
      const dateText=meta.querySelector('.pc-date')?.textContent||'';

      /* 모바일 기존 순서: 날짜 + 전체 버튼 한 줄 */
      right.insertBefore(document.createTextNode(dateText), right.firstChild);
      if(flag&&tools)tools.appendChild(flag);
      if(work&&tools)tools.appendChild(work);
      meta.remove();

      /* 기존 버튼 순서를 최대한 복원 */
      if(tools){
        const due=tools.querySelector('.due-open');
        const review=tools.querySelector('.review-add');
        const important=tools.querySelector('.important');
        const workChip=tools.querySelector('.work-chip');
        const archive=tools.querySelector('.archive');
        const del=tools.querySelector('.delete');
        const todo=tools.querySelector('.mobile-todo-add');
        [todo,due,review,important,workChip,archive,del].filter(Boolean).forEach(el=>tools.appendChild(el));
      }
    }
  });
};

   알람(마감) 필터에서만 마감정보를 카드 최상단의 큰 일정 제목으로 이동합니다.

*/
const r10RenderBase=render;
render=()=>{
  r10RenderBase();

  document.querySelectorAll('.card').forEach(card=>{
    const m=memos.find(x=>x.id===card.dataset.id);
    if(!m)return;

    const left=card.querySelector('.left');
    const bottomDue=left?.querySelector('.due-badge');

    /* 기존 삽입물이 있으면 매 렌더마다 정리 */
    left?.querySelector('.deadline-head')?.remove();

    if(deadlineOnly && m.dueDate && left){
      /* 알람 필터에서는 하단 마감표시를 숨기고 상단 제목으로 한 번만 표시 */
      if(bottomDue)bottomDue.classList.add('deadline-hidden');

      const state=dueState(m);
      const head=document.createElement('button');
      head.type='button';
      head.className=`deadline-head ${state}`;

/* =========================================================
   Rev. r20_260827 - Routine System
   - 기존 메모/태그/마감 화면은 그대로 유지
   - 좌측 패널의 별도 '루틴' 버튼으로 화면 전환
   - 요일 반복 루틴 생성/수정/삭제
   - 날짜별 수행 체크 + 3줄 메모
   - 오늘 진행 게이지
   - 7일/30일/90일 대시보드
   - Supabase blocks 테이블을 이용한 루틴/로그 동기화
   ========================================================= */

const ROUTINE_DATA='review_todo_routines_v1';
const ROUTINE_PREFIX='[[ROUTINE_V1]]';
const ROUTINE_LOG_PREFIX='[[ROUTINE_LOG_V1]]';

let routineStore=(()=>{
  try{
    const raw=JSON.parse(localStorage.getItem(ROUTINE_DATA)||'{}');
    return{
      routines:Array.isArray(raw.routines)?raw.routines:[],
      logs:Array.isArray(raw.logs)?raw.logs:[]
    };
  }catch{
    return{routines:[],logs:[]}
  }
})();

let appMode='memo';
let routineDate='';
let routineDashboardDays=30;
let routineEditingId=null;
let routineWeekSelection=new Set();
let routineModeSelection='check';

const localDateKey=(d=new Date())=>{
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`
};
routineDate=localDateKey();

const parseLocalDate=s=>{
  const [y,m,d]=(s||'').split('-').map(Number);
  return new Date(y,m-1,d)
};
const shiftDate=(s,days)=>{
  const d=parseLocalDate(s);d.setDate(d.getDate()+days);return localDateKey(d)
};
const routineDayLabel=s=>{
  const d=parseLocalDate(s),w=['일','월','화','수','목','금','토'];
  return `${d.getFullYear()}. ${String(d.getMonth()+1).padStart(2,'0')}. ${String(d.getDate()).padStart(2,'0')} (${w[d.getDay()]})`
};
const routineEsc=s=>esc(s??'');

const isRoutinePayload=s=>typeof s==='string'&&s.startsWith(ROUTINE_PREFIX);
const isRoutineLogPayload=s=>typeof s==='string'&&s.startsWith(ROUTINE_LOG_PREFIX);
const encodeRoutine=r=>ROUTINE_PREFIX+'\n'+JSON.stringify({
  title:r.title||'',
  goal:r.goal||'',
  weekdays:Array.isArray(r.weekdays)?r.weekdays:[],
  mode:r.mode||'check',
  createdAt:r.createdAt,
  updatedAt:r.updatedAt
});
const decodeRoutine=s=>{
  try{return JSON.parse(s.slice(s.indexOf('\n')+1))}catch{return null}
};
const encodeRoutineLog=l=>ROUTINE_LOG_PREFIX+'\n'+JSON.stringify({
  date:l.date,
  done:!!l.done,
  value:l.value??null,
  note:l.note||'',
  createdAt:l.createdAt,
  updatedAt:l.updatedAt
});
const decodeRoutineLog=s=>{
  try{return JSON.parse(s.slice(s.indexOf('\n')+1))}catch{return null}
};

const saveRoutineLocal=(rerender=true)=>{
  localStorage.setItem(ROUTINE_DATA,JSON.stringify(routineStore));
  if(rerender&&appMode==='routine')renderRoutinePage()
};

const activeRoutines=()=>routineStore.routines.filter(r=>!r.deletedAt);

const routineForDate=(r,dateKey)=>{
  if(r.deletedAt)return false;
  const d=parseLocalDate(dateKey);
  if(new Date(r.createdAt).getTime()>d.getTime()+86400000-1)return false;
  return (r.weekdays||[]).includes(d.getDay())
};

const routinesForDate=dateKey=>activeRoutines()
  .filter(r=>routineForDate(r,dateKey))
  .sort((a,b)=>Date.parse(a.createdAt)-Date.parse(b.createdAt));

const routineLog=(routineId,dateKey)=>routineStore.logs.find(l=>l.routineId===routineId&&l.date===dateKey);

const routineLogCompleted=(routine,log)=>{
  if(!log)return false;
  if((routine.mode||'check')==='check')return !!log.done;
  return log.value!==null&&log.value!==undefined
};


const ensureRoutineLog=(routineId,dateKey)=>{
  let l=routineLog(routineId,dateKey);
  if(l)return l;
  const stamp=now();
  l={id:id(),routineId,date:dateKey,done:false,value:null,note:'',createdAt:stamp,updatedAt:stamp};
  routineStore.logs.push(l);
  return l
};

const routinePeriodStats=days=>{
  const end=parseLocalDate(localDateKey()),start=new Date(end);start.setDate(end.getDate()-days+1);
  let totalScheduled=0,totalDone=0,completedDays=0,bestStreak=0,currentStreak=0;
  const dayRows=[];
  for(let i=0;i<days;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    const key=localDateKey(d);
    const rs=routinesForDate(key);
    let done=0;
    rs.forEach(r=>{if(routineLogCompleted(r,routineLog(r.id,key)))done++});
    totalScheduled+=rs.length;
    totalDone+=done;
    const full=rs.length>0&&done===rs.length;
    if(full){completedDays++;currentStreak++;bestStreak=Math.max(bestStreak,currentStreak)}else currentStreak=0;
    dayRows.push({key,total:rs.length,done,ratio:rs.length?done/rs.length:0});
  }
  return{
    totalScheduled,totalDone,completedDays,bestStreak,dayRows,
    rate:totalScheduled?Math.round(totalDone/totalScheduled*100):0
  }
};

const routineSelectedProgress=()=>{
  const rs=routinesForDate(routineDate);
  const done=rs.filter(r=>routineLogCompleted(r,routineLog(r.id,routineDate))).length;
  return{total:rs.length,done,rate:rs.length?Math.round(done/rs.length*100):0}
};

/* ---------- Routine Rendering ---------- */
const renderRoutineDashboard=()=>{
  const s=routinePeriodStats(routineDashboardDays);
  const cells=s.dayRows.map(d=>{
    const cls=d.total===0?'none':d.ratio>=1?'full':d.ratio>0?'partial':'miss';
    const tip=`${d.key} · ${d.done}/${d.total}`;
    return `<span class="routine-heat ${cls}" title="${tip}"></span>`
  }).join('');
  return `
    <section class="routine-dashboard-card">
      <div class="routine-card-head">
        <div><strong>루틴 대시보드</strong><small>전체 수행 흐름</small></div>
        <div class="routine-periods">
          ${[7,30,90].map(n=>`<button data-routine-period="${n}" class="${routineDashboardDays===n?'active':''}">${n===7?'7일':n===30?'30일':'90일'}</button>`).join('')}
        </div>
      </div>
      <div class="routine-stat-top">
        <div class="routine-ring" style="--p:${s.rate*3.6}deg"><span><b>${s.rate}%</b><small>전체 달성률</small></span></div>
        <div class="routine-stat-list">
          <div><span>완료한 날</span><b>${s.completedDays}일</b></div>
          <div><span>총 수행 횟수</span><b>${s.totalDone}회</b></div>
          <div><span>최고 연속</span><b>${s.bestStreak}일</b></div>
          <div><span>계획된 수행</span><b>${s.totalScheduled}회</b></div>
        </div>
      </div>
      <div class="routine-heat-title">최근 ${routineDashboardDays}일 달성 현황</div>
      <div class="routine-heatmap">${cells||'<span class="routine-muted">기록이 없습니다.</span>'}</div>
      <div class="routine-legend"><span><i class="full"></i>완료</span><span><i class="partial"></i>일부</span><span><i class="miss"></i>미완료</span></div>
    </section>`
};

const renderRoutinePage=()=>{
  if(!routinePage)return;
  const rs=routinesForDate(routineDate);
  const p=routineSelectedProgress();
  const today=routineDate===localDateKey();

  const cards=rs.length?rs.map(r=>{
    const log=routineLog(r.id,routineDate);
    const mode=r.mode||'check';
    const done=routineLogCompleted(r,log);
    const control=mode==='emoji'
      ? `<div class="routine-rating emoji-rating" data-rating-routine="${r.id}">

         </div>`
      : mode==='percent'
      ? `<div class="routine-rating percent-rating" data-rating-routine="${r.id}">
          ${[20,40,60,80,100].map(v=>`<button type="button" data-rating-value="${v}" class="${Number(log?.value)===v?'selected':''}">${v}%</button>`).join('')}
         </div>`
      : `<button class="routine-check ${done?'done':''}" data-routine-check="${r.id}" title="${done?'완료 취소':'완료'}"><span>✓</span></button>`;
    return `
    <article class="routine-item" data-routine-id="${r.id}">
      <div class="routine-item-top">
        <div class="routine-control">${control}</div>
        <div class="routine-copy">

      </div>

    </article>`
  }).join(''):'<div class="routine-empty">이 날짜에 예정된 루틴이 없습니다.</div>';

  routinePage.innerHTML=`
    <div class="routine-page-head">
      <div>
        <h1>루틴</h1>
        <p>매일 반복하는 일을 기록하고 흐름을 확인합니다.</p>
      </div>
      <button id="routineAdd" class="routine-add">+ 루틴 추가</button>
    </div>

    <div class="routine-grid">
      <section class="routine-today-card">
        <div class="routine-card-head">
          <div><strong>${today?'오늘의 루틴':'루틴 기록'}</strong><small>${routineDayLabel(routineDate)}</small></div>
          <div class="routine-date-nav">
            <button data-routine-shift="-1">‹</button>
            <input id="routineDateInput" type="date" value="${routineDate}">
            <button data-routine-shift="1">›</button>
          </div>
        </div>
        <div class="routine-progress-row">
          <span>${p.done} / ${p.total} 완료</span>
          <div class="routine-progress"><i style="width:${p.rate}%"></i></div>
          <b>${p.rate}%</b>
        </div>
        <div class="routine-list">${cards}</div>
      </section>

      ${renderRoutineDashboard()}
    </div>

    <section class="routine-all-card">
      <div class="routine-card-head">
        <div><strong>내 루틴 목록</strong><small>${activeRoutines().length}개 사용 중</small></div>
      </div>
      <div class="routine-all-list">
        ${activeRoutines().length?activeRoutines().map(r=>{
          const labels=weekdayDefs.filter(w=>r.weekdays.includes(w.v)).map(w=>w.t).join(' · ');
          return `<button class="routine-all-row" data-routine-edit="${r.id}">

            <span>${labels}</span>
          </button>`
        }).join(''):'<div class="routine-empty">아직 만든 루틴이 없습니다.</div>'}
      </div>
    </section>`;

  $('#routineAdd').onclick=()=>openRoutineModal(null);
  $('#routineDateInput').onchange=e=>{routineDate=e.target.value||localDateKey();renderRoutinePage()};

  routinePage.querySelectorAll('[data-routine-shift]').forEach(b=>b.onclick=()=>{
    routineDate=shiftDate(routineDate,Number(b.dataset.routineShift));renderRoutinePage()
  });

  routinePage.querySelectorAll('[data-routine-period]').forEach(b=>b.onclick=()=>{
    routineDashboardDays=Number(b.dataset.routinePeriod);renderRoutinePage()
  });

  routinePage.querySelectorAll('[data-routine-edit]').forEach(b=>b.onclick=()=>{
    const r=routineStore.routines.find(x=>x.id===b.dataset.routineEdit);if(r)openRoutineModal(r)
  });

  routinePage.querySelectorAll('[data-routine-check]').forEach(b=>b.onclick=()=>{
    const l=ensureRoutineLog(b.dataset.routineCheck,routineDate);
    l.done=!l.done;l.updatedAt=now();
    saveRoutineLocal(false);renderRoutinePage();status('로컬에 저장됨')
  });

  routinePage.querySelectorAll('[data-rating-routine]').forEach(group=>{
    group.querySelectorAll('[data-rating-value]').forEach(b=>b.onclick=()=>{
      const rid=group.dataset.ratingRoutine;
      const r=routineStore.routines.find(x=>x.id===rid);if(!r)return;
      const l=ensureRoutineLog(rid,routineDate);
      const raw=b.dataset.ratingValue;
      const next=(r.mode==='percent')?Number(raw):Number(raw);
      l.value=(Number(l.value)===next)?null:next;
      l.done=l.value!==null;
      l.updatedAt=now();
      saveRoutineLocal(false);renderRoutinePage();status('로컬에 저장됨')
    })
  });

  const autoGrowRoutineNote=t=>{
    t.style.height='auto';
    t.style.height=Math.max(34,t.scrollHeight)+'px'
  };
  routinePage.querySelectorAll('[data-routine-note]').forEach(t=>{
    autoGrowRoutineNote(t);
    t.oninput=()=>{
      autoGrowRoutineNote(t);
      const l=ensureRoutineLog(t.dataset.routineNote,routineDate);
      l.note=t.value;l.updatedAt=now();
      saveRoutineLocal(false);status('로컬에 저장됨')
    };
    t.onblur=()=>renderRoutinePage()
  });
};

    routinePage?.classList.add('hidden');
    routineNav?.classList.remove('active');
    memoModeTop?.classList.add('active');
    if(tagPicker)tagPicker.classList.remove('routine-mode-muted')
  }
};

/* 태그/메모 보기 조작을 누르면 자연스럽게 메모 화면으로 복귀 */
window.addEventListener('click',e=>{

/* ---------- Supabase Routine Sync ---------- */
/* Rev. r20_260827
   DB schema는 변경하지 않습니다.
   - 메모/루틴 root: blocks.type='note'
   - 후기/루틴 일별 기록: blocks.type='comment'
   - 할 일: 기존 block_tasks 테이블 그대로
   실제 데이터 종류는 content_md prefix로 구분합니다.
*/
const mergeRoutines=(local,remote)=>{
  const map=new Map(local.map(x=>[x.id,x]));
  remote.forEach(r=>{
    const l=map.get(r.id);
    if(!l){map.set(r.id,r);return}
    if(l.deletedAt||r.deletedAt){
      if(r.deletedAt&&!l.deletedAt){map.set(r.id,r);return}
      if(l.deletedAt&&!r.deletedAt)return;
    }
    if(Date.parse(r.updatedAt||r.createdAt)>Date.parse(l.updatedAt||l.createdAt))map.set(r.id,r)
  });
  return [...map.values()]
};
const mergeRoutineLogs=(local,remote)=>{
  const map=new Map(local.map(x=>[x.id,x]));
  remote.forEach(r=>{
    const l=map.get(r.id);
    if(!l||Date.parse(r.updatedAt||r.createdAt)>Date.parse(l.updatedAt||l.createdAt))map.set(r.id,r)
  });
  return [...map.values()]
};

const pullRoutines=async()=>{
  const {data,error}=await sb.from('blocks')
    .select('id,parent_id,type,content_md,created_at,updated_at,deleted_at')
    .eq('user_id',user.id)
    .in('type',['note','comment']);
  if(error)throw error;

  const remoteRoutines=[],remoteLogs=[];
  (data||[]).forEach(row=>{
    if(row.type==='note'&&isRoutinePayload(row.content_md)){
      const d=decodeRoutine(row.content_md);if(!d)return;
      remoteRoutines.push({
        id:row.id,
        title:d.title||'',
        goal:d.goal||'',
        weekdays:Array.isArray(d.weekdays)?d.weekdays:[],
        mode:d.mode||'check',
        createdAt:row.created_at||d.createdAt||now(),
        updatedAt:row.updated_at||d.updatedAt||row.created_at||now(),
        deletedAt:row.deleted_at||null
      })
    }else if(row.type==='comment'&&isRoutineLogPayload(row.content_md)){
      const d=decodeRoutineLog(row.content_md);if(!d||!row.parent_id)return;
      remoteLogs.push({
        id:row.id,routineId:row.parent_id,date:d.date,
        done:!!d.done,value:d.value??null,note:d.note||'',
        createdAt:row.created_at||d.createdAt||now(),
        updatedAt:row.updated_at||d.updatedAt||row.created_at||now()
      })
    }
  });
  routineStore.routines=mergeRoutines(routineStore.routines,remoteRoutines);
  routineStore.logs=mergeRoutineLogs(routineStore.logs,remoteLogs);
};

const pushRoutines=async()=>{
  const rows=[];
  routineStore.routines.forEach(r=>rows.push({
    id:r.id,user_id:user.id,parent_id:null,type:'note',
    content_md:encodeRoutine(r),created_at:r.createdAt,updated_at:r.updatedAt,
    sort_order:0,revision:1,deleted_at:r.deletedAt||null
  }));
  routineStore.logs.forEach(l=>rows.push({
    id:l.id,user_id:user.id,parent_id:l.routineId,type:'comment',
    content_md:encodeRoutineLog(l),created_at:l.createdAt,updated_at:l.updatedAt,
    sort_order:0,revision:1,deleted_at:null
  }));
  if(rows.length){
    const {error}=await sb.from('blocks').upsert(rows,{onConflict:'id'});
    if(error){
      console.error('routine blocks upsert failed',error);
      throw error
    }
  }
};

const syncRoutines=async()=>{
  if(!sb||!user||!navigator.onLine)return;
  await pullRoutines();
  await pushRoutines();
  saveRoutineLocal(false);
  if(appMode==='routine')renderRoutinePage()
};

/* 기존 memo pull이 routine root를 메모로 오인하지 않도록 최종 필터 */
const r16MemoPullBase=pull;
pull=async()=>{
  const rows=await r16MemoPullBase();
  return rows.filter(m=>!isRoutinePayload(m.content))
};

/* 혹시 이전 실행에서 루틴 row가 메모처럼 로컬에 섞였다면 제거 */
memos=memos.filter(m=>!isRoutinePayload(m.content));
localStorage.setItem(DATA,JSON.stringify(memos));

/* 기존 5분/수동 sync 흐름에 루틴 동기화를 함께 연결 */
const r16SyncBase=syncNow;
let lastRoutineSync=0;
syncNow=async force=>{
  const result=await r16SyncBase(force);
  if(!sb||!user||!navigator.onLine)return result;
  if(!force&&Date.now()-lastRoutineSync<300000)return result;
  try{
    await syncRoutines();
    lastRoutineSync=Date.now();
    status('동기화됨');
  }catch(e){
    console.error(e);
    status(`동기화 실패 · ${e?.code||e?.message||'루틴 저장 오류'}`);
  }
  return result
};

/* 초기 로그인 연결이 완료된 뒤 루틴도 한 번 가져옴 */
setTimeout(()=>{if(sb&&user)syncRoutines().catch(console.error)},2200);

const loadNoticeAtStartup=async()=>{
  noticeLoadError='';
  noticeContent='';
  noticeSignature='';
  noticeLoaded=false;

  for(const fileName of NOTICE_FILES){
    try{
      const url=new URL(fileName,window.location.href);
      const response=await fetch(url.toString(),{
        cache:'no-store',
        headers:{'Cache-Control':'no-cache'}
      });

      if(!response.ok){
        noticeLoadError=`${fileName}: HTTP ${response.status}`;
        continue
      }

      const body=(await response.text()).replace(/^\uFEFF/,'').trim();
      if(!body){
        noticeLoadError=`${fileName}: 파일이 비어 있습니다.`;
        continue
      }

      noticeContent=body;
      noticeLoaded=true;
      noticeLoadError='';
      noticeSignature=await noticeHash(body);

      if(localStorage.getItem(NOTICE_SEEN_KEY)!==noticeSignature){
        openNotice(false)
      }
      return
    }catch(e){
      noticeLoadError=`${fileName}: ${e?.message||e}`;
      console.warn('공지 파일 로딩 실패',fileName,e)
    }
  }

  noticeLoaded=true;
  console.warn('사용 가능한 공지 파일을 찾지 못했습니다.',noticeLoadError)
};

/* ---------- Immediate hashtag recognition ---------- */
const selectionTextOffset=root=>{
  const sel=window.getSelection();if(!sel||!sel.rangeCount||!root.contains(sel.focusNode))return null;
  const range=document.createRange();
  range.selectNodeContents(root);
  range.setEnd(sel.focusNode,sel.focusOffset);
  return range.toString().length
};
const restoreTextOffset=(root,offset)=>{
  if(offset===null||!root)return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  let left=offset,node;
  while((node=walker.nextNode())){
    const n=node.nodeValue?.length||0;
    if(left<=n){
      const r=document.createRange(),s=window.getSelection();
      r.setStart(node,Math.max(0,left));r.collapse(true);
      s.removeAllRanges();s.addRange(r);root.focus();return
    }
    left-=n
  }
  focusEnd(root)
};
let tagCommitTimer=0;
const commitMemoTagRecognition=el=>{
  const card=el?.closest?.('.card');if(!card)return;
  const memoId=card.dataset.id,m=memos.find(x=>x.id===memoId);if(!m)return;
  const offset=selectionTextOffset(el);
  m.content=el.innerText;
  m.updatedAt=now();
  localStorage.setItem(DATA,JSON.stringify(memos));
  status('로컬에 저장됨');
  clearTimeout(tagCommitTimer);
  tagCommitTimer=setTimeout(()=>{
    render();
    const next=document.querySelector(`.card[data-id="${memoId}"] .memo`);
    restoreTextOffset(next,offset)
  },0)
};

/* 프로젝트 목록의 기준은 메모 본문에 실제 존재하는 @프로젝트입니다.

const allProjectNames=()=>[...new Set(

};
const stripProjectTokens=(content,names=null)=>{
  const target=names?new Set(names):null;
  let s=String(content||'').replace(/(^|[\s])@([^\s@#]+)/gu,(whole,prefix,name)=>{
    if(target&&!target.has(name))return whole;
    return prefix
  });
  return s.replace(/[ \t]{2,}/g,' ').replace(/[ \t]+\n/g,'\n').replace(/\n[ \t]+/g,'\n').trim()
};
const setMemoProjects=(m,names)=>{
  if(!m)return;
  const clean=stripProjectTokens(m.content);
  const suffix=[...new Set(names)].filter(Boolean).map(name=>'@'+name).join(' ');
  m.content=(clean+(clean&&suffix?' ':'')+suffix).trim();
  m.updatedAt=now()
};

/* Native title 대신 빠른 커스텀 툴팁 */
const r22Tooltip=document.createElement('div');
r22Tooltip.className='r22-tooltip';
r22Tooltip.setAttribute('role','tooltip');
document.body.append(r22Tooltip);
let r22TooltipTimer=null,r22TooltipTarget=null;
const hideR22Tooltip=()=>{
  clearTimeout(r22TooltipTimer);
  r22Tooltip.classList.remove('show');
  if(r22TooltipTarget?.dataset.r22Tooltip&&!r22TooltipTarget.hasAttribute('title')){
    r22TooltipTarget.setAttribute('title',r22TooltipTarget.dataset.r22Tooltip)
  }
  r22TooltipTarget=null
};
const positionR22Tooltip=e=>{
  const gap=20,pad=10;
  let x=e.clientX+gap,y=e.clientY+gap;
  const w=r22Tooltip.offsetWidth||220,h=r22Tooltip.offsetHeight||36;
  if(x+w>window.innerWidth-pad)x=Math.max(pad,e.clientX-w-gap);
  if(y+h>window.innerHeight-pad)y=Math.max(pad,e.clientY-h-gap);
  r22Tooltip.style.left=x+'px';
  r22Tooltip.style.top=y+'px'
};
document.addEventListener('pointerover',e=>{
  const target=e.target.closest?.('[title]');
  if(!target)return;
  const label=target.getAttribute('title');
  if(!label)return;
  hideR22Tooltip();
  r22TooltipTarget=target;
  target.dataset.r22Tooltip=label;
  target.removeAttribute('title');
  r22Tooltip.textContent=label;
  positionR22Tooltip(e);
  r22TooltipTimer=setTimeout(()=>{
    if(r22TooltipTarget===target)r22Tooltip.classList.add('show')
  },120)
},true);
document.addEventListener('pointermove',e=>{
  if(r22TooltipTarget)positionR22Tooltip(e)
},true);
document.addEventListener('pointerout',e=>{
  if(!r22TooltipTarget)return;
  const to=e.relatedTarget;
  if(to&&r22TooltipTarget.contains?.(to))return;
  hideR22Tooltip()
},true);
document.addEventListener('pointerdown',hideR22Tooltip,true);
window.addEventListener('blur',hideR22Tooltip);

/* 편집 시작 원문을 기억해 프로젝트/@텍스트 포함 메모 변경을 확실히 동기화 */
const r27MemoEditStart=new Map();

document.addEventListener('focusin',e=>{
  const el=e.target;
  if(!el?.classList?.contains('memo'))return;
  const memoId=el.closest('.card')?.dataset.id;
  if(!memoId)return;
  if(!r27MemoEditStart.has(memoId))r27MemoEditStart.set(memoId,el.innerText)
},true);

document.addEventListener('focusout',e=>{
  const el=e.target;
  if(!el?.classList?.contains('memo'))return;

  const memoId=el.closest('.card')?.dataset.id;
  if(!memoId)return;

  const m=memos.find(x=>x.id===memoId);
  if(!m){
    r27MemoEditStart.delete(memoId);
    return
  }

  const before=r27MemoEditStart.get(memoId);
  const after=el.innerText;
  r27MemoEditStart.delete(memoId);

  if(before===undefined||before===after)return;

  m.content=after;
  m.updatedAt=now();
  localStorage.setItem(DATA,JSON.stringify(memos));
  status('변경사항 동기화 중…');

  setTimeout(()=>{
    Promise.resolve(syncNow(true)).catch(err=>{
      console.error(err);
      status('동기화 실패 · 로컬 보관 중')

  },0)
},true);
